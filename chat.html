<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইনবক্স চ্যাট - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 75px; }

        .top-nav {
            display: flex; align-items: center; padding: 14px 18px;
            background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; gap: 14px;
        }
        .back-btn {
            color: #334155; font-size: 15px; text-decoration: none;
            background: #f8fafc; border: 1px solid #e2e8f0;
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-title { font-weight: 700; font-size: 17px; color: #0f3e2e; }

        .page-content { padding: 16px; max-width: 480px; margin: 0 auto; }

        /* চ্যাট লিস্ট কার্ড */
        .chat-list-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 14px;
            display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer; text-decoration: none; color: inherit;
            transition: background 0.15s;
        }
        .chat-list-card:hover { background: #f8fafc; }
        .chat-avatar {
            width: 42px; height: 42px; border-radius: 50%; background: #e6f4ea; color: #047857;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0;
        }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-info h4 { font-size: 14px; font-weight: 700; color: #0f3e2e; margin-bottom: 2px; }
        .chat-info p { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* চ্যাট উইন্ডো (যদি ইউজার সিলেক্ট করা থাকে) */
        .chat-room-container { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; height: 75vh; }
        .chat-room-header { background: #0f3e2e; color: #fff; padding: 14px 16px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .chat-messages-scroll { flex: 1; background: #f8fafc; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .chat-bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 13px; word-break: break-word; }
        .chat-bubble.my { align-self: flex-end; background: #047857; color: #fff; }
        .chat-bubble.other { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; color: #1e293b; }

        .chat-input-area { padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
        .chat-msg-input { flex: 1; border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 12px; font-size: 13px; outline: none; }
        .chat-send-btn { background: #047857; color: #fff; border: none; padding: 0 16px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 62px;
            background: #ffffff; border-top: 1px solid #eef2f5;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { text-decoration: none; color: #8392a5; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; }
        .nav-item.active { color: #0f3e2e; }
        .nav-item i { font-size: 19px; }
    </style>
</head>
<body>

    <header class="top-nav">
        <a href="feed.html" class="back-btn" id="backBtn" style="display:none;"><i class="fa-solid fa-arrow-left"></i></a>
        <span class="nav-title" id="pageTitle">আমার ইনবক্স</span>
    </header>

    <main class="page-content">
        <!-- চ্যাট লিস্ট ভিউ -->
        <div id="chatListView">
            <div style="font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 12px;">সাম্প্রতিক কথোপকথন</div>
            <div id="conversationsContainer">
                <div style="text-align:center; color:#94a3b8; padding:40px;">চ্যাট লোড হচ্ছে...</div>
            </div>
        </div>

        <!-- একক চ্যাট রুম ভিউ -->
        <div id="chatRoomView" style="display: none;">
            <div class="chat-room-container">
                <div class="chat-room-header" id="roomHeaderName">চ্যাট</div>
                <div class="chat-messages-scroll" id="roomMessagesBox"></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-msg-input" id="roomMsgInput" placeholder="মেসেজ লিখুন...">
                    <button class="chat-send-btn" id="roomSendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="feed.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>কমিউনিটি</span></a>
        <a href="chat.html" class="nav-item active"><i class="fa-solid fa-paper-plane"></i><span>ইনবক্স</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>র‍্যাঙ্কিং</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, getDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs",
            authDomain: "kotoba-b20b3.firebaseapp.com",
            projectId: "kotoba-b20b3",
            storageBucket: "kotoba-b20b3.firebasestorage.app",
            messagingSenderId: "556955805953",
            appId: "1:556955805953:web:cef5927677815bf5e05300",
            measurementId: "G-MXH61ERTC2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatUser = urlParams.get("with");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                if (targetChatUser) {
                    openChatRoom(targetChatUser);
                } else {
                    loadConversations(user.email.toLowerCase());
                }
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadConversations(myEmail) {
            const container = document.getElementById("conversationsContainer");
            // লোকাল ইউজার ও ফলোয়িং লিস্ট থেকে চ্যাট রুম ফিল্টার করা যায়
            container.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:30px;">প্রোফাইল বা লিডারবোর্ড থেকে সরাসরি চ্যাটে যুক্ত হন</div>`;
        }

        let unsubscribeRoom = null;
        async function openChatRoom(targetEmail) {
            document.getElementById("chatListView").style.display = "none";
            document.getElementById("chatRoomView").style.display = "block";
            document.getElementById("backBtn").style.display = "flex";
            document.getElementById("pageTitle").innerText = "কথোপকথন";

            const userDoc = await getDoc(doc(db, "users", targetEmail.toLowerCase()));
            const targetName = userDoc.exists() ? (userDoc.data().userName || targetEmail.split('@')[0]) : targetEmail;
            document.getElementById("roomHeaderName").innerText = targetName;

            const chatId = [currentUser.email.toLowerCase(), targetEmail.toLowerCase()].sort().join("_");
            const box = document.getElementById("roomMessagesBox");

            if (unsubscribeRoom) unsubscribeRoom();

            unsubscribeRoom = onSnapshot(query(collection(db, "direct_chats", chatId, "messages"), orderBy("timestamp", "asc")), (snap) => {
                box.innerHTML = "";
                if (snap.empty) {
                    box.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:30px;">মেসেজ পাঠানো শুরু করুন</div>`;
                    return;
                }
                snap.forEach(m => {
                    const data = m.data();
                    const isMy = data.sender === currentUser.email.toLowerCase();
                    box.innerHTML += `<div class="chat-bubble ${isMy ? 'my' : 'other'}">${escapeHtml(data.text)}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });

            document.getElementById("roomSendBtn").onclick = async () => {
                const input = document.getElementById("roomMsgInput");
                const text = input.value.trim();
                if(!text) return;
                input.value = "";
                try {
                    await addDoc(collection(db, "direct_chats", chatId, "messages"), {
                        sender: currentUser.email.toLowerCase(),
                        text: text,
                        timestamp: Date.now()
                    });
                } catch(e) {}
            };
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
