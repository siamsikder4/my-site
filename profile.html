<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - KOTOBA</title>

    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9023379305536988"
     crossorigin="anonymous"></script>

    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            padding-bottom: 85px;
        }

        /* টপ বার */
        .top-nav {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 14px;
        }

        .back-btn {
            color: #334155;
            font-size: 15px;
            text-decoration: none;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
            background: #f1f5f9;
        }

        .nav-title {
            font-weight: 700;
            font-size: 16.5px;
            color: #0f3e2e;
        }

        .page-content {
            padding: 16px;
            max-width: 460px;
            margin: 0 auto;
        }

        /* ক্লিন প্রোফাইল কার্ড */
        .profile-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 16px 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03);
            margin-bottom: 18px;
        }

        /* সফট ও প্রফেশনাল মিনিমাল অ্যাভাটার */
        .avatar-wrap {
            position: relative;
            width: 76px;
            height: 76px;
            margin: 0 auto 12px;
        }

        .avatar-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #e6f4ea;
            color: #047857;
            border: 2px solid #a7f3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
        }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 13px;
            height: 13px;
            background: #10b981;
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        .user-name {
            font-size: 17.5px;
            font-weight: 700;
            color: #0f2e23;
            margin-bottom: 2px;
            letter-spacing: 0.2px;
        }

        .user-email {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 18px;
            font-weight: 500;
        }

        /* মিনিমল স্ট্যাটাস গ্রিড */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
        }

        .stat-item {
            background: #f8fafc;
            border: 1px solid #eef2f6;
            border-radius: 12px;
            padding: 10px 8px;
        }

        .stat-val {
            font-size: 15px;
            font-weight: 700;
            color: #047857;
            margin-bottom: 1px;
        }

        .stat-lbl {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        /* অ্যাকশন লিস্ট */
        .menu-list {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            text-decoration: none;
            color: #334155;
            font-size: 13.5px;
            font-weight: 600;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:active {
            background: #f8fafc;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-left i {
            font-size: 15px;
            color: #047857;
            width: 20px;
            text-align: center;
        }

        .menu-right {
            color: #cbd5e1;
            font-size: 11px;
        }

        .admin-item {
            background: #f0fdf4;
        }
        .admin-item .menu-left i {
            color: #047857;
        }
        .admin-item span {
            color: #065f46;
            font-weight: 700;
        }

        .support-item {
            background: #f0fdfa;
        }
        .support-item .menu-left i {
            color: #0d9488;
        }
        .support-item span {
            color: #115e59;
            font-weight: 600;
        }

        /* লগআউট বাটন */
        .logout-btn {
            width: 100%;
            background: #ffffff;
            border: 1px solid #fecdd3;
            color: #e11d48;
            padding: 12px;
            border-radius: 14px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
            box-shadow: 0 2px 4px rgba(225, 29, 72, 0.04);
        }

        .logout-btn:active {
            background: #fff1f2;
            transform: scale(0.98);
        }

        /* বটম বার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 62px;
            background: #ffffff;
            border-top: 1px solid #eef2f5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        }

        .nav-item {
            text-decoration: none;
            color: #8392a5;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: #0f3e2e;
        }

        .nav-item i {
            font-size: 18px;
        }

        /* চ্যাট মডাল UI */
        .chat-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(3px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 14px;
        }

        .chat-box-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            height: 520px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .chat-header {
            background: #0f3e2e;
            color: #ffffff;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #10b981;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .chat-header h4 {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.2;
        }

        .chat-header p {
            font-size: 11px;
            color: #a7f3d0;
        }

        .chat-close-btn {
            background: none;
            border: none;
            color: #e2e8f0;
            font-size: 20px;
            cursor: pointer;
        }

        .chat-messages-area {
            flex: 1;
            background: #f8fafc;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            max-width: 78%;
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            display: flex;
            flex-direction: column;
        }

        .chat-msg.user {
            align-self: flex-end;
            background: #047857;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .chat-msg.admin {
            align-self: flex-start;
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        .msg-time {
            font-size: 9.5px;
            opacity: 0.7;
            align-self: flex-end;
            margin-top: 3px;
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }

        .chat-input-field {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 24px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
        }

        .chat-input-field:focus {
            border-color: #047857;
            background: #ffffff;
        }

        .chat-send-btn {
            background: #047857;
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .chat-send-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <!-- টপ বার -->
    <header class="top-nav">

    <main class="page-content">

                <div class="stat-item">

            </div>
        </div>

        <!-- অ্যাকশন মেনু -->
        <div class="menu-list">
            <!-- অ্যাডমিন অপশন (ডিফল্টভাবে লুকানো) -->

            <a href="leaderboard.html" class="menu-item">

            <a href="n5-vocab.html" class="menu-item">

                <div class="menu-left">
                    <i class="fa-solid fa-robot"></i>
                    <span>AI সেনসেই চ্যাটবক্স</span>
                </div>
                <i class="fa-solid fa-chevron-right menu-right"></i>

        </div>

        <!-- লগআউট বাটন -->
        <button class="logout-btn" id="logoutBtn">

    <!-- অ্যাডমিন সাপোর্ট চ্যাট মডাল -->
    <div class="chat-modal-overlay" id="chatModalOverlay">
        <div class="chat-box-card">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-header-avatar">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <h4>অ্যাডমিন সাপোর্ট</h4>
                        <p>যেকোনো প্রশ্ন বা সমস্যা লিখুন</p>
                    </div>
                </div>
                <button class="chat-close-btn" id="closeChatBtn">&times;</button>
            </div>

            <div class="chat-messages-area" id="chatMessagesArea">
                <div style="text-align: center; color: #94a3b8; padding: 20px; font-size: 12px;">
                    কথোপকথন লোড হচ্ছে...

            </div>

            <div class="chat-input-row">
                <input type="text" id="chatInputMessage" class="chat-input-field" placeholder="এখানে মেসেজ লিখুন...">
                <button class="chat-send-btn" id="chatSendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

    </div>

    <!-- বটম বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>
        <a href="leaderboard.html" class="nav-item">
            <i class="fa-solid fa-trophy"></i>
            <span>লিডারবোর্ড</span>
        </a>
        <a href="ai-sensei.html" class="nav-item">
            <i class="fa-solid fa-robot"></i>

        <a href="profile.html" class="nav-item active">

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs",
            authDomain: "kotoba-b20b3.firebaseapp.com",
            projectId: "kotoba-b20b3",
            storageBucket: "kotoba-b20b3.firebasestorage.app",
            messagingSenderId: "556955805953",
            appId: "1:556955805953:web:cef5927677815bf5e05300",
            measurementId: "G-MXH61ERTC2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "qr.siamsikder@gmail.com";

        const avatarInitialEl = document.getElementById("avatarInitial");
        const nameEl = document.getElementById("displayUserName");
        const emailEl = document.getElementById("displayUserEmail");
        const hlCountEl = document.getElementById("hlWordCount");
        const logoutBtn = document.getElementById("logoutBtn");
        const adminOption = document.getElementById("adminOption");

        // চ্যাট ইলিমেন্টস
        const openChatBtn = document.getElementById("openChatBtn");
        const closeChatBtn = document.getElementById("closeChatBtn");
        const chatModalOverlay = document.getElementById("chatModalOverlay");
        const chatMessagesArea = document.getElementById("chatMessagesArea");
        const chatInputMessage = document.getElementById("chatInputMessage");
        const chatSendBtn = document.getElementById("chatSendBtn");

        let currentUser = null;
        let unsubscribeChat = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const displayName = user.displayName || user.email.split("@")[0];
                emailEl.innerText = user.email;
                nameEl.innerText = displayName;

                const firstChar = displayName.trim().charAt(0).toUpperCase();
                avatarInitialEl.innerText = firstChar;

                if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    adminOption.style.display = "flex";
                } else {
                    adminOption.style.display = "none";
                }

                try {
                    const docRef = doc(db, "user_highlights", user.email);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists() && docSnap.data().words) {
                        hlCountEl.innerText = docSnap.data().words.length;
                    } else {
                        const local = JSON.parse(localStorage.getItem("kotoba_n5_vocab_highlights")) || [];
                        hlCountEl.innerText = local.length;
                    }
                } catch (e) {
                    const local = JSON.parse(localStorage.getItem("kotoba_n5_vocab_highlights")) || [];
                    hlCountEl.innerText = local.length;
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // চ্যাট মডাল হ্যান্ডলিং
        openChatBtn.addEventListener("click", () => {
            if (!currentUser) return;
            chatModalOverlay.style.display = "flex";
            loadChatMessages(currentUser.email);
        });

        closeChatBtn.addEventListener("click", () => {
            chatModalOverlay.style.display = "none";
            if (unsubscribeChat) unsubscribeChat();
        });

        function loadChatMessages(userEmail) {
            const messagesRef = collection(db, "support_chats", userEmail, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                chatMessagesArea.innerHTML = "";
                if (snapshot.empty) {
                    chatMessagesArea.innerHTML = `
                        <div style="text-align: center; color: #94a3b8; padding: 30px; font-size: 13px;">
                            কোনো বার্তা নেই। আপনার সমস্যা বা প্রশ্ন লিখে পাঠান!
                        </div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const isUser = data.sender === "user";
                    const timeStr = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

                    const msgDiv = document.createElement("div");
                    msgDiv.className = `chat-msg ${isUser ? 'user' : 'admin'}`;
                    msgDiv.innerHTML = `
                        <div>${data.text}</div>
                        <div class="msg-time">${timeStr}</div>
                    `;
                    chatMessagesArea.appendChild(msgDiv);
                });

                chatMessagesArea.scrollTop = chatMessagesArea.scrollHeight;
            });
        }

        async function sendMessage() {
            const text = chatInputMessage.value.trim();
            if (!text || !currentUser) return;

            chatInputMessage.value = "";

            try {
                const userEmail = currentUser.email;
                const displayName = currentUser.displayName || userEmail.split("@")[0];

                await setDoc(doc(db, "support_chats", userEmail), {
                    userEmail: userEmail,
                    userName: displayName,
                    lastMessage: text,
                    lastUpdated: Date.now(),
                    unreadByAdmin: true
                }, { merge: true });

                await addDoc(collection(db, "support_chats", userEmail, "messages"), {
                    sender: "user",
                    text: text,
                    timestamp: Date.now()
                });
            } catch (error) {
                alert("মেসেজ পাঠাতে সমস্যা হয়েছে!");
                console.error(error);
            }
        }

        chatSendBtn.addEventListener("click", sendMessage);
        chatInputMessage.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        logoutBtn.addEventListener("click", async () => {
            if (confirm("আপনি কি প্রোফাইল থেকে বের হতে চান?")) {
                await signOut(auth);
                window.location.href = "login.html";
            }
        });
    </script>
</body>
