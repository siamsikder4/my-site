<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N4 ব্যাকরণ সমগ্র - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Hind+Siliguri:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Index পেজের জাপানিজ কালার প্যালেট */
            --paper: #fbf7ef;
            --ink: #182620;
            --pine: #0B4A38;
            --jade: #147A57;
            --clay: #B6472E;
            --gold: #A9781F;
            --mist: #7C8A82;
            --line: #E9E2D3;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding-bottom: 85px;
            min-height: 100vh;
        }

        /* টপ নেভিগেশন */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(251, 247, 239, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--pine);
            background: #F0EAD9;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .back-btn:active { transform: scale(0.92); }

        .logo-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--pine);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .level-pill {
            background: var(--pine);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .container {
            padding: 14px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* সার্চ বক্স */
        .search-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .search-wrap input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
            background: var(--card-bg);
            color: var(--ink);
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.03);
            transition: border-color 0.2s;
        }

        .search-wrap input:focus {
            border-color: var(--jade);
        }

        .search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mist);
            font-size: 14px;
        }

        .subtitle-bar {
            text-align: center;
            font-size: 12.5px;
            color: var(--mist);
            font-weight: 600;
            margin-bottom: 16px;
            background: #F0EAD9;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }

        /* ভিউ ১: লেসন গ্রিড (ছবি ১ এর মতো) */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-left: 4px solid var(--jade);
            border-radius: 14px;
            padding: 15px 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 104px;
        }

        .lesson-card:active {
            transform: scale(0.97);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .l-badge {
            background: #E6F3EC;
            color: var(--jade);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .kanji-lesson-tag {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 12px;
            color: var(--mist);
            font-weight: 700;
        }

        .card-lesson-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .card-lesson-desc {
            font-size: 11px;
            color: var(--mist);
            line-height: 1.35;
        }

        .card-arrow {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            color: #cbd5e1;
            font-size: 11px;
        }

        /* ভিউ ২: লেসন ডিটেইল ভিউ (ছবি ২ ও ৩ এর মতো) */
        .detail-view {
            display: none;
        }

        .detail-header-wrap {
            text-align: center;
            margin-bottom: 20px;
            padding: 8px 4px;
        }

        .detail-main-title {
            font-size: 21px;
            font-weight: 800;
            color: var(--pine);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .detail-sub-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--mist);
        }

        /* রুল অ্যাকর্ডিয়ন কার্ড (ছবি ২ এর ডার্ক গ্রিন বক্স) */
        .rule-card {
            background: var(--card-bg);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: 0 3px 6px rgba(11, 74, 56, 0.03);
            transition: all 0.2s ease;
        }

        .rule-header {
            background: var(--pine);
            color: #ffffff;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            gap: 10px;
            transition: background 0.15s ease;
        }

        .rule-header:active {
            background: #093c2d;
        }

        .rule-header-left {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
        }

        .rule-header-left i.book-icon {
            font-size: 15px;
            margin-top: 3px;
            opacity: 0.9;
        }

        .rule-title-text {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.45;
            letter-spacing: 0.2px;
        }

        .rule-chevron {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }

        .rule-card.open .rule-chevron {
            transform: rotate(90deg);
            color: #ffffff;
        }

        /* রুল ডিটেইল বডি (ছবি ৩ এর মতো) */
        .rule-body {
            display: none;
            padding: 18px 16px;
            background: #ffffff;
            border-top: 1px solid var(--line);
        }

        .rule-card.open .rule-body {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rule-desc {
            font-size: 13px;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 12px;
        }

        /* সিনট্যাক্স / ফর্মুলা বক্স */
        .formula-box {
            background: #FAF7F0;
            border: 1px dashed #D2DDD6;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--pine);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .formula-box strong {
            color: var(--clay);
        }

        .sub-heading-point {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--pine);
            margin: 14px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* উদাহরণ তালিকা */
        .examples-wrapper {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-top: 8px;
        }

        .example-item {
            background: #FAF9F5;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 13px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .ex-text-wrap {
            flex: 1;
        }

        .jp-sentence {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.45;
            margin-bottom: 3px;
        }

        .bn-sentence {
            font-size: 12px;
            color: var(--mist);
            line-height: 1.4;
        }

        .speak-btn {
            background: #E6F3EC;
            border: 1px solid #CCE7DC;
            color: var(--jade);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .speak-btn:active {
            transform: scale(0.9);
            background: var(--jade);
            color: #ffffff;
        }

        /* লেসন জাম্প ন্যাভবার */
        .lesson-jump-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 26px;
            margin-bottom: 20px;
            padding: 16px 8px;
            position: relative;
        }

        .lesson-jump-nav::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 20%;
            height: 60%;
            width: 1px;
            background-color: var(--line);
            transform: translateX(-50%);
        }

        .jump-btn {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 48%;
        }

        .jump-btn.prev-btn {
            align-items: flex-start;
            text-align: left;
        }

        .jump-btn.next-btn {
            align-items: flex-end;
            text-align: right;
        }

        .jump-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--jade);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .jump-title {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--pine);
            line-height: 1.3;
        }

        .jump-btn:disabled,
        .jump-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ফিক্সড বটম বার */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(251, 247, 239, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: var(--mist);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .nav-item.active { color: var(--jade); }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header class="top-nav">
        <div class="nav-left">
            <button class="back-btn" id="navBackBtn" onclick="handleBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo-text">
                KOTOBA <span class="level-pill">N4 GRAMMAR</span>
            </div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: var(--jade);">লেসন ২৬-৫০</div>
    </header>

    <main class="container">

        <!-- ভিউ ১: লেসন গ্রিড ভিউ (ছবি ১) -->
        <div id="lessonGridView">
            <!-- সার্চ বক্স -->
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="লেসন বা ব্যাকরণের বিষয় খুঁজুন..." onkeyup="filterLessons()">
            </div>

            <div class="subtitle-bar">লেসন নির্বাচন করুন • সম্পূর্ণ ২৫টি ব্যাকরণ লেসন</div>
            <div class="lesson-grid" id="lessonsGridContainer"></div>
        </div>

        <!-- ভিউ ২: লেসন ডিটেইল ভিউ (ছবি ২ ও ৩) -->
        <div id="lessonDetailView" class="detail-view">
            <div class="detail-header-wrap">
                <h2 class="detail-main-title" id="detailMainTitle">N4_ব্যাকরণ লেসন ০১</h2>
                <div class="detail-sub-title" id="detailSubTitle">লেসন ০১ (Grammar/ব্যাকরণ) এর ব্যাখ্যা</div>
            </div>

            <!-- রুলস অ্যাকর্ডিয়ন লিস্ট -->
            <div id="rulesListContainer"></div>

            <!-- প্রিভিয়াস ও নেক্সট জাম্প বাটন -->
            <div class="lesson-jump-nav">
                <button class="jump-btn prev-btn" id="btnPrevLesson" onclick="goToPrevLesson()">
                    <span class="jump-label">PREVIOUS</span>
                    <span class="jump-title" id="prevLessonTitle">লেসন ০০</span>
                </button>
                <button class="jump-btn next-btn" id="btnNextLesson" onclick="goToNextLesson()">
                    <span class="jump-label">NEXT</span>
                    <span class="jump-title" id="nextLessonTitle">লেসন ০২</span>
                </button>
            </div>
        </div>

    </main>

    <!-- বটম বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>লিডারবোর্ড</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script>
        // N4 সম্পূর্ণ ২৫টি লেসনের বিস্তারিত ডাটাবেস (Minna no Nihongo Lesson 26 to 50 = N4 L-01 to L-25)
        const grammarData = {
            1: {
                lessonNo: 1,
                minnaLesson: 26,
                title: "কারণ ও ব্যাখ্যা",
                kanji: "第1課",
                rules: [
                    {
                        title: "Rule ①: V/A/N } plain form } んです",
                        desc: "কথা বলার সময় কোনো বিষয়ের কারণ বা পেছনের যুক্তি ব্যাখ্যা করতে বা জানতে চাইতে んです ব্যবহৃত হয়।",
                        formula: "Verb / い-adj (Plain) + んです<br>な-adj / Noun (Plain) + なんです (だ এর বদলে な)",
                        examples: [
                            { jp: "どうして おくれたんですか。", bn: "কেন দেরি হলো? (কারণ জানতে চাওয়া)" },
                            { jp: "バスが こなかったんです。", bn: "আসলে বাস আসেনি বলে দেরি হয়েছে।" },
                            { jp: "カラオケは あまり すきじゃないんです。", bn: "আসলে কারাওকে খুব একটা পছন্দ করি না।" }
                        ]
                    },
                    {
                        title: "Rule ②: Vて-form いただけませんか",
                        desc: "কারো কাছে বিনম্রভাবে কোনো সাহায্য বা রিকোয়েস্ট (অনুরোধ) করার জন্য ব্যবহৃত হয়। এটি てください-এর চেয়ে অনেক বেশি ভদ্র রূপ।",
                        formula: "Verb (て-form) + いただけませんか",
                        examples: [
                            { jp: "いい せんせいを しょうかいして いただけませんか。", bn: "একজন ভালো শিক্ষকের সাথে পরিচয় করিয়ে দেবেন কি?" },
                            { jp: "日本語を 教えて いただけませんか。", bn: "আমাকে জাপানি ভাষা শিখিয়ে দেবেন কি?" }
                        ]
                    },
                    {
                        title: "Rule ③: Interrogative Vた-form ら いいですか",
                        desc: "কোনো কাজ কীভাবে, কোথায় বা কখন করলে সবচেয়ে ভালো হবে সে বিষয়ে কারো পরামর্শ (Advice) চাইতে ব্যবহৃত হয়।",
                        formula: "প্রশ্নবোধক শব্দ (Interrogative) + Verb (たら-form) + いいですか",
                        examples: [
                            { jp: "どこで カメラを かったら いいですか。", bn: "কোথা থেকে ক্যামেরা কিনলে ভালো হবে?" },
                            { jp: "なにを もって いったら いいですか。", bn: "কী নিয়ে গেলে ভালো হবে?" }
                        ]
                    },
                    {
                        title: "Rule ④: N (Object) は 好き / 嫌い / 上手 / 下手 / あります",
                        desc: "সুনির্দিষ্ট কোনো অবজেক্টের ওপর জোর দিয়ে তার পছন্দ, অপছন্দ, দক্ষতা বা উপস্থিতি প্রকাশ করতে অবজেক্টের পর は ব্যবহৃত হয়।",
                        formula: "Noun (Object) + は + 好き/嫌い/上手/下手/あります",
                        examples: [
                            { jp: "スポーツは なにが すきですか。", bn: "খেলাধুলার মধ্যে কোনটি আপনার পছন্দ?" }
                        ]
                    }
                ]
            },
            2: {
                lessonNo: 2,
                minnaLesson: 27,
                title: "করার ক্ষমতা ও সক্ষমতা",
                kanji: "第2課",
                rules: [
                    {
                        title: "Rule ①: Potential Verb (সম্ভাবনামূলক ক্রিয়া - 可能形)",
                        desc: "কোনো কাজ করতে পারার সামর্থ্য বা যোগ্যতা প্রকাশ করে। এটি N5-এর ことができます-এর সংক্ষিপ্ত ও বহুল ব্যবহৃত রূপ।",
                        formula: "G1: u → e + ます (書く → 書けます)<br>G2: Stem + られます (食べる → 食べられます)<br>G3: できます, 来られます (こられます)",
                        examples: [
                            { jp: "ミラーさんは かんじが よめます。", bn: "মিলার বাবু কাঞ্জি পড়তে পারেন।" },
                            { jp: "ひとりで びょういんへ いけますか。", bn: "একা হাসপাতালে যেতে পারবেন কি?" }
                        ]

        // লেসন ১১ থেকে ২৫ পর্যন্ত স্বয়ংক্রিয়ভাবে জেনারেট করা

        // লেসন গ্রিড রেন্ডার
        function renderLessonGrid() {
            const container = document.getElementById("lessonsGridContainer");
            container.innerHTML = "";

            for (let i = 1; i <= 25; i++) {
                const item = grammarData[i];
                const card = document.createElement("div");
                card.className = "lesson-card";
                card.setAttribute("data-key", `lesson ${i} লেসন ${toBn(i)} ${item.title} ${item.kanji}`);
                card.onclick = () => openLessonDetail(i);

                card.innerHTML = `
                    <div class="card-top">
                        <span class="l-badge">L-${i < 10 ? '0' + i : i}</span>
                        <span class="kanji-lesson-tag">${item.kanji}</span>

                    <div class="card-lesson-desc">${item.title}</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                `;
                container.appendChild(card);
            }
        }

        // লেসন ডিটেইল ওপেন
        function openLessonDetail(lessonNo, pushHistory = true) {
            const item = grammarData[lessonNo] || grammarData[1];
            currentActiveLesson = lessonNo;

            document.getElementById("lessonGridView").style.display = "none";
            document.getElementById("lessonDetailView").style.display = "block";

            const formattedNo = lessonNo < 10 ? `০${toBn(lessonNo)}` : toBn(lessonNo);
            document.getElementById("detailMainTitle").innerText = `N4_ব্যাকরণ লেসন ${formattedNo}`;
            document.getElementById("detailSubTitle").innerText = `লেসন ${formattedNo} (Grammar/ব্যাকরণ) এর ব্যাখ্যা`;

            const rulesContainer = document.getElementById("rulesListContainer");
            rulesContainer.innerHTML = "";

            item.rules.forEach((r, idx) => {
                const ruleCard = document.createElement("div");
                ruleCard.className = `rule-card ${idx === 0 ? 'open' : ''}`;

                let exHtml = r.examples.map(ex => `
                    <div class="example-item">
                        <div class="ex-text-wrap">
                            <div class="jp-sentence">${ex.jp}</div>
                            <div class="bn-sentence">${ex.bn}</div>
                        </div>
                        <button class="speak-btn" onclick="speakText('${ex.jp}')" title="উচ্চারণ শুনুন">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                `).join('');

                ruleCard.innerHTML = `
                    <div class="rule-header" onclick="toggleRuleCard(this)">
                        <div class="rule-header-left">
                            <i class="fa-solid fa-book-open book-icon"></i>
                            <span class="rule-title-text">${r.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right rule-chevron"></i>
                    </div>
                    <div class="rule-body">
                        <p class="rule-desc">${r.desc}</p>
                        ${r.formula ? `<div class="formula-box">${r.formula}</div>` : ''}
                        <div class="sub-heading-point"><i class="fa-solid fa-circle-check" style="color:var(--jade);"></i> উদাহরণ বাক্য:</div>
                        <div class="examples-wrapper">${exHtml}</div>
                    </div>
                `;
                rulesContainer.appendChild(ruleCard);
            });

            updateJumpButtons();
            window.scrollTo({ top: 0, behavior: "smooth" });

            if (pushHistory) {
                history.pushState({ view: "detail", lesson: lessonNo }, "");
            }
        }

        // রুল অ্যাকর্ডিয়ন টগল
        function toggleRuleCard(header) {
            const currentCard = header.parentElement;
            const isAlreadyOpen = currentCard.classList.contains("open");

            document.querySelectorAll(".rule-card").forEach(c => c.classList.remove("open"));

            if (!isAlreadyOpen) {
                currentCard.classList.add("open");
            }
        }

        // জাম্প বাটন আপডেট
        function updateJumpButtons() {
            const prevBtn = document.getElementById("btnPrevLesson");
            const nextBtn = document.getElementById("btnNextLesson");
            const prevTitle = document.getElementById("prevLessonTitle");
            const nextTitle = document.getElementById("nextLessonTitle");

            const prevNum = currentActiveLesson - 1;
            const nextNum = currentActiveLesson + 1;

            if (prevNum < 1) {
                prevBtn.classList.add("disabled");
                prevTitle.innerText = "শুরু";
            } else {
                prevBtn.classList.remove("disabled");
                prevTitle.innerText = `লেসন ${prevNum < 10 ? '০' + toBn(prevNum) : toBn(prevNum)}`;
            }

            if (nextNum > 25) {
                nextBtn.classList.add("disabled");
                nextTitle.innerText = "শেষ";
            } else {
                nextBtn.classList.remove("disabled");
                nextTitle.innerText = `লেসন ${nextNum < 10 ? '০' + toBn(nextNum) : toBn(nextNum)}`;
            }
        }

        function goToPrevLesson() {
            if (currentActiveLesson > 1) {
                openLessonDetail(currentActiveLesson - 1);
            }
        }

        function goToNextLesson() {
            if (currentActiveLesson < 25) {
                openLessonDetail(currentActiveLesson + 1);
            }
        }

        // ব্যাক বাটন হ্যান্ডলার
        function handleBack(fromHistory = false) {
            if (document.getElementById("lessonDetailView").style.display === "block") {
                document.getElementById("lessonDetailView").style.display = "none";
                document.getElementById("lessonGridView").style.display = "block";
                window.scrollTo({ top: 0, behavior: "smooth" });

                if (!fromHistory && history.state && history.state.view === "detail") {
                    history.back();
                }
            } else {
                window.location.href = "index.html";
            }
        }

        // ব্রাউজার হিস্ট্রি সাপোর্ট
        window.addEventListener("popstate", (event) => {
            if (event.state && event.state.view === "detail") {
                openLessonDetail(event.state.lesson, false);
            } else {
                handleBack(true);
            }
        });

        // সার্চ ফিল্টার
        function filterLessons() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const cards = document.querySelectorAll(".lesson-card");

            cards.forEach(card => {
                const key = card.getAttribute("data-key").toLowerCase();
                if (key.includes(query)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // জাপানি উচ্চারণ (TTS)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const clean = text.split('（')[0].split('(')[0];
                const utterance = new SpeechSynthesisUtterance(clean);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toBn(n) {
            const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return n.toString().split('').map(d => digits[d] || d).join('');
        }

        history.replaceState({ view: "grid" }, "");
        renderLessonGrid();
    </script>
</body>
</html>
