<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N4 ব্যাকরণ সমগ্র (লেসন ২৬-৫০) - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Hind+Siliguri:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper: #fbf7ef;
            --ink: #182620;
            --pine: #0B4A38;
            --jade: #147A57;
            --clay: #B6472E;
            --gold: #A9781F;
            --mist: #7C8A82;
            --line: #E9E2D3;
            --card-bg: #ffffff;
            --highlight: #ffeaa7;
            --highlight-text: #533f03;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding-bottom: 85px;
            min-height: 100vh;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(251, 247, 239, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--pine);
            background: #F0EAD9;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .back-btn:active { transform: scale(0.92); }

        .logo-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--pine);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .level-pill {
            background: var(--pine);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .container {
            padding: 14px 16px;
            max-width: 520px;
            margin: 0 auto;
        }

        .search-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .search-wrap input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
            background: var(--card-bg);
            color: var(--ink);
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.03);
            transition: border-color 0.2s;
        }

        .search-wrap input:focus {
            border-color: var(--jade);
        }

        .search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mist);
            font-size: 14px;
        }

        .subtitle-bar {
            text-align: center;
            font-size: 12.5px;
            color: var(--mist);
            font-weight: 600;
            margin-bottom: 16px;
            background: #F0EAD9;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-left: 4px solid var(--jade);
            border-radius: 14px;
            padding: 15px 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 108px;
        }

        .lesson-card:active { transform: scale(0.97); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .l-badge {
            background: #E6F3EC;
            color: var(--jade);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .kana-lesson-tag {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 11.5px;
            color: var(--mist);
            font-weight: 700;
        }

        .card-lesson-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .card-lesson-desc {
            font-size: 11px;
            color: var(--mist);
            line-height: 1.35;
        }

        .card-arrow {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            color: #cbd5e1;
            font-size: 11px;
        }

        .detail-view { display: none; }

        .detail-header-wrap {
            text-align: center;
            margin-bottom: 18px;
            padding: 6px 4px;
        }

        .detail-main-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--pine);
            margin-bottom: 4px;
        }

        .detail-sub-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--mist);
        }

        .rule-card {
            background: var(--card-bg);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: 0 3px 6px rgba(11, 74, 56, 0.03);
            transition: all 0.2s ease;
        }

        .rule-header {
            background: var(--pine);
            color: #ffffff;
            padding: 13px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            gap: 10px;
            transition: background 0.15s ease;
        }

        .rule-header:active { background: #093c2d; }

        .rule-header-left {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
        }

        .rule-header-left i.book-icon {
            font-size: 14px;
            margin-top: 3px;
            color: #ffffff;
            opacity: 0.9;
        }

        .rule-title-text {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.5;
            white-space: pre-line;
            font-family: 'Noto Sans JP', 'Hind Siliguri', sans-serif;
        }

        .rule-chevron {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }

        .rule-card.open .rule-chevron {
            transform: rotate(90deg);
            color: #ffffff;
        }

        .rule-body {
            display: none;
            padding: 16px 14px;
            background: #ffffff;
            border-top: 1px solid var(--line);
        }

        .rule-card.open .rule-body {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rule-desc {
            font-size: 13px;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 12px;
        }

        .formula-box {
            background: #FAF7F0;
            border: 1px dashed #D2DDD6;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--pine);
            margin-bottom: 14px;
            line-height: 1.7;
            font-family: 'Noto Sans JP', 'Hind Siliguri', sans-serif;
        }

        .formula-box strong { color: var(--clay); }

        .point-item {
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 3px solid var(--jade);
        }

        .point-title {
            font-size: 12.5px;
            font-weight: 800;
            color: var(--pine);
            margin-bottom: 3px;
        }

        .point-desc {
            font-size: 12px;
            color: #4B5A52;
            line-height: 1.6;
        }

        .note-box {
            background: #fff8eb;
            border: 1px solid #f6dca7;
            border-radius: 8px;
            padding: 9px 12px;
            margin: 12px 0;
            font-size: 12px;
            color: #7c5208;
            line-height: 1.6;
        }

        .sub-heading-point {
            font-size: 12.5px;
            font-weight: 800;
            color: var(--pine);
            margin: 14px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .examples-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .example-item {
            background: #FAF9F5;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .ex-text-wrap { flex: 1; }

        .jp-sentence {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.5;
            margin-bottom: 3px;
        }

        mark.hl {
            background-color: var(--highlight);
            color: var(--highlight-text);
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 800;
            border-bottom: 2px solid var(--gold);
        }

        .bn-sentence {
            font-size: 12px;
            color: var(--mist);
            line-height: 1.4;
        }

        .speak-btn {
            background: #E6F3EC;
            border: 1px solid #CCE7DC;
            color: var(--jade);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .speak-btn:active {
            transform: scale(0.9);
            background: var(--jade);
            color: #ffffff;
        }

        .lesson-jump-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            margin-bottom: 18px;
            padding: 14px 8px;
            position: relative;
        }

        .lesson-jump-nav::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 20%;
            height: 60%;
            width: 1px;
            background-color: var(--line);
            transform: translateX(-50%);
        }

        .jump-btn {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 48%;
        }

        .jump-btn.prev-btn { align-items: flex-start; text-align: left; }
        .jump-btn.next-btn { align-items: flex-end; text-align: right; }

        .jump-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--jade);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .jump-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--pine);
            line-height: 1.3;
        }

        .jump-btn:disabled, .jump-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 62px;
            background: rgba(251, 247, 239, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: var(--mist);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .nav-item.active { color: var(--jade); }
        .nav-item i { font-size: 17px; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <button class="back-btn" id="navBackBtn" onclick="handleBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo-text">
                KOTOBA <span class="level-pill">N4 GRAMMAR</span>
            </div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: var(--jade);">লেসন ২৬-৫০</div>
    </header>

    <main class="container">
        <!-- ভিউ ১: লেসন তালিকা -->
        <div id="lessonGridView">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="লেসন নম্বর বা ব্যাকরণের টপিক দিয়ে খুঁজুন..." onkeyup="filterLessons()">
            </div>

            <div class="subtitle-bar">লেসন নির্বাচন করুন • সম্পূর্ণ ২৫টি ব্যাকরণ লেসন</div>
            <div class="lesson-grid" id="lessonsGridContainer"></div>
        </div>

        <!-- ভিউ ২: লেসন বিস্তারিত -->
        <div id="lessonDetailView" class="detail-view">
            <div class="detail-header-wrap">
                <h2 class="detail-main-title" id="detailMainTitle">লেসন ২৬</h2>
                <div class="detail-sub-title" id="detailSubTitle">লেসন ২৬ এর বিস্তারিত ব্যাকরণ</div>
            </div>

            <div id="rulesListContainer"></div>

            <div class="lesson-jump-nav">
                <button class="jump-btn prev-btn" id="btnPrevLesson" onclick="goToPrevLesson()">
                    <span class="jump-label">PREVIOUS</span>
                    <span class="jump-title" id="prevLessonTitle">লেসন ২৫</span>
                </button>
                <button class="jump-btn next-btn" id="btnNextLesson" onclick="goToNextLesson()">
                    <span class="jump-label">NEXT</span>
                    <span class="jump-title" id="nextLessonTitle">লেসন ২৭</span>
                </button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>লিডারবোর্ড</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script>
        // আপনার নতুন পিডিএফ (N4 V+G) থেকে সংগৃহীত পূর্ণাঙ্গ ২৫টি লেসনের ব্যাকরণ ডাটাবেস
        const grammarData = {
            26: {
                minnaLesson: 26,
                title: "অভিব্যক্তি ও ব্যাখ্যা (んです)",
                kana: "だいにじゅうろっか",
                rules: [
                    {
                        title: "Rule 1: Plain Form + んです (কারণ, ব্যাখ্যা ও অভিব্যক্তি)",
                        desc: "কোনো বিষয় বা ঘটনার কারণ (Explanation) জানার জন্য んですか দিয়ে প্রশ্ন করা হয় এবং উত্তরে んです দিয়ে বলা হয়। কথ্য ভাষায় んです এবং লিখিত ভাষায় のです ব্যবহৃত হয়।",
                        formula: "<strong>Verb (Plain)</strong> + んです<br><strong>い-adj (Plain)</strong> + んです<br><strong>な-adj / Noun</strong> + <strong>なんです</strong> (だ হবে না, な হবে)",
                        note: "খেয়াল রাখতে হবে, যখন んですか এর প্রয়োজন নেই তখন তা ব্যবহার করলে শ্রোতার কাছে অদ্ভুত বা হাস্যকর শোনাতে পারে।",
                        examples: [
                            { jp: "あめが ふっている<mark class='hl'>んですか</mark>。", bn: "বৃষ্টি হচ্ছে কি? (হ্যাঁ, বৃষ্টি হচ্ছে)" },
                            { jp: "どうして おくれた<mark class='hl'>んですか</mark>。･･･バスが こなかった<mark class='hl'>んです</mark>。", bn: "কেন দেরি করেছিলে? বাস আসছিল না বলে।" },
                            { jp: "どうした<mark class='hl'>んですか</mark>。･･･ちょっと きぶんが わるい<mark class='hl'>んです</mark>。", bn: "কী হয়েছে? একটু শরীর খারাপ লাগছে।" }
                        ]
                    },
                    {
                        title: "Rule 1.1: 〜んですが、〜 (অনুরোধ ও দাওয়াত)",
                        desc: "んですが দিয়ে কথা শুরু করে কাউকে কোনো অনুরোধ (Request) বা দাওয়াত (Invitation) করার ভূমিকা টানা হয়।",
                        formula: "<strong>Plain Form</strong> + <strong>んですが</strong>、[অনুরোধ/আমন্ত্রণ]",
                        examples: [
                            { jp: "あたまが いたい<mark class='hl'>んですが</mark>、かえっても いいですか。", bn: "মাথা ব্যথা করছে, আমি কি বাড়ি ফিরে যেতে পারি?" },
                            { jp: "らいしゅう ともだちと スキーに いく<mark class='hl'>んですが</mark>、ミラーさんも いっしょに いきませんか。", bn: "আগামী সপ্তাহে বন্ধুর সাথে স্কি করতে যাব, মিলার সাহেবও কি সাথে যাবেন?" },
                            { jp: "おゆが でない<mark class='hl'>んですが</mark>･････。", bn: "গরম পানি বের হচ্ছে না যে･････।" }
                        ]
                    },
                    {
                        title: "Rule 2: Vて-form + いただけませんか (মার্জিত অনুরোধ)",
                        desc: "এর অর্থ 'করে দেবেন কি?'। কারও কাছে বিনীতভাবে অনুরোধ করার জন্য てください এর অতি ভদ্র রূপ হিসেবে এটি ব্যবহৃত হয়।",
                        formula: "<strong>Verb (て-form)</strong> + <strong>いただけませんか</strong>",
                        examples: [
                            { jp: "いい せんせいを しょうかいして <mark class='hl'>いただけませんか</mark>。", bn: "ভালো শিক্ষকের সাথে পরিচয় করিয়ে দেবেন কি?" },
                            { jp: "しりょうが ほしいんですが、おくって <mark class='hl'>いただけませんか</mark>。", bn: "ডকুমেন্ট দরকার ছিল, পাঠিয়ে দেবেন কি?" },
                            { jp: "かきかたが わからないんですが、おしえて <mark class='hl'>いただけませんか</mark>。", bn: "লেখার নিয়ম বুঝতে পারছি না, শিখিয়ে দেবেন কি?" }
                        ]
                    },
                    {
                        title: "Rule 3: প্রশ্নবোধক + Vた-form + ら いいですか (পরামর্শ চাওয়া)",
                        desc: "'কী করলে ভালো হয়?'—কোনো পরিস্থিতিতে অভিজ্ঞ কারও কাছ থেকে উপযুক্ত পরামর্শ বা উপদেশ চাওয়ার জন্য ব্যবহৃত হয়।",
                        formula: "<strong>প্রশ্নবোধক শব্দ (どこ / どう)</strong> + <strong>Verb (たら-form)</strong> + <strong>いいですか</strong>",

                rules: [
                    {
                        title: "Rule 1: Causative Verb রূপান্তর (しえきけい)",
                        desc: "অন্যকে দিয়ে জোর করে বা অনুমতি দিয়ে কোনো কাজ করিয়ে নেওয়া বোঝায়।",
                        formula: "<strong>Group 1:</strong> い-কলাম → あ-কলাম + せます (いきます → いかせます)<br><strong>Group 2:</strong> ます কেটে させます (たべます → たべさせます)<br><strong>Group 3:</strong> きます → <strong>こさせます</strong> | します → <strong>させます</strong>",
                        examples: [
                            { jp: "むすめを じゆうに <mark class='hl'>あそばせました</mark>。", bn: "মেয়েকে স্বাধীনভাবে খেলা করতে দিয়েছিলাম।" }
                        ]
                    },
                    {
                        title: "Rule 2: ব্যক্তিকে を / に Causative",
                        desc: "অকর্মক ক্রিয়া হলে ব্যক্তিকে を এবং সকর্মক ক্রিয়া হলে ব্যক্তিকে に পার্টিক্যাল বসে।",
                        formula: "অকর্মক: <strong>ব্যক্তি を Causative</strong> | সকর্মক: <strong>ব্যক্তি に বস্তু を Causative</strong>",
                        examples: [
                            { jp: "ぶちょうは ミラーさん<mark class='hl'>を</mark> アメリカへ しゅっちょう<mark class='hl'>させました</mark>。", bn: "ম্যানেজার মিলার সাহেবকে আমেরিকা ব্যবসায়িক সফরে পাঠিয়েছিলেন।" },
                            { jp: "せんせいは せいと<mark class='hl'>に</mark> いけんを <mark class='hl'>いわせました</mark>。", bn: "শিক্ষক ছাত্রদের স্বাধীনভাবে মতামত প্রকাশ করতে দিয়েছিলেন।" }
                        ]
                    },
                    {
                        title: "Rule 3: Causative て-form + いただけませんか (অনুমতি চাওয়া)",
                        desc: "আমাকে দয়া করে কোনো কাজ করতে দেওয়ার অনুমতি দেবেন কি—এমন বিনম্র প্রার্থনা।",
                        formula: "<strong>Causative Verb (て-form)</strong> + <strong>いただけませんか</strong>",
                        examples: [
                            { jp: "すみませんが、あした <mark class='hl'>やすませて いただけませんか</mark>。", bn: "দুঃখিত, আগামীকাল আমাকে ছুটি দেবেন কি?" },
                            { jp: "ともだちの けっこんしきが あるので、はやく <mark class='hl'>かえらせて いただけませんか</mark>。", bn: "বন্ধুর বিয়ে আছে বলে দ্রুত ফিরে যেতে দেবেন কি?" }
                        ]
                    }
                ]
            },
            49: {
                minnaLesson: 49,
                title: "সম্মানসূচক ভাষা (そんけいご - Respectful)",
                kana: "だいにじゅうきゅうか",
                rules: [
                    {
                        title: "Rule 1: そんけいご Passive রূপান্তর",
                        desc: "সম্মানিত ব্যক্তির কাজকে সম্মান প্রদর্শন করতে Passive Verb ব্যবহার করা যায়।",
                        formula: "G1: あ-কলাম + れます (あわれます) | G2: られます (たべられます) | きます→こられます | します→されます",
                        examples: [
                            { jp: "いとう せんせいは さっき <mark class='hl'>こられました</mark>。", bn: "ইতো শিক্ষক কিছুক্ষণ আগে এসেছিলেন।" }
                        ]
                    },
                    {
                        title: "Rule 2: お + Verbます কেটে + に なります",
                        desc: "সাধারণ ক্রিয়ার পূর্বে お এবং শেষে に なります যোগ করে অতি মার্জিত করা।",
                        formula: "<strong>お + Verb (ます কেটে) + に なります</strong>",
                        examples: [
                            { jp: "しゃちょうは <mark class='hl'>おかえりに なりました</mark>。", bn: "কোম্পানি প্রধান বাড়ি ফিরে গেছেন।" }
                        ]
                    },
                    {
                        title: "Rule 3: বিশেষ সম্মানসূচক শব্দ (そんけいご Verbs)",
                        desc: "নির্দিষ্ট গুরুত্বপূর্ণ কাজের জন্য নির্ধারিত সম্মানজনক শব্দাবলী।",
                        formula: "いきます/きます/います → <strong>いらっしゃいます</strong><br>たべます/のみます → <strong>めしあがります</strong><br>いいます → <strong>おっしゃいます</strong><br>みます → <strong>ごらんに なります</strong><br>します → <strong>なさいます</strong>",
                        examples: [
                            { jp: "しゃちょうは かいぎしつに <mark class='hl'>いらっしゃいます</mark>。", bn: "বস মিটিং রুমে উপস্থিত আছেন।" },
                            { jp: "どうぞ <mark class='hl'>めしあがって ください</mark>。", bn: "দয়া করে আহার গ্রহণ করুন।" }
                        ]
                    },
                    {
                        title: "Rule 4: お / ご ････ ください (সম্মানিত অনুরোধ)",
                        desc: "গ্রাহক বা বয়সে বড় কাউকে সম্মান সহকারে অনুরোধ করতে বসে।",
                        formula: "<strong>お + Vます কেটে + ください</strong> / <strong>ご + Noun + ください</strong>",
                        examples: [
                            { jp: "どうぞ <mark class='hl'>おはいり ください</mark>。", bn: "দয়া করে ভেতরে প্রবেশ করুন।" },
                            { jp: "わすれものに <mark class='hl'>ごちゅうい ください</mark>。", bn: "ফেলে যাওয়া জিনিসের প্রতি দয়া করে সতর্ক হোন।" }
                        ]
                    }
                ]
            },
            50: {
                minnaLesson: 50,
                title: "বিনম্র ভাষা (けんじょうご - Humble)",
                kana: "だいごじゅっか",
                rules: [
                    {
                        title: "Rule 1: お / ご ････ します (বিনম্র সেবা প্রদান)",
                        desc: "বড়দের সামনে নিজের কাজকে অত্যন্ত বিনয়ের সাথে উপস্থাপন করে অপরকে সম্মান জানানো।",
                        formula: "G1/G2: <strong>お + Vます কেটে + します</strong><br>G3: <strong>ご + Noun + します</strong>",
                        examples: [
                            { jp: "わたくしが えきまで <mark class='hl'>おおくりします</mark>。", bn: "আমি স্টেশন পর্যন্ত আপনাকে পৌঁছে দেব।" },
                            { jp: "きょうの よていを <mark class='hl'>ごせつめいします</mark>。", bn: "আজকের পরিকল্পনা আমি ব্যাখ্যা করে দিচ্ছি।" },
                            { jp: "にもつを <mark class='hl'>おもちしましょうか</mark>。", bn: "ভারী ব্যাগটি কি আমি বহন করে সাহায্য করব?" }
                        ]
                    },
                    {
                        title: "Rule 2: বিশেষ বিনম্র ক্রিয়াপদ (けんじょうご Verbs)",
                        desc: "নিজের কাজের জন্য সাধারণ শব্দের পরিবর্তে বিশেষ বিনম্র শব্দের প্রয়োগ।",
                        formula: "いきます/きます → <strong>まいります</strong><br>います → <strong>おります</strong><br>たべます/のみます/もらいます → <strong>いただきます</strong><br>いいます → <strong>もうします</strong><br>します → <strong>いたします</strong><br>みます → <strong>はいけんします</strong><br>ききます/いきます → <strong>うかがいます</strong><br>あいます → <strong>おめに かかります</strong>",
                        examples: [
                            { jp: "わたくしは ミラーと <mark class='hl'>もうします</mark>。", bn: "আমি মিলার বলে নিজের পরিচয় দিচ্ছি।" },
                            { jp: "あした 3じに おたくへ <mark class='hl'>うかがいます</mark>。", bn: "আগামীকাল ৩টায় আপনার বাসায় যাব/উপস্থিত হব।" },
                            { jp: "アメリカから <mark class='hl'>まいりました</mark>。", bn: "আমেরিকা থেকে এসেছি।" }
                        ]
                    }
                ]
            }
        };

        let currentActiveLesson = 26;

        function renderLessonGrid() {
            const container = document.getElementById("lessonsGridContainer");
            container.innerHTML = "";

            for (let i = 26; i <= 50; i++) {
                const item = grammarData[i];
                const card = document.createElement("div");
                card.className = "lesson-card";
                card.setAttribute("data-key", `lesson ${i} লেসন ${toBn(i)} ${item.title} ${item.kana}`);
                card.onclick = () => openLessonDetail(i);

                card.innerHTML = `
                    <div class="card-top">
                        <span class="l-badge">L-${i}</span>
                        <span class="kana-lesson-tag">${item.kana}</span>
                    </div>
                    <div class="card-lesson-title">লেসন ${toBn(i)}</div>
                    <div class="card-lesson-desc">${item.title}</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                `;
                container.appendChild(card);
            }
        }

        function openLessonDetail(lessonNo, pushHistory = true) {
            const item = grammarData[lessonNo] || grammarData[26];
            currentActiveLesson = lessonNo;

            document.getElementById("lessonGridView").style.display = "none";
            document.getElementById("lessonDetailView").style.display = "block";

            document.getElementById("detailMainTitle").innerText = `N4_ব্যাকরণ লেসন ${toBn(lessonNo)}`;
            document.getElementById("detailSubTitle").innerText = `লেসন ${toBn(lessonNo)} (${item.kana}) এর সম্পূর্ণ ব্যাখ্যা`;

            const rulesContainer = document.getElementById("rulesListContainer");
            rulesContainer.innerHTML = "";

            item.rules.forEach((r) => {
                const ruleCard = document.createElement("div");
                ruleCard.className = "rule-card";

                let pointsHtml = "";
                if (r.points && r.points.length > 0) {
                    pointsHtml = r.points.map(p => `
                        <div class="point-item">
                            <div class="point-title">${p.pTitle}</div>
                            <div class="point-desc">${p.pDesc}</div>
                        </div>
                    `).join('');
                }

                let noteHtml = r.note ? `<div class="note-box"><i class="fa-solid fa-circle-info"></i> <strong>নোট:</strong> ${r.note}</div>` : '';

                let exHtml = r.examples.map(ex => `
                    <div class="example-item">
                        <div class="ex-text-wrap">
                            <div class="jp-sentence">${ex.jp}</div>
                            <div class="bn-sentence">${ex.bn}</div>
                        </div>
                        <button class="speak-btn" onclick="speakText(this)" data-speech="${stripHtml(ex.jp)}" title="উচ্চারণ শুনুন">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                `).join('');

                ruleCard.innerHTML = `
                    <div class="rule-header" onclick="toggleRuleCard(this)">
                        <div class="rule-header-left">
                            <i class="fa-solid fa-book-open book-icon"></i>
                            <span class="rule-title-text">${r.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right rule-chevron"></i>
                    </div>
                    <div class="rule-body">
                        <p class="rule-desc">${r.desc}</p>
                        ${r.formula ? `<div class="formula-box">${r.formula}</div>` : ''}
                        ${pointsHtml}
                        ${noteHtml}
                        <div class="sub-heading-point"><i class="fa-solid fa-circle-check" style="color:var(--jade);"></i> উদাহরণ বাক্য:</div>
                        <div class="examples-wrapper">${exHtml}</div>
                    </div>
                `;
                rulesContainer.appendChild(ruleCard);
            });

            updateJumpButtons();
            window.scrollTo({ top: 0, behavior: "smooth" });

            if (pushHistory) {
                history.pushState({ view: "detail", lesson: lessonNo }, "");
            }
        }

        function toggleRuleCard(header) {
            const currentCard = header.parentElement;
            const isAlreadyOpen = currentCard.classList.contains("open");

            document.querySelectorAll(".rule-card").forEach(c => c.classList.remove("open"));

            if (!isAlreadyOpen) {
                currentCard.classList.add("open");
            }
        }

        function updateJumpButtons() {
            const prevBtn = document.getElementById("btnPrevLesson");
            const nextBtn = document.getElementById("btnNextLesson");
            const prevTitle = document.getElementById("prevLessonTitle");
            const nextTitle = document.getElementById("nextLessonTitle");

            const prevNum = currentActiveLesson - 1;
            const nextNum = currentActiveLesson + 1;

            if (prevNum < 26) {
                prevBtn.classList.add("disabled");
                prevTitle.innerText = "শুরু";
            } else {
                prevBtn.classList.remove("disabled");
                prevTitle.innerText = `লেসন ${toBn(prevNum)}`;
            }

            if (nextNum > 50) {
                nextBtn.classList.add("disabled");
                nextTitle.innerText = "শেষ";
            } else {
                nextBtn.classList.remove("disabled");
                nextTitle.innerText = `লেসন ${toBn(nextNum)}`;
            }
        }

        function goToPrevLesson() {
            if (currentActiveLesson > 26) openLessonDetail(currentActiveLesson - 1);
        }

        function goToNextLesson() {
            if (currentActiveLesson < 50) openLessonDetail(currentActiveLesson + 1);
        }

        function handleBack(fromHistory = false) {
            if (document.getElementById("lessonDetailView").style.display === "block") {
                document.getElementById("lessonDetailView").style.display = "none";
                document.getElementById("lessonGridView").style.display = "block";
                window.scrollTo({ top: 0, behavior: "smooth" });

                if (!fromHistory && history.state && history.state.view === "detail") {
                    history.back();
                }
            } else {
                window.location.href = "index.html";
            }
        }

        window.addEventListener("popstate", (event) => {
            if (event.state && event.state.view === "detail") {
                openLessonDetail(event.state.lesson, false);
            } else {
                handleBack(true);
            }
        });

        function filterLessons() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const cards = document.querySelectorAll(".lesson-card");

            cards.forEach(card => {
                const key = card.getAttribute("data-key").toLowerCase();
                card.style.display = key.includes(query) ? "flex" : "none";
            });
        }

        function stripHtml(html) {
            const tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        function speakText(btn) {
            const text = btn.getAttribute('data-speech');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toBn(n) {
            const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return n.toString().split('').map(d => digits[d] || d).join('');
        }

        history.replaceState({ view: "grid" }, "");
        renderLessonGrid();
    </script>
</body>
</html>
