<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - KOTOBA</title>
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f7faf9;
            color: #1a202c;
            padding-bottom: 80px;
        }

        /* লোডার ওভারলে */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .book-loader {
            position: relative;
            width: 64px;
            height: 46px;
            perspective: 200px;
            margin-bottom: 18px;
        }

        .book-loader .cover-left {
            position: absolute;
            left: 2px; top: 2px;
            width: 30px; height: 42px;
            border: 2.2px solid #047857;
            border-right: none;
            border-radius: 4px 0 0 4px;
            background: #ffffff;
        }

        .book-loader .cover-right {
            position: absolute;
            right: 2px; top: 2px;
            width: 30px; height: 42px;
            border: 2.2px solid #047857;
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #ffffff;
        }

        .book-loader .spine {
            position: absolute;
            left: 31px; top: 0;
            width: 2px; height: 46px;
            background: #047857;
        }

        .book-loader .page {
            position: absolute;
            width: 29px; height: 42px;
            top: 2px; right: 3px;
            border: 2px solid #047857;
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #ffffff;
            transform-origin: left center;
            animation: flipBook 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .book-loader .page:nth-child(1) { animation-delay: 0.15s; }
        .book-loader .page:nth-child(2) { animation-delay: 0.35s; }
        .book-loader .page:nth-child(3) { animation-delay: 0.55s; }

        @keyframes flipBook {
            0% { transform: rotateY(0deg); }
            50%, 100% { transform: rotateY(-180deg); }
        }

        .loading-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: 0.8px;
        }

        /* টপ বার */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: #ffffff;
            border-bottom: 1px solid #eef2f5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 17px;
            color: #0f3e2e;
            text-decoration: none;
        }

        .container {
            padding: 20px 16px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* প্রোফাইল কার্ড */
        .profile-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 24px 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            text-align: center;
            margin-bottom: 16px;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            background: #e6f4ea;
            color: #047857;
            font-size: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-weight: 800;
        }

        .user-email-text {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 18px;
            word-break: break-all;
        }

        .logout-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:active {
            background: #fecaca;
        }

        /* সেকশন কার্ড (পাসওয়ার্ড ও ইমেইল পরিবর্তন) */
        .section-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #0f3e2e;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #047857;
        }

        .action-btn {
            width: 100%;
            padding: 11px;
            background: #0f3e2e;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s;
        }

        .action-btn.secondary {
            background: #047857;
        }

        .action-btn:active {
            opacity: 0.9;
        }

        .msg-box {
            font-size: 12px;
            margin-top: 10px;
            padding: 9px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .error-msg { background: #fee2e2; color: #dc2626; }
        .success-msg { background: #e6f4ea; color: #047857; }

        /* বটম বার */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 62px;
            background: #ffffff;
            border-top: 1px solid #eef2f5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: #8392a5;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .nav-item.active {
            color: #0f3e2e;
        }

        .nav-item i {
            font-size: 19px;
        }
    </style>
</head>
<body>

    <!-- লোডার ওভারলে -->
    <div id="pageLoader" class="loader-overlay">
        <div class="book-loader">
            <div class="cover-left"></div>
            <div class="cover-right"></div>
            <div class="spine"></div>
            <div class="page"></div>
            <div class="page"></div>
            <div class="page"></div>
        </div>
        <div class="loading-text">読み込み中...</div>
    </div>

    <!-- টপ বার -->
    <header class="top-nav">
        <a href="index.html" class="logo">KOTOBA</a>
        <div style="font-size: 12.5px; font-weight: 700; color: #047857;">প্রোফাইল সেটিংস</div>
    </header>

    <main class="container">
        <!-- প্রোফাইল ইনফো -->
        <div class="profile-card">
            <div class="avatar-circle" id="userAvatar">U</div>
            <div class="user-email-text" id="userEmailDisplay">লোড হচ্ছে...</div>
            <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> লগআউট করুন</button>
        </div>

        <!-- ইমেইল পরিবর্তন সেকশন (Edit Email) -->
        <div class="section-card">
            <h3 class="section-title"><i class="fa-solid fa-envelope"></i> ইমেইল ঠিকানা পরিবর্তন</h3>
            <div class="form-group">
                <label>নতুন ইমেইল ঠিকানা</label>
                <input type="email" id="newEmailInput" placeholder="newemail@example.com">
            </div>
            <button class="action-btn secondary" id="updateEmailBtn">ইমেইল আপডেট করুন</button>
            <div class="msg-box" id="emailMsgBox"></div>
        </div>

        <!-- পাসওয়ার্ড রিসেট সেকশন (Forgot/Reset Password) -->
        <div class="section-card">
            <h3 class="section-title"><i class="fa-solid fa-key"></i> পাসওয়ার্ড রিসেট</h3>
            <p style="font-size: 12px; color: #64748b; margin-bottom: 12px;">আপনার বর্তমান ইমেইলে পাসওয়ার্ড পরিবর্তনের লিংক পাঠাতে নিচের বাটনে ক্লিক করুন।</p>
            <button class="action-btn" id="resetPassBtn">পাসওয়ার্ড পরিবর্তনের লিংক পাঠান</button>
            <div class="msg-box" id="passMsgBox"></div>
        </div>
    </main>

    <!-- বটম বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-robot"></i>
            <span>AI সেনসেই</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fa-solid fa-circle-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>

    <!-- ট্রানজিশন স্ক্রিপ্ট ও ফায়ারবেস লজিক -->
    <script>
        window.addEventListener("load", () => {
            const loader = document.getElementById("pageLoader");
            if (loader) loader.classList.add("hidden");
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail, verifyBeforeUpdateEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs",
            authDomain: "kotoba-b20b3.firebaseapp.com",
            projectId: "kotoba-b20b3",
            storageBucket: "kotoba-b20b3.firebasestorage.app",
            messagingSenderId: "556955805953",
            appId: "1:556955805953:web:cef5927677815bf5e05300",
            measurementId: "G-MXH61ERTC2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const userEmailDisplay = document.getElementById("userEmailDisplay");
        const userAvatar = document.getElementById("userAvatar");
        const logoutBtn = document.getElementById("logoutBtn");
        
        const resetPassBtn = document.getElementById("resetPassBtn");
        const passMsgBox = document.getElementById("passMsgBox");

        const newEmailInput = document.getElementById("newEmailInput");
        const updateEmailBtn = document.getElementById("updateEmailBtn");
        const emailMsgBox = document.getElementById("emailMsgBox");

        let activeUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                activeUser = user;
                userEmailDisplay.innerText = user.email;
                userAvatar.innerText = user.email.charAt(0).toUpperCase();
            } else {
                window.location.href = "login.html";
            }
        });

        // লগআউট
        logoutBtn.addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "login.html";
        });

        // পাসওয়ার্ড রিসেট লিংক পাঠানো
        resetPassBtn.addEventListener("click", async () => {
            if (!activeUser) return;
            passMsgBox.style.display = "none";
            try {
                await sendPasswordResetEmail(auth, activeUser.email);
                showMsg(passMsgBox, "পাসওয়ার্ড পরিবর্তনের লিংক আপনার ইমেইলে পাঠানো হয়েছে।", "success");
            } catch (err) {
                showMsg(passMsgBox, "সমস্যা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।", "error");
            }
        });

        // ইমেইল পরিবর্তন (Edit Email)
        updateEmailBtn.addEventListener("click", async () => {
            const newEmail = newEmailInput.value.trim();
            emailMsgBox.style.display = "none";

            if (!newEmail) {
                showMsg(emailMsgBox, "নতুন ইমেইল ঠিকানা লিখুন।", "error");
                return;
            }

            try {
                // ফায়ারবেসের সিকিউর মেথড যার মাধ্যমে নতুন ইমেইলে ভেরিফিকেশন যাবে
                await verifyBeforeUpdateEmail(activeUser, newEmail);
                showMsg(emailMsgBox, "নতুন ইমেইলে একটি ভেরিফিকেশন লিংক পাঠানো হয়েছে। লিংকটি কনফার্ম করুন।", "success");
                newEmailInput.value = "";
            } catch (err) {
                let errorText = "ইমেইল আপডেট করা যায়নি। আবার চেষ্টা করুন।";
                if (err.code === "auth/requires-recent-login") {
                    errorText = "নিরাপত্তার জন্য পুনরায় লগইন করে আবার চেষ্টা করুন।";
                } else if (err.code === "auth/email-already-in-use") {
                    errorText = "এই ইমেইলটি ইতিমধ্যে অন্য অ্যাকাউন্টে ব্যবহৃত হচ্ছে।";
                }
                showMsg(emailMsgBox, errorText, "error");
            }
        });

        function showMsg(box, text, type) {
            box.innerText = text;
            box.style.display = "block";
            box.className = `msg-box ${type === 'error' ? 'error-msg' : 'success-msg'}`;
        }
    </script>
</body>
</html>
