<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N5 Vocabulary - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Google AdSense Verification Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9023379305536988" crossorigin="anonymous"></script>

    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Hind+Siliguri:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- OneSignal Push Notification SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "24a46f70-4d24-411a-b673-5139c2f541b7",
          notifyButton: { enable: true },
        });
      });
    </script>

    <style>
        :root {
            /* Index পেজের জাপানিজ কালার প্যালেট */
            --paper: #fbf7ef;
            --ink: #182620;
            --pine: #0B4A38;
            --jade: #147A57;
            --clay: #B6472E;
            --gold: #A9781F;
            --mist: #7C8A82;
            --line: #E9E2D3;
            --card-bg: #ffffff;
            --shadow-float: 0 10px 28px rgba(11, 74, 56, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding-bottom: 96px;
            min-height: 100vh;
        }

        /* লোডার ওভারলে */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(251, 247, 239, 0.95);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .book-loader {
            position: relative;
            width: 64px;
            height: 46px;
            perspective: 200px;
            margin-bottom: 18px;
        }

        .book-loader .cover-left {
            position: absolute;
            left: 2px; top: 2px;
            width: 30px; height: 42px;
            border: 2.2px solid var(--pine);
            border-right: none;
            border-radius: 4px 0 0 4px;
            background: #ffffff;
        }

        .book-loader .cover-right {
            position: absolute;
            right: 2px; top: 2px;
            width: 30px; height: 42px;
            border: 2.2px solid var(--pine);
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #ffffff;
        }

        .book-loader .spine {
            position: absolute;
            left: 31px; top: 0;
            width: 2px; height: 46px;
            background: var(--pine);
        }

        .book-loader .page {
            position: absolute;
            width: 29px; height: 42px;
            top: 2px; right: 3px;
            border: 2px solid var(--jade);
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #ffffff;
            transform-origin: left center;
            animation: flipBook 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .book-loader .page:nth-child(1) { animation-delay: 0.15s; }
        .book-loader .page:nth-child(2) { animation-delay: 0.35s; }
        .book-loader .page:nth-child(3) { animation-delay: 0.55s; }

        @keyframes flipBook {
            0% { transform: rotateY(0deg); }
            50%, 100% { transform: rotateY(-180deg); }
        }

        .loading-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--pine);
            letter-spacing: 0.8px;
        }

        /* টপ নেভিগেশন */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(251, 247, 239, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .menu-btn-icon {
            background: #F0EAD9;
            color: var(--pine);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            font-size: 15px;
            transition: transform 0.15s;
        }

        .menu-btn-icon:active { transform: scale(0.92); }

        .nav-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--pine);
            letter-spacing: 0.5px;
        }

        .nav-right {
            font-size: 11px;
            font-weight: 700;
            color: var(--jade);
            background: #E6F3EC;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #CCE7DC;
            max-width: 170px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .main-container {
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* লেসন সিলেকশন গ্রিড */
        .grid-header-wrap {
            text-align: center;
            margin-bottom: 18px;
        }

        .main-category-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--pine);
            margin-bottom: 3px;
        }

        .sub-category-desc {
            font-size: 12px;
            color: var(--mist);
            font-weight: 600;
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-left: 4px solid var(--jade);
            border-radius: 14px;
            padding: 15px 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .lesson-card:active {
            transform: scale(0.97);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .l-badge {
            background: #E6F3EC;
            color: var(--jade);
            font-size: 10px;
            font-weight: 800;
            padding: 2.5px 7px;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .kanji-lesson-tag {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 12px;
            color: var(--mist);
            font-weight: 700;
        }

        .card-lesson-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .card-lesson-desc {
            font-size: 11px;
            color: var(--mist);
            line-height: 1.35;
        }

        .card-arrow {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
            color: #cbd5e1;
            font-size: 11px;
        }

        /* ফ্ল্যাশকার্ড ভিউ */
        .detail-view {
            display: none;
        }

        .fc-top-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            position: relative;
        }

        .fc-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--pine);
        }

        .fc-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .fc-tool-btn {
            background: #ffffff;
            border: 1px solid var(--line);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: all 0.15s;
        }

        .fc-tool-btn:active {
            transform: scale(0.92);
            background: #FAF7F0;
        }

        .flashcard-container {
            perspective: 1200px;
            width: 100%;
            height: 250px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.34, 1.35, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: 20px;
        }

        .flashcard-container.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            background: #ffffff;
            border: 1.5px solid var(--line);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            box-shadow: 0 8px 24px rgba(11, 74, 56, 0.04);
            box-sizing: border-box;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .flashcard-front {
            border-top: 4px solid var(--pine);
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background: #FAF7F0;
            border-top: 4px solid var(--clay);
        }

        .flashcard-container.is-highlighted .flashcard-face {
            border-color: var(--clay) !important;
            border-top-color: var(--clay) !important;
            box-shadow: 0 10px 25px rgba(182, 71, 46, 0.14) !important;
            background: #FBEAE6 !important;
        }

        .fc-jp-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--pine);
            line-height: 1.25;
            margin-bottom: 6px;
            padding: 0 10px;
            word-break: break-word;
        }

        .fc-meaning-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--clay);
            margin-bottom: 4px;
            line-height: 1.3;
            padding: 0 10px;
        }

        .fc-ro-text {
            font-size: 13.5px;
            color: var(--mist);
            font-weight: 600;
        }

        .fc-tap-hint {
            position: absolute;
            bottom: 16px;
            font-size: 11.5px;
            color: var(--mist);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .fc-highlight-btn {
            position: absolute;
            top: 16px;
            left: 18px;
            color: var(--mist);
            background: #FAF7F0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 1px solid var(--line);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .fc-highlight-btn.active {
            color: #ffffff;
            background: var(--clay);
            border-color: var(--clay);
            box-shadow: 0 2px 8px rgba(182, 71, 46, 0.35);
        }

        .fc-speaker-icon {
            position: absolute;
            top: 16px;
            right: 18px;
            color: var(--jade);
            background: #E6F3EC;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 1px solid #CCE7DC;
            cursor: pointer;
            transition: all 0.15s;
        }

        .fc-speaker-icon:active {
            transform: scale(0.9);
            background: var(--jade);
            color: #ffffff;
        }

        .fc-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 18px 0 24px;
            gap: 12px;
        }

        .fc-arrow-btn {
            background: #ffffff;
            border: 1px solid var(--line);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: all 0.15s;
        }

        .fc-arrow-btn:active {
            transform: scale(0.92);
        }

        .fc-progress-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .fc-counter-text {
            font-size: 12px;
            font-weight: 800;
            color: var(--mist);
            letter-spacing: 0.5px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .fc-progress-bar {
            width: 100%;
            height: 5px;
            background: #E9E2D3;
            border-radius: 6px;
            overflow: hidden;
        }

        .fc-progress-fill {
            height: 100%;
            background: var(--jade);
            width: 5%;
            transition: width 0.25s ease;
        }

        .vocab-accordion-header {
            background: var(--pine);
            color: #ffffff;
            border-radius: 14px;
            padding: 13px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 13.5px;
            box-shadow: 0 3px 8px rgba(11, 74, 56, 0.12);
        }

        .vocab-accordion-header .acc-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vocab-accordion-header .acc-icon {
            font-size: 13px;
            transition: transform 0.25s ease;
        }

        .vocab-table-card {
            display: none;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-top: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(11, 74, 56, 0.03);
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .vocab-table th {
            background: #FAF7F0;
            color: var(--pine);
            font-weight: 800;
            font-size: 12px;
            padding: 12px 6px;
            border-bottom: 1px solid var(--line);
            line-height: 1.3;
        }

        .vocab-table td {
            padding: 12px 6px;
            font-size: 12.5px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            vertical-align: middle;
        }

        .vocab-table tr:nth-child(even) {
            background: #FAF9F5;
        }

        .vocab-table tr.highlighted-row {
            background-color: #FBEAE6 !important;
            border-left: 4px solid var(--clay);
        }

        .col-kana {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--pine);
        }

        .col-ro {
            font-size: 11.5px;
            color: var(--mist);
            font-weight: 500;
        }

        .col-bn {
            font-size: 12px;
            font-weight: 700;
            color: var(--ink);
        }

        .table-hl-btn {
            background: none;
            border: none;
            font-size: 15px;
            color: #cbd5e1;
            cursor: pointer;
            transition: transform 0.15s, color 0.15s;
        }

        .table-hl-btn.active {
            color: var(--clay);
        }

        /* লেসন প্রিভিয়াস ও নেক্সট নেভিগেশন */
        .lesson-jump-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 26px;
            margin-bottom: 20px;
            padding: 16px 8px;
            position: relative;
        }

        .lesson-jump-nav::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 20%;
            height: 60%;
            width: 1px;
            background-color: var(--line);
            transform: translateX(-50%);
        }

        .jump-btn {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 48%;
        }

        .jump-btn.prev-btn {
            align-items: flex-start;
            text-align: left;
        }

        .jump-btn.next-btn {
            align-items: flex-end;
            text-align: right;
        }

        .jump-label {
            font-size: 10.5px;
            font-weight: 800;
            color: var(--jade);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .jump-title {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--pine);
            line-height: 1.3;
        }

        .jump-btn:disabled,
        .jump-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ব্যানার অ্যাড বক্স স্টাইল */
        .ad-banner-slot {
            width: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            margin: 18px auto;
            min-height: 50px;
            overflow: hidden;
        }

        /* ফ্লোটিং আইল্যান্ড বটম বার */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 440px;
            height: 62px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(233, 226, 211, 0.9);
            border-radius: 999px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--shadow-float);
            padding: 0 8px;
        }

        .nav-item {
            text-decoration: none;
            color: var(--mist);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-weight: 600;
            flex: 1;
            padding: 8px 0;
            border-radius: 999px;
            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 18px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .nav-item.active {
            color: var(--pine);
            font-weight: 700;
        }

        .nav-item.active i {
            transform: translateY(-1px) scale(1.1);
            color: var(--jade);
        }

        .nav-item:active i {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <!-- লোডার ওভারলে -->
    <div id="pageLoader" class="loader-overlay">
        <div class="book-loader">
            <div class="cover-left"></div>
            <div class="cover-right"></div>
            <div class="spine"></div>
            <div class="page"></div>
            <div class="page"></div>
            <div class="page"></div>
        </div>
        <div class="loading-text">読み込み中...</div>
    </div>

    <!-- টপ বার -->
    <header class="top-nav">
        <div class="nav-left" id="btnBackToGrid">
            <div class="menu-btn-icon">
                <i class="fa-solid fa-bars" id="menuIcon"></i>
            </div>
            <span class="nav-title">KOTOBA</span>
        </div>
        <div class="nav-right" id="userEmailDisplay">
            <i class="fa-solid fa-cloud"></i> <span id="syncText">লোড হচ্ছে...</span>
        </div>
    </header>

    <main class="main-container">

        <!-- ভিউ ১: লেসন তালিকা -->
        <div id="lessonGridView">
            <div class="grid-header-wrap">
                <h2 class="main-category-title">N5 Vocabulary</h2>
                <p class="sub-category-desc">লেসন ১ থেকে ২৫ • সম্পূর্ণ শব্দভাণ্ডার</p>
            </div>

            <div class="lesson-grid" id="gridContainer"></div>

            <!-- অ্যাড স্লট ১: গ্রিড ভিউ-এর নিচে -->
            <div class="ad-banner-slot" id="gridBottomAd"></div>
        </div>

        <!-- ভিউ ২: ৩ডি ফ্ল্যাশকার্ড ও টেবিল ভিউ -->
        <div id="lessonDetailView" class="detail-view">
            
            <div class="fc-top-header">
                <h3 class="fc-title">শব্দার্থ ফ্ল্যাশকার্ড</h3>
            </div>

            <div class="fc-tools">
                <button class="fc-tool-btn" id="btnShuffle" title="মিক্স করুন"><i class="fa-solid fa-shuffle"></i></button>
                <button class="fc-tool-btn" id="btnSpeakMain" title="উচ্চারণ শুনুন"><i class="fa-solid fa-volume-high"></i></button>
            </div>

            <!-- ৩ডি অ্যানিমেটেড ফ্ল্যাশকার্ড -->
            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard-inner">

        let currentLesson = 1;
        let currentWords = [];
        let currentIndex = 0;
        let isTableOpen = false;

        window.addEventListener("load", () => {
            const loader = document.getElementById("pageLoader");
            if (loader) loader.classList.add("hidden");
        });

        onAuthStateChanged(auth, async (user) => {
            const syncText = document.getElementById("syncText");

            if (user && user.email) {
                currentUserEmail = user.email;
                syncText.innerText = user.email;
                try {
                    const docRef = doc(db, "user_highlights", user.email);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists() && docSnap.data().words) {
                        highlightedWords = docSnap.data().words;
                    } else {
                        highlightedWords = JSON.parse(localStorage.getItem("kotoba_n5_vocab_highlights")) || [];
                        await setDoc(docRef, { email: user.email, words: highlightedWords });
                    }
                } catch (e) {
                    highlightedWords = JSON.parse(localStorage.getItem("kotoba_n5_vocab_highlights")) || [];
                }
            } else {
                currentUserEmail = null;
                syncText.innerText = "গেস্ট মোড";
                highlightedWords = JSON.parse(localStorage.getItem("kotoba_n5_vocab_highlights")) || [];
            }
            updateCardHighlightState();
            renderTable();
        });

        async function saveUserHighlights() {
            localStorage.setItem("kotoba_n5_vocab_highlights", JSON.stringify(highlightedWords));
            if (currentUserEmail) {
                try {
                    const docRef = doc(db, "user_highlights", currentUserEmail);
                    await setDoc(docRef, { email: currentUserEmail, words: highlightedWords }, { merge: true });
                } catch (e) {
                    console.error("Cloud save error:", e);
                }
            }
        }

        function getWordKey(lessonNo, kana) {
            return `N5_L${lessonNo}_${kana}`;
        }

        function isWordHighlighted(lessonNo, kana) {
            return highlightedWords.includes(getWordKey(lessonNo, kana));
        }

        async function toggleWordHighlight(lessonNo, kana, e) {
            if (e) e.stopPropagation();
            const key = getWordKey(lessonNo, kana);

            if (highlightedWords.includes(key)) {
                highlightedWords = highlightedWords.filter(k => k !== key);
            } else {
                highlightedWords.push(key);
            }

            await saveUserHighlights();
            updateCardHighlightState();
            renderTable();
        }

        function toggleCurrentHighlight(e) {
            if (e) e.stopPropagation();
            if (currentWords.length === 0) return;
            const currentItem = currentWords[currentIndex];
            toggleWordHighlight(currentLesson, currentItem.kana, e);
        }

        function updateCardHighlightState() {
            if (currentWords.length === 0) return;
            const item = currentWords[currentIndex];
            const highlighted = isWordHighlighted(currentLesson, item.kana);

            const cardContainer = document.getElementById("flashcardContainer");
            const frontBtn = document.getElementById("fcFrontHlBtn");
            const backBtn = document.getElementById("fcBackHlBtn");

            if (highlighted) {
                cardContainer.classList.add("is-highlighted");
                frontBtn.classList.add("active");
                backBtn.classList.add("active");
            } else {
                cardContainer.classList.remove("is-highlighted");
                frontBtn.classList.remove("active");
                backBtn.classList.remove("active");
            }
        }

        function renderLessonGrid() {
            const container = document.getElementById("gridContainer");
            container.innerHTML = "";

            for (let i = 1; i <= 25; i++) {
                const lesson = lessons[i] || { title: "শিঘ্রই আসছে", kanji: `第${i}課` };

                const card = document.createElement("div");
                card.className = "lesson-card";
                card.onclick = () => openLesson(i);
                card.innerHTML = `
                    <div class="card-top">
                        <span class="l-badge">L-${i < 10 ? '0' + i : i}</span>
                        <span class="kanji-lesson-tag">${lesson.kanji}</span>
                    </div>
                    <div class="card-lesson-title">লেসন ${convertBengaliNumber(i)}</div>
                    <div class="card-lesson-desc">${lesson.title}</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                `;
                container.appendChild(card);
            }
        }

        function updateJumpNavButtons() {
            const prevBtn = document.getElementById("btnPrevLesson");
            const nextBtn = document.getElementById("btnNextLesson");
            const prevTitle = document.getElementById("prevLessonTitle");
            const nextTitle = document.getElementById("nextLessonTitle");

            const prevLessonNum = currentLesson - 1;
            const nextLessonNum = currentLesson + 1;

            if (prevLessonNum < 1) {
                prevBtn.classList.add("disabled");
                prevTitle.innerText = "শুরু";
            } else {
                prevBtn.classList.remove("disabled");
                const formattedNum = prevLessonNum < 10 ? `০${convertBengaliNumber(prevLessonNum)}` : convertBengaliNumber(prevLessonNum);
                prevTitle.innerText = `(শব্দার্থ) লেসন ${formattedNum}`;
            }

            if (nextLessonNum > 25) {
                nextBtn.classList.add("disabled");
                nextTitle.innerText = "শেষ";
            } else {
                nextBtn.classList.remove("disabled");
                const formattedNum = nextLessonNum < 10 ? `০${convertBengaliNumber(nextLessonNum)}` : convertBengaliNumber(nextLessonNum);
                nextTitle.innerText = `(শব্দার্থ) লেসন ${formattedNum}`;
            }
        }

        function openLesson(num, pushToHistory = true) {
            if (!lessons[num]) {
                alert("এই লেসনের ডেটা খুব শীঘ্রই যুক্ত করা হবে!");
                return;
            }
            currentLesson = num;
            currentWords = [...lessons[num].words];
            currentIndex = 0;
            isTableOpen = false;

            document.getElementById("lessonGridView").style.display = "none";
            document.getElementById("lessonDetailView").style.display = "block";
            document.getElementById("accButtonText").innerText = `লেসন ${convertBengaliNumber(num)} এর গুরুত্বপূর্ণ শব্দার্থ সমূহ দেখুন`;
            
            document.getElementById("tableCard").style.display = "none";
            document.getElementById("accChevron").style.transform = "rotate(0deg)";

            document.getElementById("flashcardContainer").classList.remove("flipped");
            fillCardData();
            renderTable();
            updateJumpNavButtons();
            window.scrollTo({ top: 0, behavior: "smooth" });

            if (pushToHistory) {
                history.pushState({ view: "detail", lesson: num }, "");
            }
        }

        function goToPrevLesson() {
            if (currentLesson > 1) openLesson(currentLesson - 1);
        }

        function goToNextLesson() {
            if (currentLesson < 25) openLesson(currentLesson + 1);
        }

        function backToGrid(fromHistory = false) {
            if (document.getElementById("lessonDetailView").style.display === "block") {
                document.getElementById("lessonDetailView").style.display = "none";
                document.getElementById("lessonGridView").style.display = "block";
                window.scrollTo({ top: 0, behavior: "smooth" });

                if (!fromHistory && history.state && history.state.view === "detail") {
                    history.back();
                }
            } else {
                window.location.href = "index.html";
            }
        }

        window.addEventListener("popstate", (event) => {
            if (event.state && event.state.view === "detail") {
                openLesson(event.state.lesson, false);
            } else {
                backToGrid(true);
            }
        });

        function fillCardData() {
            if (currentWords.length === 0) return;
            const item = currentWords[currentIndex];

            document.getElementById("fcKana").innerText = item.kana;
            document.getElementById("fcMeaning").innerText = item.bn;
            document.getElementById("fcRomaji").innerText = item.ro;

            document.getElementById("cardCounter").innerText = `CARD ${currentIndex + 1} / ${currentWords.length}`;
            const pct = ((currentIndex + 1) / currentWords.length) * 100;
            document.getElementById("progressFill").style.width = `${pct}%`;

            updateCardHighlightState();
        }

        function flipCard() {
            document.getElementById("flashcardContainer").classList.toggle("flipped");
        }

        function nextCard() {
            if (currentIndex < currentWords.length - 1) {
                currentIndex++;
                updateCardWithAnimation();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCardWithAnimation();
            }
        }

        function updateCardWithAnimation() {
            const container = document.getElementById("flashcardContainer");
            if (container.classList.contains("flipped")) {
                container.classList.remove("flipped");
                setTimeout(fillCardData, 200);
            } else {
                fillCardData();
            }
        }

        function shuffleCards() {
            currentWords.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            updateCardWithAnimation();
        }

        function toggleTable() {
            isTableOpen = !isTableOpen;
            const tableCard = document.getElementById("tableCard");
            const chevron = document.getElementById("accChevron");

            if (isTableOpen) {
                tableCard.style.display = "block";
                chevron.style.transform = "rotate(90deg)";
            } else {
                tableCard.style.display = "none";
                chevron.style.transform = "rotate(0deg)";
            }
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            currentWords.forEach(item => {
                const highlighted = isWordHighlighted(currentLesson, item.kana);
                const tr = document.createElement("tr");
                if (highlighted) tr.className = "highlighted-row";

                tr.innerHTML = `
                    <td><span class="col-kana">${item.kana}</span></td>
                    <td><span class="col-ro">${item.ro}</span></td>
                    <td><span class="col-bn">${item.bn}</span></td>
                    <td>
                        <button class="table-hl-btn ${highlighted ? 'active' : ''}" title="মার্ক করুন">
                            <i class="fa-${highlighted ? 'solid' : 'regular'} fa-bookmark"></i>
                        </button>
                    </td>
                `;

                tr.querySelector(".table-hl-btn").addEventListener("click", (e) => {
                    toggleWordHighlight(currentLesson, item.kana, e);
                });

                tbody.appendChild(tr);
            });
        }

        function speakCurrent() {
            if (currentWords.length === 0) return;
            const text = currentWords[currentIndex].kana.split(' ')[0].replace(/～/g, '');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ja-JP';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        function convertBengaliNumber(n) {
            const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return n.toString().split('').map(d => bnDigits[d] || d).join('');
        }

        document.getElementById("btnBackToGrid").addEventListener("click", () => backToGrid(false));
        document.getElementById("btnShuffle").addEventListener("click", shuffleCards);
        document.getElementById("btnSpeakMain").addEventListener("click", speakCurrent);
        document.getElementById("flashcardContainer").addEventListener("click", flipCard);
        document.getElementById("fcFrontHlBtn").addEventListener("click", toggleCurrentHighlight);
        document.getElementById("fcBackHlBtn").addEventListener("click", toggleCurrentHighlight);
        document.getElementById("btnPrevCard").onclick = prevCard;
        document.getElementById("btnNextCard").onclick = nextCard;
        document.getElementById("btnToggleTable").onclick = toggleTable;

        document.getElementById("btnPrevLesson").onclick = goToPrevLesson;
        document.getElementById("btnNextLesson").onclick = goToNextLesson;

        document.querySelectorAll(".fc-speak-voice-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                speakCurrent();
            });
        });

        history.replaceState({ view: "grid" }, "");
        renderLessonGrid();
    </script>
</body>
</html>
