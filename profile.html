<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - KOTOBA</title>
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f7faf9;
            color: #1a202c;
            padding-bottom: 85px;
        }

        /* টপ বার */
        .top-nav {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: #ffffff;
            border-bottom: 1px solid #eef2f5;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 14px;
        }

        .back-btn {
            color: #0f3e2e;
            font-size: 16px;
            text-decoration: none;
            background: #f1f5f9;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-title {
            font-weight: 700;
            font-size: 17px;
            color: #0f3e2e;
        }

        .page-content {
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ইউজার কার্ড */
        .profile-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            margin-bottom: 20px;
        }

        /* নামের অক্ষরের লোগো */
        .avatar-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f3e2e 0%, #047857 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            margin: 0 auto 12px;
            border: 3px solid #a7f3d0;
            box-shadow: 0 4px 14px rgba(4, 120, 87, 0.2);
            text-transform: uppercase;
            user-select: none;
        }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: #0f3e2e;
            margin-bottom: 3px;
        }

        .user-email {
            font-size: 12.5px;
            color: #64748b;
            margin-bottom: 16px;
        }

        /* মিনি স্ট্যাটাস গ্রিড */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
        }

        .stat-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px 8px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 700;
            color: #047857;
            margin-bottom: 2px;
        }

        .stat-lbl {
            font-size: 11px;
            color: #64748b;
        }

        /* অ্যাকশন লিস্ট */
        .menu-list {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            text-decoration: none;
            color: #334155;
            font-size: 13.5px;
            font-weight: 600;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.15s;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:active {
            background: #f8fafc;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-left i {
            font-size: 16px;
            color: #047857;
            width: 20px;
            text-align: center;
        }

        .menu-right {
            color: #cbd5e1;
            font-size: 12px;
        }

        /* লগআউট বাটন */
        .logout-btn {
            width: 100%;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #e11d48;
            padding: 13px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .logout-btn:active {
            background: #ffe4e6;
        }

        /* বটম বার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 62px;
            background: #ffffff;
            border-top: 1px solid #eef2f5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: #8392a5;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: #0f3e2e;
        }

        .nav-item i {
            font-size: 19px;
        }
    </style>
</head>
<body>

    <!-- টপ বার -->
    <header class="top-nav">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <span class="nav-title">আমার প্রোফাইল</span>
    </header>

    <main class="page-content">

        <!-- ইউজার কার্ড -->
        <div class="profile-card">
            <div class="avatar-circle" id="avatarInitial">
                <i class="fa-regular fa-user" style="font-size: 24px;"></i>
            </div>
            <h2 class="user-name" id="displayUserName">লোড হচ্ছে...</h2>
            <p class="user-email" id="displayUserEmail">---</p>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-val" id="hlWordCount">০</div>
                    <div class="stat-lbl">সংরক্ষিত শব্দার্থ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">JLPT N5</div>
                    <div class="stat-lbl">বর্তমান লেভেল</div>
                </div>
            </div>
        </div>

        <!-- অ্যাকশন মেনু -->
        <div class="menu-list">
            <a href="leaderboard.html" class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-trophy" style="color: #d97706;"></i>
                    <span>র‍্যাঙ্কিং ও লিডারবোর্ড</span>
                </div>
                <i class="fa-solid fa-chevron-right menu-right"></i>
            </a>
            <a href="n5-vocab.html" class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span>বুকমার্ক করা ভোকাবুলারি</span>
                </div>
                <i class="fa-solid fa-chevron-right menu-right"></i>
            </a>
            <a href="ai-sensei.html" class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-robot"></i>
                    <span>AI সেনসেই চ্যাটবক্স</span>
                </div>
                <i class="fa-solid fa-chevron-right menu-right"></i>
            </a>
        </div>

        <!-- লগআউট বাটন -->
        <button class="logout-btn" id="logoutBtn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> লগআউট করুন
        </button>

    </main>

    <!-- বটম বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>
        <a href="leaderboard.html" class="nav-item">
            <i class="fa-solid fa-trophy"></i>
            <span>লিডারবোর্ড</span>
        </a>
        <a href="ai-sensei.html" class="nav-item">
            <i class="fa-solid fa-robot"></i>
            <span>AI সেনসেই</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fa-solid fa-circle-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>

    <!-- Firebase Auth ও ডেটা লোড -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs",
            authDomain: "kotoba-b20b3.firebaseapp.com",
            projectId: "kotoba-b20b3",
            storageBucket: "kotoba-b20b3.firebasestorage.app",
            messagingSenderId: "556955805953",
            appId: "1:556955805953:web:cef5927677815bf5e05300",
            measurementId: "G-MXH61ERTC2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const avatarInitialEl = document.getElementById("avatarInitial");
        const nameEl = document.getElementById("displayUserName");
        const emailEl = document.getElementById("displayUserEmail");
        const hlCountEl = document.getElementById("hlWordCount");
        const logoutBtn = document.getElementById("logoutBtn");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const displayName = user.displayName || user.email.split("@")[0];
                emailEl.innerText = user.email;
                nameEl.innerText = displayName;

                // নামের প্রথম অক্ষর সেট করা (বাংলা বা ইংরেজি উভয় অক্ষর সাপোর্ট করবে)
                const firstChar = displayName.trim().charAt(0).toUpperCase();
                avatarInitialEl.innerText = firstChar;

                // সংরক্ষিত হাইলাইটের সংখ্যা লোড
                try {
                    const docRef = doc(db, "user_highlights", user.email);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists() && docSnap.data().words) {
                        hlCountEl.innerText = docSnap.data().words.length;
                    } else {
                        const local = JSON.parse(localStorage.getItem("kotoba_n5_vocab_highlights")) || [];
                        hlCountEl.innerText = local.length;
                    }
                } catch (e) {
                    const local = JSON.parse(localStorage.getItem("kotoba_n5_vocab_highlights")) || [];
                    hlCountEl.innerText = local.length;
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // লগআউট হ্যান্ডলার
        logoutBtn.addEventListener("click", async () => {
            if (confirm("আপনি কি প্রোফাইল থেকে বের হতে চান?")) {
                await signOut(auth);
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
