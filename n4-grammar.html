<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N4 ব্যাকরণ সমগ্র - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Hind+Siliguri:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper: #fbf7ef;
            --ink: #182620;
            --pine: #0B4A38;
            --jade: #147A57;
            --clay: #B6472E;
            --gold: #A9781F;
            --mist: #7C8A82;
            --line: #E9E2D3;
            --card-bg: #ffffff;
            --highlight: #ffeaa7;
            --highlight-text: #634a00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding-bottom: 85px;
            min-height: 100vh;
        }

        /* টপ নেভিগেশন */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(251, 247, 239, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--pine);
            background: #F0EAD9;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .back-btn:active { transform: scale(0.92); }

        .logo-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--pine);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .level-pill {
            background: var(--pine);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .container {
            padding: 14px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* সার্চ বক্স */
        .search-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .search-wrap input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
            background: var(--card-bg);
            color: var(--ink);
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.03);
            transition: border-color 0.2s;
        }

        .search-wrap input:focus {
            border-color: var(--jade);
        }

        .search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mist);
            font-size: 14px;
        }

        .subtitle-bar {
            text-align: center;
            font-size: 12.5px;
            color: var(--mist);
            font-weight: 600;
            margin-bottom: 16px;
            background: #F0EAD9;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }

        /* ভিউ ১: লেসন গ্রিড */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-left: 4px solid var(--jade);
            border-radius: 14px;
            padding: 15px 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 104px;
        }

        .lesson-card:active {
            transform: scale(0.97);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .l-badge {
            background: #E6F3EC;
            color: var(--jade);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .kana-lesson-tag {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 12px;
            color: var(--mist);
            font-weight: 700;
        }

        .card-lesson-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .card-lesson-desc {
            font-size: 11px;
            color: var(--mist);
            line-height: 1.35;
        }

        .card-arrow {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            color: #cbd5e1;
            font-size: 11px;
        }

        /* ভিউ ২: লেসন ডিটেইল ভিউ */
        .detail-view {
            display: none;
        }

        .detail-header-wrap {
            text-align: center;
            margin-bottom: 18px;
            padding: 6px 4px;
        }

        .detail-main-title {
            font-size: 21px;
            font-weight: 800;
            color: var(--pine);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .detail-sub-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--mist);
        }

        /* রুল কার্ড */
        .rule-card {
            background: var(--card-bg);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: 0 3px 6px rgba(11, 74, 56, 0.03);
            transition: all 0.2s ease;
        }

        .rule-header {
            background: var(--pine);
            color: #ffffff;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            gap: 10px;
            transition: background 0.15s ease;
        }

        .rule-header:active {
            background: #093c2d;
        }

        .rule-header-left {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
        }

        .rule-header-left i.book-icon {
            font-size: 15px;
            margin-top: 3px;
            color: #ffffff;
            opacity: 0.9;
        }

        .rule-title-text {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 0.2px;
            white-space: pre-line;
            font-family: 'Noto Sans JP', 'Hind Siliguri', sans-serif;
        }

        .rule-chevron {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }

        .rule-card.open .rule-chevron {
            transform: rotate(90deg);
            color: #ffffff;
        }

        .rule-body {
            display: none;
            padding: 18px 16px;
            background: #ffffff;
            border-top: 1px solid var(--line);
        }

        .rule-card.open .rule-body {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rule-desc {
            font-size: 13px;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 12px;
        }

        .formula-box {
            background: #FAF7F0;
            border: 1px dashed #D2DDD6;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--pine);
            margin-bottom: 14px;
            line-height: 1.7;
            font-family: 'Noto Sans JP', 'Hind Siliguri', sans-serif;
        }

        .formula-box strong {
            color: var(--clay);
        }

        .point-item {
            margin-bottom: 14px;
            padding-left: 10px;
            border-left: 3px solid var(--jade);
        }

        .point-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--pine);
            margin-bottom: 4px;
        }

        .point-desc {
            font-size: 12px;
            color: #4B5A52;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .sub-heading-point {
            font-size: 13px;
            font-weight: 800;
            color: var(--pine);
            margin: 14px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* উদাহরণ তালিকা */
        .examples-wrapper {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-top: 8px;
        }

        .example-item {
            background: #FAF9F5;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 13px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .ex-text-wrap {
            flex: 1;
        }

        .jp-sentence {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.5;
            margin-bottom: 4px;
        }

        /* গ্রামার হাইলাইট স্টাইল */
        mark.hl {
            background-color: var(--highlight);
            color: var(--highlight-text);
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 800;
            border-bottom: 2px solid var(--gold);
        }

        .bn-sentence {
            font-size: 12px;
            color: var(--mist);
            line-height: 1.4;
        }

        .speak-btn {
            background: #E6F3EC;
            border: 1px solid #CCE7DC;
            color: var(--jade);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .speak-btn:active {
            transform: scale(0.9);
            background: var(--jade);
            color: #ffffff;
        }

        /* লেসন জাম্প ন্যাভবার */
        .lesson-jump-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 26px;
            margin-bottom: 20px;
            padding: 16px 8px;
            position: relative;
        }

        .lesson-jump-nav::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 20%;
            height: 60%;
            width: 1px;
            background-color: var(--line);
            transform: translateX(-50%);
        }

        .jump-btn {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 48%;
        }

        .jump-btn.prev-btn { align-items: flex-start; text-align: left; }
        .jump-btn.next-btn { align-items: flex-end; text-align: right; }

        .jump-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--jade);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .jump-title {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--pine);
            line-height: 1.3;
        }

        .jump-btn:disabled, .jump-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(251, 247, 239, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: var(--mist);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .nav-item.active { color: var(--jade); }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <button class="back-btn" id="navBackBtn" onclick="handleBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo-text">
                KOTOBA <span class="level-pill">N4 GRAMMAR</span>
            </div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: var(--jade);">লেসন ২৬-৫০</div>
    </header>

    <main class="container">
        <!-- ভিউ ১: লেসন গ্রিড -->
        <div id="lessonGridView">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="লেসন বা ব্যাকরণের বিষয় খুঁজুন..." onkeyup="filterLessons()">
            </div>

            <div class="subtitle-bar">লেসন নির্বাচন করুন • সম্পূর্ণ ২৫টি ব্যাকরণ লেসন</div>
            <div class="lesson-grid" id="lessonsGridContainer"></div>
        </div>

        <!-- ভিউ ২: লেসন ডিটেইল ভিউ -->
        <div id="lessonDetailView" class="detail-view">
            <div class="detail-header-wrap">
                <h2 class="detail-main-title" id="detailMainTitle">N4_ব্যাকরণ লেসন ০১</h2>
                <div class="detail-sub-title" id="detailSubTitle">লেসন ০১ (Grammar/ব্যাকরণ) এর ব্যাখ্যা</div>
            </div>

            <div id="rulesListContainer"></div>

            <div class="lesson-jump-nav">
                <button class="jump-btn prev-btn" id="btnPrevLesson" onclick="goToPrevLesson()">
                    <span class="jump-label">PREVIOUS</span>
                    <span class="jump-title" id="prevLessonTitle">লেসন ০০</span>
                </button>
                <button class="jump-btn next-btn" id="btnNextLesson" onclick="goToNextLesson()">
                    <span class="jump-label">NEXT</span>
                    <span class="jump-title" id="nextLessonTitle">লেসন ০২</span>
                </button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>লিডারবোর্ড</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script>
        // কাঞ্জিমুক্ত হিরাগানা ও কাতাকানা ডাটাবেস এবং হাইলাইটেড ব্যাকরণ
        const grammarData = {
            1: {
                lessonNo: 1,
                minnaLesson: 26,
                title: "কারণ ও ব্যাখ্যা",
                kana: "だいいっか",
                rules: [
                    {
                        title: "Rule ①: どうし (ふつうけい) + んです\nいけいようし (ふつうけい) + んです\nなけいようし / めいし + なんです",
                        desc: "কথা বলার সময় কোনো ঘটনার কারণ, ব্যাখ্যা বা জোর প্রকাশের জন্য 'んです' ব্যবহৃত হয়।",
                        formula: "<strong>どうし (ふつうけい)</strong> + んです (かくんです / かかないんです)<br><strong>いけいようし</strong> + んです (あついんです)<br><strong>なけいようし / めいし</strong> + <strong>なんです</strong>",
                        points: [
                            { pTitle: "১. কারণ বা ব্যাখ্যা প্রদান:", pDesc: "শ্রোতার কাছে কোনো কাজের কারণ স্বতঃস্ফূর্তভাবে তুলে ধরতে।" },
                            { pTitle: "২. কারণ জিজ্ঞাসা (〜んですか):", pDesc: "চোখে দেখা অবস্থা দেখে কৌতুহলবশত কারণ জানতে চাইতে।" },
                            { pTitle: "৩. ভূমিকা হিসেবে (〜んですが):", pDesc: "কোনো অনুরোধ করার পূর্বে প্রসঙ্গ টানতে।" }
                        ],
                        examples: [
                            { jp: "どうして おくれた<mark class='hl'>んですか</mark>。", bn: "কেন দেরি হলো? (কারণ জানতে চাওয়া)" },
                            { jp: "バスが こなかった<mark class='hl'>んです</mark>。", bn: "আসলে বাস আসেনি বলে দেরি হয়েছে।" },
                            { jp: "あたまが いたい<mark class='hl'>んです</mark>。", bn: "আসলে মাথাটা খুব ব্যথা করছে।" },
                            { jp: "にほんごを べんきょうしたい<mark class='hl'>んですが</mark>、いい せんせいを しょうかいして ください。", bn: "জাপানি ভাষা শিখতে চাইছিলাম, ভালো শিক্ষক থাকলে পরিচয় করিয়ে দিন না।" }
                        ]
                    },
                    {
                        title: "Rule ②: どうし て-form + いただけませんか",
                        desc: "কারো কাছে অত্যন্ত বিনম্রভাবে কোনো সাহায্য বা রিকোয়েস্ট করার জন্য ব্যবহৃত হয়।",
                        formula: "<strong>どうし (て-form)</strong> + <strong>いただけませんか</strong>",
                        points: [{ pTitle: "ব্যবহারের নিয়ম:", pDesc: "て-ください এর চেয়ে অনেক বেশি ভদ্র রূপ।" }],
                        examples: [
                            { jp: "いい せんせいを しょうかいして <mark class='hl'>いただけませんか</mark>。", bn: "একজন ভালো শিক্ষকের সাথে পরিচয় করিয়ে দেবেন কি?" },
                            { jp: "もう いちど せつめいして <mark class='hl'>いただけませんか</mark>。", bn: "দয়া করে আরেকবার বুঝিয়ে দেবেন কি?" },
                            { jp: "コピーきの つかいかたを おしえて <mark class='hl'>いただけませんか</mark>。", bn: "ফটোকপি মেশিনের ব্যবহার একটু দেখিয়ে দেবেন কি?" }
                        ]
                    },
                    {
                        title: "Rule ③: ぎもんし + どうし た-form + ら いいですか",
                        desc: "কী, কোথায় বা কীভাবে কাজটি করলে ভালো হবে সে বিষয়ে অন্যের পরামর্শ বা উপদেশ চাইতে ব্যবহৃত হয়।",
                        formula: "<strong>ぎもんし (どう / どこ / なに)</strong> + <strong>どうし (たら-form)</strong> + <strong>いいですか</strong>",
                        points: [{ pTitle: "উপদেশ চাওয়া:", pDesc: "সিদ্ধান্ত নেওয়ার জন্য অভিজ্ঞদের মতামত নেওয়ার সবচেয়ে সুবিধাজনক কাঠামো।" }],
                        examples: [

            { minna: 37, kana: "だいじゅうにか", title: "নিষ্ক্রিয় বাচ্য (Passive Voice)", rTitle: "Rule ①: うけみけい (Passive Form - られる)\nRule ②: ক্ষতিগ্রস্ত হওয়া বা ভিকটিম প্যাসিভ", desc: "অন্যের দ্বারা প্রশংসিত হওয়া অথবা ক্ষতিগ্রস্ত হওয়া।", formula: "G1: a-sound + れます | G2: られます | G3: されます", ex: { jp: "せんせいに <mark class='hl'>ほめられました</mark>。", bn: "শিক্ষকের দ্বারা প্রশংসিত হয়েছিলাম।" } },
            { minna: 38, kana: "だいじゅうさんか", title: "ক্রিয়াপদের বিশেষ্যকরণ (Noun Clause)", rTitle: "Rule ①: じしょけい + のは / のが\nRule ②: じしょけい + のを わすれました", desc: "ক্রিয়াপদকে বিশেষ্যে রূপান্তর করে বাক্যের অংশ করা।", formula: "どうし (じしょけい) + の + は / が / を", ex: { jp: "テニスを <mark class='hl'>するのが</mark> すきです。", bn: "টেনিস খেলা আমার প্রিয়।" } },
            { minna: 39, kana: "だいじゅうよんか", title: "কারণ ও ফলাফল", rTitle: "Rule ①: どうし て-けい / い-くて / な-で\nRule ②: めいし + で (প্রাকৃতিক কারণ)", desc: "আবেগ, অনুভূতি বা প্রাকৃতিক দুর্যোগের পেছনের কারণ।", formula: "どうし (て-けい) / けいようし (て-けい) / めいし で", ex: { jp: "ニュースを <mark class='hl'>きいて</mark>、びっくりしました。", bn: "সংবাদটি শুনে চমকে গিয়েছিলাম।" } },
            { minna: 40, kana: "だいじゅうごか", title: "পরোক্ষ প্রশ্ন", rTitle: "Rule ①: ぎもんし + か\nRule ②: ふつうけい + かどうか\nRule ③: どうし て-けい + みます (চেষ্টা করে দেখা)", desc: "বাক্যের ভেতরে পরোক্ষ প্রশ্ন ও কোনো কিছু পরখ করা।", formula: "ぎもんし + ふつうけい + か / 〜かどうか", ex: { jp: "おいしい<mark class='hl'>かどうか</mark> たべて<mark class='hl'>みます</mark>。", bn: "সুস্বাদু কি না খেয়ে পরখ করে দেখছি।" } },
            { minna: 41, kana: "だいじゅうろっか", title: "দান ও গ্রহণ (উন্নত স্তর)", rTitle: "Rule ①: やる / いただく / くださる\nRule ②: どうし て-けい + いただきます / くださいます", desc: "শ্রদ্ধাশীল ও স্নেহপূর্ণভাবে দান এবং গ্রহণের মার্জিত রূপ।", formula: "めいし に もの を いただきます / めいし が くださいます", ex: { jp: "しゃちょうに おみやげを <mark class='hl'>いただきました</mark>。", bn: "প্রেসিডেন্টের কাছ থেকে উপহার পেয়েছি।" } },
            { minna: 42, kana: "だいじゅうななか", title: "উদ্দেশ্যমূলক কাজ ও ব্যবহার", rTitle: "Rule ①: じしょけい / めいし の + ために\nRule ②: じしょけい / めいし の + に つかいます", desc: "নির্দিষ্ট লক্ষ্য পূরণ বা কোনো সরঞ্জামের কার্যকারিতা।", formula: "どうし (じしょけい) / めいし の + ために", ex: { jp: "じぶんの うちを かう<mark class='hl'>ために</mark>、ちょきんしています。", bn: "নিজের বাড়ি কেনার উদ্দেশ্যে সঞ্চয় করছি।" } },
            { minna: 43, kana: "だいじゅうはっか", title: "অনুমান ও আসন্ন অবস্থা", rTitle: "Rule ①: ます-form بغیر ます / けいようし + そうです\nRule ②: どうし て-けい + きます (গিয়ে ফিরে আসা)", desc: "চোখে দেখে কোনো কিছু ঘটার উপক্রম হওয়া অনুমান করা।", formula: "どうし (Stem) / けいようし (Stem) + そうです", ex: { jp: "あめが ふり<mark class='hl'>そうです</mark>。", bn: "বৃষ্টি পড়বে পড়বে মনে হচ্ছে।" } },
            { minna: 44, kana: "だいじゅうきゅうか", title: "মাত্রারিক্ততা ও সুবিধা-অসুবিধা", rTitle: "Rule ①: ます-form بغیر ます + すぎます (অতিরিক্ত)\nRule ②: ます-form بغیر ます + やすい / にくい (সহজ/কঠিন)", desc: "মাত্রাতিরিক্ত কাজ এবং কোনো কাজ করার সহজতা বা জটিলতা।", formula: "どうし (Stem) + すぎます / やすいです / にくいです", ex: { jp: "この くすりは のみ<mark class='hl'>やすいです</mark>。", bn: "এই ওষুধটি খাওয়া সহজ।" } },
            { minna: 45, kana: "だいにじゅっか", title: "শর্ত ও অপ্রত্যাশিত ফলাফল", rTitle: "Rule ①: ふつうけい + ばあい (ばあいは)\nRule ②: ふつうけい + のに (তা সত্ত্বেও)", desc: "বিশেষ পরিস্থিতি এবং প্রত্যাশার সম্পূর্ণ বিপরীত ফলাফল।", formula: "ふつうけい + ばあいは / ふつうけい + のに", ex: { jp: "やくそくした<mark class='hl'>のに</mark>、かれは きませんでした。", bn: "কথা দেওয়া সত্ত্বেও সে আসেনি।" } },
            { minna: 46, kana: "だいにじゅういっか", title: "তাৎক্ষণিক পর্যায় ও নিশ্চয়তা", rTitle: "Rule ①: ところです (৩টি তাৎক্ষণিক পর্যায়)\nRule ②: どうし た-けい + ばかりです (এইমাত্র সম্পন্ন)\nRule ③: ふつうけい + はずです (দৃঢ় নিশ্চয়তা)", desc: "কাজের শুরু, চলমান বা ঠিক শেষ মুহূর্ত এবং যৌক্তিক বিশ্বাস।", formula: "じしょけい / ている / た-けい + ところです", ex: { jp: "たったいま かえった<mark class='hl'>ところです</mark>。", bn: "ঠিক এইমাত্র বাড়ি ফিরেছি।" } },
            { minna: 47, kana: "だいにじゅうにか", title: "শোনা কথা ও আভাস", rTitle: "Rule ①: ふつうけい + そうです (শুনেছি)\nRule ②: ふつうけい + ようです (আভাস/অনুমান)", desc: "অন্যের মুখে শোনা তথ্য এবং প্রমাণের ভিত্তিতে অনুমান।", formula: "ふつうけい + そうです (শোনা তথ্য)", ex: { jp: "あしたは あめが ふる<mark class='hl'>そうです</mark>。", bn: "শুনেছি আগামীকাল বৃষ্টি হবে।" } },
            { minna: 48, kana: "だいにじゅうさんか", title: "প্রেরণামূলক রূপ (Causative Verb)", rTitle: "Rule ①: しえきけい (Causative Verb - させる)\nRule ②: どうし (しえき て-けい) + いただけませんか", desc: "কাউকে কোনো কাজ করতে দেওয়া বা করানো এবং অনুমতি চাওয়া।", formula: "G1: a-sound + せます | G2: させます | G3: こさせます", ex: { jp: "はやく かえらせて <mark class='hl'>いただけませんか</mark>。", bn: "আমাকে একটু তাড়াতাড়ি যেতে অনুমতি দেবেন কি?" } },
            { minna: 49, kana: "だいにじゅうよんか", title: "সম্মানসূচক ভাষা (そんけいご)", rTitle: "Rule ①: お + どうし (Stem) + に なります\nRule ②: বিশেষ সম্মানসূচক ক্রিয়াপদ\nRule ③: お + どうし (Stem) + ください", desc: "অন্যের বা উর্ধ্বতন ব্যক্তির কাজকে সম্মান দিয়ে উপস্থাপন।", formula: "お + どうし (Stem) + に なります", ex: { jp: "しゃちょうは もう <mark class='hl'>お帰りに なりました</mark>。", bn: "প্রেসিডেন্ট মহোদয় বাড়ি ফিরে গিয়েছেন।" } },
            { minna: 50, kana: "だいにじゅうごか", title: "বিনম্র ভাষা (けんじょうご)", rTitle: "Rule ①: お / ご + どうし (Stem) + します\nRule ②: বিশেষ বিনম্র ক্রিয়াপদ (まいる / もうす / うかがう)", desc: "নিজের কাজকে বিনয়ের সাথে তুলে ধরে অন্যকে সম্মান জানানো।", formula: "お + どうし (Stem) + します / ご + めいし + します", ex: { jp: "おもい にもつを <mark class='hl'>おもちします</mark>。", bn: "ভারী ব্যাগটি আমি বহন করে দিচ্ছি।" } }
        ];

        fullN4Topics.forEach((t, index) => {
            const lessonId = index + 6;
            grammarData[lessonId] = {
                lessonNo: lessonId,
                minnaLesson: t.minna,
                title: t.title,
                kana: t.kana,
                rules: [
                    {
                        title: t.rTitle,
                        desc: t.desc,
                        formula: t.formula,
                        points: [{ pTitle: "মূল তাৎপর্য:", pDesc: t.desc }],
                        examples: [
                            t.ex,
                            { jp: "しっかり ふくしゅうして <mark class='hl'>ください</mark>。", bn: "মনোযোগ দিয়ে রিভিশন দিন।" }
                        ]
                    }
                ]
            };
        });

        let currentActiveLesson = 1;

        function renderLessonGrid() {
            const container = document.getElementById("lessonsGridContainer");
            container.innerHTML = "";

            for (let i = 1; i <= 25; i++) {
                const item = grammarData[i];
                const card = document.createElement("div");
                card.className = "lesson-card";
                card.setAttribute("data-key", `lesson ${i} লেসন ${toBn(i)} ${item.title} ${item.kana}`);
                card.onclick = () => openLessonDetail(i);

                card.innerHTML = `
                    <div class="card-top">
                        <span class="l-badge">L-${i < 10 ? '0' + i : i}</span>
                        <span class="kana-lesson-tag">${item.kana}</span>
                    </div>
                    <div class="card-lesson-title">লেসন ${toBn(i)}</div>
                    <div class="card-lesson-desc">${item.title}</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                `;
                container.appendChild(card);
            }
        }

        function openLessonDetail(lessonNo, pushHistory = true) {
            const item = grammarData[lessonNo] || grammarData[1];
            currentActiveLesson = lessonNo;

            document.getElementById("lessonGridView").style.display = "none";
            document.getElementById("lessonDetailView").style.display = "block";

            const formattedNo = lessonNo < 10 ? `০${toBn(lessonNo)}` : toBn(lessonNo);
            document.getElementById("detailMainTitle").innerText = `N4_ব্যাকরণ লেসন ${formattedNo}`;
            document.getElementById("detailSubTitle").innerText = `লেসন ${formattedNo} (${item.kana}) এর ব্যাখ্যা`;

            const rulesContainer = document.getElementById("rulesListContainer");
            rulesContainer.innerHTML = "";

            item.rules.forEach((r) => {
                const ruleCard = document.createElement("div");
                ruleCard.className = "rule-card";

                let pointsHtml = "";
                if (r.points && r.points.length > 0) {
                    pointsHtml = r.points.map(p => `
                        <div class="point-item">
                            <div class="point-title">${p.pTitle}</div>
                            <div class="point-desc">${p.pDesc}</div>
                        </div>
                    `).join('');
                }

                let exHtml = r.examples.map(ex => `
                    <div class="example-item">
                        <div class="ex-text-wrap">
                            <div class="jp-sentence">${ex.jp}</div>
                            <div class="bn-sentence">${ex.bn}</div>
                        </div>
                        <button class="speak-btn" onclick="speakText(this)" data-speech="${stripHtml(ex.jp)}" title="উচ্চারণ শুনুন">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                `).join('');

                ruleCard.innerHTML = `
                    <div class="rule-header" onclick="toggleRuleCard(this)">
                        <div class="rule-header-left">
                            <i class="fa-solid fa-book-open book-icon"></i>
                            <span class="rule-title-text">${r.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right rule-chevron"></i>
                    </div>
                    <div class="rule-body">
                        <p class="rule-desc">${r.desc}</p>
                        ${r.formula ? `<div class="formula-box">${r.formula}</div>` : ''}
                        ${pointsHtml}
                        <div class="sub-heading-point"><i class="fa-solid fa-circle-check" style="color:var(--jade);"></i> উদাহরণ বাক্য:</div>
                        <div class="examples-wrapper">${exHtml}</div>
                    </div>
                `;
                rulesContainer.appendChild(ruleCard);
            });

            updateJumpButtons();
            window.scrollTo({ top: 0, behavior: "smooth" });

            if (pushHistory) {
                history.pushState({ view: "detail", lesson: lessonNo }, "");
            }
        }

        function toggleRuleCard(header) {
            const currentCard = header.parentElement;
            const isAlreadyOpen = currentCard.classList.contains("open");

            document.querySelectorAll(".rule-card").forEach(c => c.classList.remove("open"));

            if (!isAlreadyOpen) {
                currentCard.classList.add("open");
            }
        }

        function updateJumpButtons() {
            const prevBtn = document.getElementById("btnPrevLesson");
            const nextBtn = document.getElementById("btnNextLesson");
            const prevTitle = document.getElementById("prevLessonTitle");
            const nextTitle = document.getElementById("nextLessonTitle");

            const prevNum = currentActiveLesson - 1;
            const nextNum = currentActiveLesson + 1;

            if (prevNum < 1) {
                prevBtn.classList.add("disabled");
                prevTitle.innerText = "শুরু";
            } else {
                prevBtn.classList.remove("disabled");
                prevTitle.innerText = `লেসন ${prevNum < 10 ? '০' + toBn(prevNum) : toBn(prevNum)}`;
            }

            if (nextNum > 25) {
                nextBtn.classList.add("disabled");
                nextTitle.innerText = "শেষ";
            } else {
                nextBtn.classList.remove("disabled");
                nextTitle.innerText = `লেসন ${nextNum < 10 ? '০' + toBn(nextNum) : toBn(nextNum)}`;
            }
        }

        function goToPrevLesson() {
            if (currentActiveLesson > 1) openLessonDetail(currentActiveLesson - 1);
        }

        function goToNextLesson() {
            if (currentActiveLesson < 25) openLessonDetail(currentActiveLesson + 1);
        }

        function handleBack(fromHistory = false) {
            if (document.getElementById("lessonDetailView").style.display === "block") {
                document.getElementById("lessonDetailView").style.display = "none";
                document.getElementById("lessonGridView").style.display = "block";
                window.scrollTo({ top: 0, behavior: "smooth" });

                if (!fromHistory && history.state && history.state.view === "detail") {
                    history.back();
                }
            } else {
                window.location.href = "index.html";
            }
        }

        window.addEventListener("popstate", (event) => {
            if (event.state && event.state.view === "detail") {
                openLessonDetail(event.state.lesson, false);
            } else {
                handleBack(true);
            }
        });

        function filterLessons() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const cards = document.querySelectorAll(".lesson-card");

            cards.forEach(card => {
                const key = card.getAttribute("data-key").toLowerCase();
                card.style.display = key.includes(query) ? "flex" : "none";
            });
        }

        function stripHtml(html) {
            const tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        function speakText(btn) {
            const text = btn.getAttribute('data-speech');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toBn(n) {
            const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return n.toString().split('').map(d => digits[d] || d).join('');
        }

        history.replaceState({ view: "grid" }, "");
        renderLessonGrid();
    </script>
</body>
</html>
