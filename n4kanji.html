<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N4 কাঞ্জি (১২১–৩২০) - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Klee+One:wght@600;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper: #fbf7ef;
            --ink: #182620;
            --pine: #0B4A38;
            --jade: #147A57;
            --clay: #B6472E;
            --gold: #A9781F;
            --mist: #7C8A82;
            --line: #E9E2D3;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding-bottom: 90px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(251, 247, 239, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--pine);
            background: #F0EAD9;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .back-btn:active { transform: scale(0.92); }

        .logo-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--pine);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .level-pill {
            background: var(--pine);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .container {
            padding: 14px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .subtitle-bar {
            text-align: center;
            font-size: 12.5px;
            color: var(--mist);
            font-weight: 600;
            margin-bottom: 16px;
            background: #F0EAD9;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-left: 4px solid var(--jade);
            border-radius: 14px;
            padding: 15px 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .lesson-card:active { transform: scale(0.97); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .kl-badge {
            background: #E6F3EC;
            color: var(--jade);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .kanji-watermark {
            font-family: 'Klee One', sans-serif;
            font-size: 14px;
            color: var(--mist);
            font-weight: 700;
        }

        .card-lesson-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .card-lesson-desc {
            font-size: 11px;
            color: var(--mist);
        }

        .card-arrow {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            color: #cbd5e1;
            font-size: 11px;
        }

        .kanji-view { display: none; }

        .view-header {
            text-align: center;
            margin-bottom: 14px;
        }

        .view-header h3 {
            font-size: 17.5px;
            font-weight: 800;
            color: var(--pine);
        }

        .kanji-item {
            margin-bottom: 11px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(11, 74, 56, 0.03);
            border: 1px solid var(--line);
            background: var(--card-bg);
        }

        .kanji-header {
            background: var(--pine);
            color: #ffffff;
            padding: 13px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14.5px;
        }

        .kanji-header .left-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kanji-header .left-info .icon-box {
            background: rgba(255, 255, 255, 0.18);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 12px;
        }

        .kanji-header .arrow-icon {
            font-size: 13px;
            transition: transform 0.25s ease;
        }

        .kanji-item.open .arrow-icon {
            transform: rotate(90deg);
        }

        .kanji-body {
            background: #ffffff;
            padding: 18px 16px;
            display: none;
        }

        .kanji-item.open .kanji-body {
            display: block;
        }

        .kanji-anim-stage {
            width: 170px;
            height: 170px;
            margin: 0 auto 16px;
            position: relative;
            background: #FAF7F0;
            border: 1.5px dashed #D2DDD6;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .kanji-anim-stage::before {
            content: "";
            position: absolute;
            left: 50%; top: 0; bottom: 0;
            width: 1px;
            border-left: 1px dashed var(--line);
            pointer-events: none;
            z-index: 1;
        }

        .kanji-anim-stage::after {
            content: "";
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            border-top: 1px dashed var(--line);
            pointer-events: none;
            z-index: 1;
        }

        .kanji-svg-wrap {
            width: 140px;
            height: 140px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kanji-svg-wrap svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .action-btn {
            border: 1px solid var(--line);
            background: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .action-btn:active { transform: scale(0.95); }
        .action-btn.play { color: var(--jade); border-color: #CCE7DC; background: #E6F3EC; }
        .action-btn.practice { color: var(--ink); border-color: var(--line); background: #FAF7F0; }
        .action-btn.test { color: var(--clay); border-color: #F5C9BF; background: #FBEAE6; }

        .readings-box {
            text-align: center;
            font-size: 13.5px;
            line-height: 1.85;
            margin-bottom: 14px;
            color: var(--ink);
            background: #FAF7F0;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
        }

        .readings-box span.jp-font {
            font-family: 'Klee One', sans-serif;
            font-weight: 700;
            color: var(--pine);
        }

        .detail-sub-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--pine);
            margin: 12px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vocab-list {
            list-style: none;
            font-size: 13px;
            line-height: 1.75;
            color: #4B5A52;
        }

        .vocab-list li {
            position: relative;
            padding-left: 14px;
            margin-bottom: 4px;
        }

        .vocab-list li::before {
            content: "•";
            position: absolute;
            left: 2px;
            color: var(--jade);
            font-weight: bold;
        }

        .vocab-list span.jp-word {
            font-family: 'Klee One', sans-serif;
            font-weight: 700;
            color: var(--ink);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(11, 30, 22, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .blind-test-card {
            background: #ffffff;
            width: 100%;
            max-width: 340px;
            border-radius: 24px;
            padding: 24px 20px 22px;
            text-align: center;
            position: relative;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
            animation: popUp 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close-icon {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--mist);
            cursor: pointer;
            line-height: 1;
        }

        .blind-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--pine);
            line-height: 1.35;
            margin-bottom: 16px;
        }

        .blind-canvas-box {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 14px;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .blind-svg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 250px;
            height: 250px;
            pointer-events: none;
            z-index: 1;
        }

        .blind-svg-layer svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #drawCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 250px;
            height: 250px;
            cursor: crosshair;
            touch-action: none;
            z-index: 2;
        }

        .blind-status-text {
            font-size: 15px;
            font-weight: 700;
            min-height: 24px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .status-correct { color: var(--jade) !important; }
        .status-completed { color: #0284c7 !important; }

        .blind-btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .blind-btn {
            border: none;
            padding: 9px 24px;
            border-radius: 24px;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .blind-btn:active { transform: scale(0.95); }
        .btn-hint { background: #fef08a; color: #854d0e; }
        .btn-retry { background: #FAF0DC; color: var(--gold); border: 1px solid #F0DFB6; }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(251, 247, 239, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: var(--mist);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .nav-item.active { color: var(--jade); }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <button class="back-btn" onclick="handleBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo-text">
                KOTOBA <span class="level-pill">N4 KANJI</span>
            </div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: var(--jade);">১২১–৩২০ কাঞ্জি</div>
    </header>

    <main class="container">
        <div id="lessonGridView">
            <div class="subtitle-bar">লেসন নির্বাচন করুন • MLC ১২১ থেকে ৩২০ সম্পূর্ণ N4 কাঞ্জি</div>
            <div class="lesson-grid" id="lessonsContainer"></div>
        </div>

        <div id="kanjiDetailView" class="kanji-view">
            <div class="view-header">
                <h3 id="lessonHeaderTitle">কাঞ্জি তালিকা</h3>
            </div>
            <div id="kanjiListContainer"></div>
        </div>
    </main>

    <div class="modal-overlay" id="blindTestModal">
        <div class="blind-test-card">
            <button class="modal-close-icon" onclick="closeBlindModal()">&times;</button>
            <h4 class="blind-title" id="blindModalTitle">Blind Test (না দেখে লিখুন)</h4>

            <div class="blind-canvas-box">
                <div class="blind-svg-layer" id="testSvgLayer"></div>
                <canvas id="drawCanvas" width="250" height="250"></canvas>
            </div>

            <div class="blind-status-text" id="blindStatus"></div>

            <div class="blind-btn-group">
                <button class="blind-btn btn-hint" id="hintBtn" onclick="toggleHint()"><i class="fa-regular fa-lightbulb"></i> Hint</button>
                <button class="blind-btn btn-retry" onclick="restartTest()"><i class="fa-solid fa-arrow-rotate-right"></i> Retry</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>লিডারবোর্ড</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script>
        const rawN4Kanji = [
            { char: "曜", kun: "-", on: "ヨウ", meaning: "সপ্তাহের দিন", vocab: [{w: "土曜日 (どようび)", m: "শনিবার"}, {w: "何曜日 (なんようび)", m: "কী বার"}] },
            { char: "作", kun: "つく(る)", on: "サク・サ", meaning: "তৈরি করা", vocab: [{w: "作ります (つくります)", m: "তৈরি করা"}, {w: "作文 (さくぶん)", m: "রচনা"}] },
            { char: "使", kun: "つか(う)", on: "シ", meaning: "ব্যবহার করা", vocab: [{w: "使います (つかいます)", m: "ব্যবহার করা"}, {w: "大使館 (たいしかん)", m: "দূতাবাস"}] },
            { char: "待", kun: "ま(つ)", on: "タイ", meaning: "অপেক্ষা করা", vocab: [{w: "待ちます (まちます)", m: "অপেক্ষা করা"}, {w: "招待 (しょうたい)", m: "আমন্ত্রণ"}] },
            { char: "力", kun: "ちから", on: "リョク・リキ", meaning: "শক্তি / ক্ষমতা", vocab: [{w: "力 (ちから)", m: "শক্তি"}, {w: "能力 (のうりょく)", m: "যোগ্যতা"}] },
            { char: "不", kun: "-", on: "フ・ブ", meaning: "অ- / নেতিবাচক", vocab: [{w: "不便 (ふべん)", m: "অসুবিধাজনক"}, {w: "不安 (ふあん)", m: "উদ্বেগ"}] },
            { char: "心", kun: "こころ", on: "シン", meaning: "হৃদয় / মন", vocab: [{w: "心 (こころ)", m: "মন"}, {w: "心配 (しんぱい)", m: "চিন্তা"}, {w: "安心 (あんしん)", m: "স্বস্তি"}] },
            { char: "文", kun: "ふみ", on: "ブン・モン", meaning: "বাক্য / সাহিত্য", vocab: [{w: "文 (ぶん)", m: "বাক্য"}, {w: "文学 (ぶんがく)", m: "সাহিত্য"}, {w: "文法 (ぶんぽう)", m: "ব্যাকরণ"}] },
            { char: "元", kun: "もと", on: "ゲン・ガン", meaning: "মূল / সুস্থতা", vocab: [{w: "元気 (げんき)", m: "সুস্থ / উদ্যমী"}] },
            { char: "音", kun: "おと・ね", on: "オン・イン", meaning: "শব্দ / সুর", vocab: [{w: "音 (おと)", m: "শব্দ"}, {w: "発音 (はつおん)", m: "উচ্চারণ"}, {w: "音楽 (おんがく)", m: "গান"}] },
            { char: "楽", kun: "たの(しい)", on: "ガク・ラク", meaning: "আনন্দদায়ক / আরাম", vocab: [{w: "楽しい (たのしい)", m: "আনন্দদায়ক"}, {w: "音楽 (おんがく)", m: "সঙ্গীত"}, {w: "楽 (らく)", m: "সহজ / স্বস্তিকর"}] },
            { char: "持", kun: "も(つ)", on: "ジ", meaning: "ধারণ করা / থাকা", vocab: [{w: "持ちます (もちます)", m: "হাতে নেওয়া / থাকা"}, {w: "お金持ち (おかねもち)", m: "ধনী ব্যক্তি"}] },
            { char: "映", kun: "うつ(る)", on: "エイ", meaning: "প্রতিফলিত হওয়া", vocab: [{w: "映画 (えいが)", m: "সিনেমা"}] },
            { char: "画", kun: "-", on: "ガ・カク", meaning: "ছবি / পরিকল্পনা", vocab: [{w: "映画 (えいが)", m: "সিনেমা"}, {w: "計画 (けいかく)", m: "পরিকল্পনা"}] },
            { char: "料", kun: "-", on: "リョウ", meaning: "উপাদান / ফি", vocab: [{w: "料理 (りょうり)", m: "রান্না"}, {w: "授業料 (じゅぎょうりょう)", m: "টিউশন ফি"}] },
            { char: "理", kun: "-", on: "リ", meaning: "যুক্তি / নীতি", vocab: [{w: "料理 (りょうり)", m: "রান্না"}, {w: "理由 (りゆう)", m: "কারণ"}] },
            { char: "方", kun: "かた", on: "ホウ", meaning: "দিক / ব্যক্তি / নিয়ম", vocab: [{w: "方 (かた)", m: "সম্মানিত ব্যক্তি"}, {w: "夕方 (ゆうがた)", m: "সন্ধ্যা"}, {w: "読み方 (よみかた)", m: "পড়ার নিয়ম"}] },
            { char: "台", kun: "-", on: "ダイ・タイ", meaning: "মেশিন গণনার একক", vocab: [{w: "台所 (だいどころ)", m: "রান্নাঘর"}, {w: "台風 (たいふう)", m: "ঘূর্ণিঝড়"}, {w: "一台 (いちだい)", m: "একটি মেশিন"}] },
            { char: "字", kun: "あざ", on: "ジ", meaning: "অক্ষর / লিপি", vocab: [{w: "字 (じ)", m: "অক্ষর"}, {w: "漢字 (かんじ)", m: "কাঞ্জি"}] },
            { char: "主", kun: "ぬし・おも", on: "シュ", meaning: "প্রধান / মালিক", vocab: [{w: "主人 (しゅじん)", m: "স্বামী / মালিক"}, {w: "主に (おもに)", m: "প্রধানত"}] }
        ];

        function toHexCode(char) {
            return "0" + char.charCodeAt(0).toString(16).toLowerCase();
        }

        const kanjiData = {};
        const itemsPerLesson = 10;
        const totalLessons = Math.ceil(rawN4Kanji.length / itemsPerLesson);

        for (let i = 0; i < totalLessons; i++) {
            const lessonNumber = i + 1;
            const slice = rawN4Kanji.slice(i * itemsPerLesson, (i + 1) * itemsPerLesson);
            kanjiData[lessonNumber] = slice.map((item, idx) => {
                const serialNum = 120 + (i * itemsPerLesson) + idx + 1;
                return {
                    id: `${serialNum}`,
                    char: item.char,
                    code: toHexCode(item.char),
                    kun: item.kun,
                    on: item.on,
                    meaning: item.meaning,
                    vocab: item.vocab
                };
            });
        }

        function renderLessonGrid() {
            const container = document.getElementById("lessonsContainer");
            container.innerHTML = "";

            for (let l = 1; l <= totalLessons; l++) {
                if(!kanjiData[l]) continue;
                const list = kanjiData[l];
                const startId = list[0].id;
                const endId = list[list.length - 1].id;
                const firstChar = list[0].char;
                const lastChar = list[list.length - 1].char;

                const card = document.createElement("div");
                card.className = "lesson-card";
                card.onclick = () => openLesson(l);
                card.innerHTML = `
                    <div class="card-top">
                        <span class="kl-badge">N4-${l < 10 ? '0' + l : l}</span>
                        <span class="kanji-watermark">${firstChar}〜${lastChar}</span>
                    </div>
                    <div class="card-lesson-title">কাঞ্জি লেসন ${l}</div>
                    <div class="card-lesson-desc">কাঞ্জি (${startId}–${endId})</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                `;
                container.appendChild(card);
            }
        }

        const svgCache = {};

        function cleanSvg(svgStr) {
            if (!svgStr) return "";
            const start = svgStr.indexOf("<svg");
            const end = svgStr.indexOf("</svg>");
            if (start !== -1 && end !== -1) {
                return svgStr.substring(start, end + 6);
            }
            return svgStr;
        }

        async function fetchKanjiSvg(hexCode) {
            if (svgCache[hexCode]) return svgCache[hexCode];
            try {
                const url = `https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hexCode}.svg`;
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const text = await res.text();
                const cleaned = cleanSvg(text);
                svgCache[hexCode] = cleaned;
                return cleaned;
            } catch (e) {
                return null;
            }
        }

        async function renderStaticSvg(holderId, hexCode) {
            const holder = document.getElementById(holderId);
            if (!holder) return;
            const svgText = await fetchKanjiSvg(hexCode);
            if (svgText) {
                holder.innerHTML = svgText;
                const svg = holder.querySelector('svg');
                if (!svg) return;
                svg.setAttribute("viewBox", "0 0 109 109");
                svg.style.width = "100%";
                svg.style.height = "100%";

                svg.querySelectorAll("text").forEach(t => t.style.display = "none");
                svg.querySelectorAll("path").forEach(p => {
                    p.style.stroke = "#0B4A38";
                    p.style.strokeWidth = "4.2";
                    p.style.strokeLinecap = "round";
                    p.style.strokeLinejoin = "round";
                    p.style.fill = "none";
                });
            }
        }

        function openLesson(lessonNo) {
            const items = kanjiData[lessonNo] || kanjiData[1];
            document.getElementById("lessonGridView").style.display = "none";
            document.getElementById("kanjiDetailView").style.display = "block";
            document.getElementById("lessonHeaderTitle").innerText = `কাঞ্জি লেসন ${lessonNo} (কাঞ্জি ${items[0].id}–${items[items.length - 1].id})`;

            const container = document.getElementById("kanjiListContainer");
            container.innerHTML = "";

            items.forEach((k, index) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = `kanji-item`;
                itemDiv.id = `kanjiItem_${index}`;

                let vocabHtml = k.vocab.map(v => `<li><span class="jp-word">${v.w}</span> — ${v.m}</li>`).join('');

                itemDiv.innerHTML = `
                    <div class="kanji-header" onclick="toggleKanji(${index})">
                        <div class="left-info">
                            <span class="icon-box"><i class="fa-solid fa-language"></i></span>
                            <span>Kanji ${k.id}: ${k.char}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </div>
                    <div class="kanji-body">
                        <div class="kanji-anim-stage">
                            <div class="kanji-svg-wrap" id="svgHolder_${index}"></div>
                        </div>

                        <div class="action-btns">
                            <button class="action-btn play" onclick="playKanjiStroke('${k.char}', '${k.code}', ${index})">
                                <i class="fa-solid fa-play"></i> Play
                            </button>
                            <button class="action-btn practice" onclick="openCanvasModal('${k.char}', '${k.code}', 'practice')">
                                <i class="fa-solid fa-pencil"></i> Practice
                            </button>
                            <button class="action-btn test" onclick="openCanvasModal('${k.char}', '${k.code}', 'test')">
                                <i class="fa-solid fa-star"></i> Test
                            </button>
                        </div>
                        <div class="readings-box">
                            <div><strong>Kunyomi:</strong> <span class="jp-font">${k.kun}</span></div>
                            <div><strong>Onyomi:</strong> <span class="jp-font">${k.on}</span></div>
                            <div><strong>Meaning:</strong> ${k.meaning}</div>
                        </div>
                        <div class="detail-sub-title"><i class="fa-solid fa-puzzle-piece" style="color:var(--jade);"></i> Vocabulary</div>
                        <ul class="vocab-list">${vocabHtml}</ul>
                    </div>
                `;
                container.appendChild(itemDiv);
                renderStaticSvg(`svgHolder_${index}`, k.code);
            });

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function toggleKanji(index) {
            const currentItem = document.getElementById(`kanjiItem_${index}`);
            const isAlreadyOpen = currentItem.classList.contains("open");

            document.querySelectorAll(".kanji-item").forEach(item => {
                item.classList.remove("open");
            });

            if (!isAlreadyOpen) {
                currentItem.classList.add("open");
            }
        }

        function handleBack() {
            if (document.getElementById("kanjiDetailView").style.display === "block") {
                document.getElementById("kanjiDetailView").style.display = "none";
                document.getElementById("lessonGridView").style.display = "block";
                window.scrollTo({ top: 0, behavior: "smooth" });
            } else {
                history.back();
            }
        }

        async function playKanjiStroke(char, hexCode, index) {
            const holder = document.getElementById(`svgHolder_${index}`);

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(char);
                u.lang = 'ja-JP';
                u.rate = 0.8;
                window.speechSynthesis.speak(u);
            }

            const svgText = await fetchKanjiSvg(hexCode);
            if (!svgText) return;

            holder.innerHTML = svgText;
            const svgEl = holder.querySelector('svg');
            if (!svgEl) return;
            svgEl.setAttribute("viewBox", "0 0 109 109");
            svgEl.style.width = "100%";
            svgEl.style.height = "100%";

            svgEl.querySelectorAll("text").forEach(t => t.style.display = "none");

            const paths = svgEl.querySelectorAll("path");
            let delay = 0;

            paths.forEach((path) => {
                const len = path.getTotalLength();
                path.style.stroke = "#147A57";
                path.style.strokeWidth = "4.5";
                path.style.strokeLinecap = "round";
                path.style.strokeLinejoin = "round";
                path.style.fill = "none";
                path.style.strokeDasharray = len;
                path.style.strokeDashoffset = len;
                path.style.transition = "none";

                setTimeout(() => {
                    path.style.transition = "stroke-dashoffset 0.55s cubic-bezier(0.4, 0, 0.2, 1)";
                    path.style.strokeDashoffset = "0";
                }, delay);

                delay += 550;
            });
        }

        const canvas = document.getElementById("drawCanvas");
        const ctx = canvas.getContext("2d");
        const testSvgLayer = document.getElementById("testSvgLayer");
        const statusText = document.getElementById("blindStatus");
        const modalTitle = document.getElementById("blindModalTitle");

        const BOX_SIZE = 250;
        const SVG_SCALE = BOX_SIZE / 109;

        let strokePathsData = [];
        let currentStrokeIdx = 0;
        let isDrawing = false;
        let showHint = true;
        let activeCheckpoints = [];
        let checkpointProgress = 0;

        let audioCtx = null;
        function playAudioTone(freq, type, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playSnapSound() { playAudioTone(720, 'sine', 0.12); }
        function playSuccessFanfare() {
            setTimeout(() => playAudioTone(523.25, 'triangle', 0.15), 0);
            setTimeout(() => playAudioTone(659.25, 'triangle', 0.15), 120);
            setTimeout(() => playAudioTone(783.99, 'triangle', 0.28), 240);
        }

        async function openCanvasModal(char, hexCode) {
            showHint = true;
            currentStrokeIdx = 0;

            modalTitle.innerText = "Blind Test (না দেখে লিখুন)";
            statusText.className = "blind-status-text";
            statusText.innerText = "";

            document.getElementById("blindTestModal").style.display = "flex";

            const svgText = await fetchKanjiSvg(hexCode);
            testSvgLayer.innerHTML = svgText || "";

            const svgEl = testSvgLayer.querySelector("svg");
            if (!svgEl) return;
            svgEl.setAttribute("viewBox", "0 0 109 109");
            svgEl.querySelectorAll("text").forEach(t => t.style.display = "none");

            const paths = Array.from(svgEl.querySelectorAll("path"));
            strokePathsData = paths.map(path => {
                const len = path.getTotalLength();
                const cpCount = 5;
                const checkpoints = [];
                for (let i = 0; i < cpCount; i++) {
                    const frac = (i + 0.5) / cpCount;
                    const pt = path.getPointAtLength(len * frac);
                    checkpoints.push({ x: pt.x * SVG_SCALE, y: pt.y * SVG_SCALE });
                }
                return { pathEl: path, length: len, checkpoints: checkpoints };
            });

            updateSvgDisplayState();
            setupActiveStroke();
            clearScratchpad();
        }

        function closeBlindModal() {
            document.getElementById("blindTestModal").style.display = "none";
            clearScratchpad();
        }

        function toggleHint() {
            showHint = !showHint;
            updateSvgDisplayState();
        }

        function updateSvgDisplayState() {
            strokePathsData.forEach((item, index) => {
                const p = item.pathEl;
                p.style.strokeLinecap = "round";
                p.style.strokeLinejoin = "round";
                p.style.fill = "none";

                if (index < currentStrokeIdx) {
                    p.style.display = "block";
                    p.style.stroke = "#182620";
                    p.style.strokeWidth = "6.5";
                    p.style.opacity = "1";
                } else if (index === currentStrokeIdx) {
                    p.style.display = "block";
                    p.style.stroke = "#cbd5e1";
                    p.style.strokeWidth = "6.5";
                    p.style.opacity = showHint ? "1" : "0";
                } else {
                    p.style.display = "block";
                    p.style.stroke = "#cbd5e1";
                    p.style.strokeWidth = "6.5";
                    p.style.opacity = showHint ? "0.6" : "0";
                }
            });
        }

        function setupActiveStroke() {
            if (currentStrokeIdx >= strokePathsData.length) {
                statusText.className = "blind-status-text status-completed";
                statusText.innerText = "অভিনন্দন! আপনি সঠিকভাবে লিখতে পেরেছেন।";
                playSuccessFanfare();
                return;
            }
            activeCheckpoints = strokePathsData[currentStrokeIdx].checkpoints;
            checkpointProgress = 0;
        }

        function restartTest() {
            currentStrokeIdx = 0;
            statusText.className = "blind-status-text";
            statusText.innerText = "";
            clearScratchpad();
            updateSvgDisplayState();
            setupActiveStroke();
        }

        function clearScratchpad() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        }

        ctx.lineWidth = 14;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#182620";

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: (clientX - rect.left), y: (clientY - rect.top) };
        }

        function onDrawStart(e) {
            if (currentStrokeIdx >= strokePathsData.length) return;
            isDrawing = true;
            const pt = getCanvasCoords(e);
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
            verifyCheckpoint(pt.x, pt.y);
        }

        function onDrawMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pt = getCanvasCoords(e);
            ctx.lineTo(pt.x, pt.y);
            ctx.stroke();
            verifyCheckpoint(pt.x, pt.y);
        }

        function onDrawEnd() {
            if (!isDrawing) return;
            isDrawing = false;
            clearScratchpad();
            checkpointProgress = 0;
        }

        function verifyCheckpoint(x, y) {
            if (!activeCheckpoints || checkpointProgress >= activeCheckpoints.length) return;
            const target = activeCheckpoints[checkpointProgress];
            const dist = Math.hypot(x - target.x, y - target.y);
            if (dist < 36) {
                checkpointProgress++;
                if (checkpointProgress >= activeCheckpoints.length) {
                    onStrokeAutoSnapped();
                }
            }
        }

        function onStrokeAutoSnapped() {
            playSnapSound();
            currentStrokeIdx++;
            clearScratchpad();
            updateSvgDisplayState();
            statusText.className = "blind-status-text status-correct";
            statusText.innerText = "সঠিক!";
            setupActiveStroke();
        }

        canvas.addEventListener("mousedown", onDrawStart);
        canvas.addEventListener("mousemove", onDrawMove);
        window.addEventListener("mouseup", onDrawEnd);

        canvas.addEventListener("touchstart", onDrawStart, { passive: false });
        canvas.addEventListener("touchmove", onDrawMove, { passive: false });
        window.addEventListener("touchend", onDrawEnd);

        window.addEventListener("DOMContentLoaded", () => {
            renderLessonGrid();
        });
    </script>
</body>
</html>
