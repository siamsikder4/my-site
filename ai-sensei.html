<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI সেনসেই - KOTOBA</title>
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0fdf4;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* লোডার ওভারলে */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .book-loader {
            position: relative;
            width: 60px;
            height: 44px;
            perspective: 200px;
            margin-bottom: 16px;
        }

        .book-loader .cover-left, .book-loader .cover-right {
            position: absolute;
            top: 2px;
            width: 28px;
            height: 40px;
            border: 2px solid #059669;
            background: #ffffff;
        }

        .book-loader .cover-left {
            left: 2px;
            border-right: none;
            border-radius: 4px 0 0 4px;
        }

        .book-loader .cover-right {
            right: 2px;
            border-left: none;
            border-radius: 0 4px 4px 0;
        }

        .book-loader .spine {
            position: absolute;
            left: 29px;
            top: 0;
            width: 2px;
            height: 44px;
            background: #059669;
        }

        .book-loader .page {
            position: absolute;
            width: 27px;
            height: 40px;
            top: 2px;
            right: 3px;
            border: 2px solid #059669;
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #ffffff;
            transform-origin: left center;
            animation: flipBook 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .book-loader .page:nth-child(1) { animation-delay: 0.15s; }
        .book-loader .page:nth-child(2) { animation-delay: 0.35s; }
        .book-loader .page:nth-child(3) { animation-delay: 0.55s; }

        @keyframes flipBook {
            0% { transform: rotateY(0deg); }
            50%, 100% { transform: rotateY(-180deg); }
        }

        .loading-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #065f46;
            letter-spacing: 1px;
        }

        /* টপ বার */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            color: #064e3b;
            font-size: 16px;
            text-decoration: none;
            background: #f1f5f9;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .back-btn:active {
            background: #e2e8f0;
        }

        .nav-title-wrap {
            display: flex;
            flex-direction: column;
        }

        .nav-title {
            font-weight: 800;
            font-size: 15.5px;
            color: #064e3b;
        }

        .nav-subtitle {
            font-size: 11px;
            color: #059669;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .clear-chat-btn {
            background: transparent;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 13px;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .clear-chat-btn:hover {
            color: #ef4444;
            border-color: #fca5a5;
            background: #fef2f2;
        }

        /* চ্যাট কন্টেইনার */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            background: #f8fafc;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            padding: 16px 14px 120px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 86%;
        }

        .msg-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-wrapper.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 11px 15px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }

        .bot-bubble {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1.5px 4px rgba(0,0,0,0.02);
        }

        .user-bubble {
            background: linear-gradient(135deg, #059669, #047857);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 6px rgba(5, 150, 105, 0.2);
        }

        .msg-time {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
            padding: 0 4px;
        }

        /* টাইপিং ইন্ডিকেটর */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #059669;
            border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        /* ভাসমান ইনপুট বার */
        .chat-input-wrapper {
            position: fixed;
            bottom: 62px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            background: transparent;
            pointer-events: none;
            padding: 0 12px 10px 12px;
            z-index: 100;
        }

        .chat-input-area {
            pointer-events: auto;
            max-width: 626px;
            width: 100%;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 30px;
            padding: 6px 8px 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: border-color 0.2s;
        }

        .chat-input-area:focus-within {
            border-color: #059669;
        }

        .chat-input-area input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 13.5px;
            color: #1e293b;
            background: transparent;
        }

        .chat-input-area button {
            background: #059669;
            color: #ffffff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: transform 0.15s, background 0.2s;
            flex-shrink: 0;
        }

        .chat-input-area button:active {
            transform: scale(0.92);
        }

        /* বটম বার */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 62px;
            background: #ffffff;
            border-top: 1px solid #eef2f5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: #8392a5;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .nav-item.active {
            color: #064e3b;
        }

        .nav-item i {
            font-size: 19px;
        }
    </style>
</head>
<body>

    <!-- লোডার ওভারলে -->
    <div id="pageLoader" class="loader-overlay">
        <div class="book-loader">
            <div class="cover-left"></div>
            <div class="cover-right"></div>
            <div class="spine"></div>
            <div class="page"></div>
            <div class="page"></div>
            <div class="page"></div>
        </div>
        <div class="loading-text">読み込み中...</div>
    </div>

    <!-- টপ বার -->
    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="nav-title-wrap">
                <span class="nav-title">সেনসেই AI টিউটর</span>
                <span class="nav-subtitle"><span class="pulse-dot"></span> অনলাইন ও প্রস্তুত</span>
            </div>
        </div>
        <button class="clear-chat-btn" id="clearHistoryBtn" title="হিস্ট্রি মুছে ফেলুন">
            <i class="fa-solid fa-trash-can"></i>
        </button>
    </header>

    <!-- মূল চ্যাট লেআউট -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- জাভাস্ক্রিপ্টের মাধ্যমে লাইভ হিস্ট্রি এখানে রেন্ডার হবে -->
        </div>
    </div>

    <!-- ভাসমান ইনপুট এরিয়া -->
    <div class="chat-input-wrapper">
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="জাপানি ভাষা বা ওয়েবসাইট নিয়ে কিছু জিজ্ঞাসা করুন..." autocomplete="off">
            <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- ফিক্সড বটম বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>
        <a href="ai-sensei.html" class="nav-item active">
            <i class="fa-solid fa-robot"></i>
            <span>AI সেনসেই</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-circle-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>

    <!-- স্ক্রিপ্ট ও Groq API লজিক -->
    <script>
        window.addEventListener("load", () => {
            const loader = document.getElementById("pageLoader");
            if (loader) loader.classList.add("hidden");
        });

        const GROQ_API_KEY = "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";
        const STORAGE_KEY = "kotoba_sensei_chat_history";
        
        const SYSTEM_INSTRUCTION = "You are 'Sensei' (সেনসেই), an expert Japanese language teacher and assistant for the 'KOTOBA' website built for Bengali students. You answer questions related to the Japanese language (Hiragana, Katakana, Kanji, Grammar, Vocabulary, Minna no Nihongo, JLPT N5/N4) AND questions about the KOTOBA website updates (such as N5/N4 vocabulary lists, interactive 3D flashcards, bookmarking with LocalStorage sync, profile management, and AI Sensei chat). Always reply politely in Bengali. For Japanese words, include pronunciation/kana in brackets. If a user asks what is new on the website, mention features like interactive 3D flashcards, synchronized vocabulary bookmarks, and enhanced N5/N4 grammar guides.";

        const DEFAULT_WELCOME_MSG = {
            role: "assistant",
            content: "আসসালামু আলাইকুম / কোননিচিওয়া (こんにちは)! আমি আপনার জাপানি ভাষা শিক্ষক 'সেনসেই'। KOTOBA ওয়েবসাইটে আপনাকে স্বাগতম! জাপানি ভাষা, ব্যাকরণ, কাঞ্জি বা আমাদের ওয়েবসাইটে নতুন কি কি ফিচার যোগ হয়েছে সে সম্পর্কে যেকোনো প্রশ্ন আমাকে করতে পারেন।",
            time: getCurrentTime()
        };

        const chatMessages = document.getElementById("chatMessages");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");

        // লোকাল স্টোরেজ থেকে লাইভ হিস্ট্রি লোড
        let chatHistory = loadChatHistory();

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function loadChatHistory() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {
                console.error("Failed to parse chat history", e);
            }
            return [DEFAULT_WELCOME_MSG];
        }

        function saveChatHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
            } catch (e) {
                console.error("Failed to save chat history", e);
            }
        }

        function renderMessages() {
            chatMessages.innerHTML = "";
            chatHistory.forEach(item => {
                appendMessageDOM(item.content, item.role === "user" ? "user" : "bot", item.time);
            });
            scrollToBottom();
        }

        function appendMessageDOM(text, sender, timeStr) {
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}`;

            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${sender === "user" ? "user-bubble" : "bot-bubble"}`;
            bubble.innerText = text;

            const time = document.createElement("span");
            time.className = "msg-time";
            time.innerText = timeStr || getCurrentTime();

            wrapper.appendChild(bubble);
            wrapper.appendChild(time);
            chatMessages.appendChild(wrapper);
            return bubble;
        }

        function showTypingIndicator() {
            const wrapper = document.createElement("div");
            wrapper.className = "msg-wrapper bot";
            wrapper.id = "typingIndicator";

            const indicator = document.createElement("div");
            indicator.className = "typing-indicator";
            indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

            wrapper.appendChild(indicator);
            chatMessages.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function removeTypingIndicator() {
            const el = document.getElementById("typingIndicator");
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const timeNow = getCurrentTime();

            // ইউজার মেসেজ DOM এবং হিস্ট্রিতে যোগ করা
            appendMessageDOM(text, "user", timeNow);
            chatHistory.push({ role: "user", content: text, time: timeNow });
            saveChatHistory();

            userInput.value = "";
            scrollToBottom();

            showTypingIndicator();

            // এপিআই-এর উপযোগী মেসেজ স্ট্রাকচার প্রস্তুত করা
            const apiMessages = [
                { role: "system", content: SYSTEM_INSTRUCTION },
                ...chatHistory.map(item => ({ role: item.role, content: item.content }))
            ];

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: apiMessages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                removeTypingIndicator();

                let botReply = "দুঃখিত, সেনসেই উত্তর দিতে পারছে না। পরে চেষ্টা করুন।";

                if (data.choices && data.choices[0].message.content) {
                    botReply = data.choices[0].message.content;
                } else if (data.error) {
                    botReply = "এরর: " + (data.error.message || "সমস্যা হয়েছে।");
                }

                const replyTime = getCurrentTime();
                appendMessageDOM(botReply, "bot", replyTime);
                chatHistory.push({ role: "assistant", content: botReply, time: replyTime });
                saveChatHistory();

            } catch (err) {
                removeTypingIndicator();
                const errTime = getCurrentTime();
                const errorMsg = "সার্ভারের সাথে সংযোগ স্থাপন সম্ভব হয়নি। ইন্টারনেট কানেকশন চেক করুন।";
                appendMessageDOM(errorMsg, "bot", errTime);
                chatHistory.push({ role: "assistant", content: errorMsg, time: errTime });
                saveChatHistory();
            }

            scrollToBottom();
        }

        // চ্যাট হিস্ট্রি রিসেট হ্যান্ডলার
        clearHistoryBtn.addEventListener("click", () => {
            if (confirm("আপনি কি সব চ্যাট হিস্ট্রি মুছে ফেলতে চান?")) {
                chatHistory = [DEFAULT_WELCOME_MSG];
                saveChatHistory();
                renderMessages();
            }
        });

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        // স্ক্রিন লোড হলে চ্যাট হিস্ট্রি ডিসপ্লে করা
        renderMessages();
    </script>
</body>
</html>
