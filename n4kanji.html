<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N4 কাঞ্জি (১২১–৩২০) - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Klee+One:wght@600;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f8fafc;
            --ink: #0f172a;
            --pine: #0B4A38;
            --jade: #147A57;
            --line: #e2e8f0;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding-bottom: 80px;
            user-select: none;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left { display: flex; align-items: center; gap: 12px; }

        .back-btn {
            text-decoration: none;
            color: var(--ink);
            background: #f1f5f9;
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--line);
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }
        .back-btn:active { transform: scale(0.92); }

        .logo-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--pine);
            display: flex; align-items: center; gap: 6px;
            letter-spacing: 0.5px;
        }

        .level-pill {
            background: #0f172a;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .container {
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .subtitle-bar {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 14px;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }

        /* লেসন গ্রিড */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .lesson-card {
            background: #ffffff;
            border: 1px solid var(--line);
            border-left: 4px solid #0f172a;
            border-radius: 16px;
            padding: 16px 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: transform 0.15s ease;
        }
        .lesson-card:active { transform: scale(0.97); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .kl-badge {
            background: #f1f5f9;
            color: #334155;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .kanji-watermark {
            font-family: 'Klee One', sans-serif;
            font-size: 15px;
            color: #94a3b8;
            font-weight: 700;
        }

        .card-lesson-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .card-lesson-desc { font-size: 11.5px; color: #64748b; }

        /* কাঞ্জি লিস্ট ভিউ */
        .kanji-view { display: none; }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--line);
        }

        .view-header h3 { font-size: 15px; font-weight: 800; color: #0f172a; }

        .lesson-flash-btn {
            background: #0f172a;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
            transition: transform 0.15s;
        }
        .lesson-flash-btn:active { transform: scale(0.93); }

        .kanji-item {
            margin-bottom: 11px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: #ffffff;
        }

        .kanji-header {
            background: #0f172a;
            color: #ffffff;
            padding: 13px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14.5px;
        }

        .kanji-header .arrow-icon {
            font-size: 13px;
            transition: transform 0.25s ease;
        }

        .kanji-item.open .arrow-icon { transform: rotate(90deg); }

        .kanji-body {
            background: #ffffff;
            padding: 18px 16px;
            display: none;
        }

        .kanji-item.open .kanji-body { display: block; }

        .kanji-anim-stage {
            width: 160px; height: 160px;
            margin: 0 auto 16px;
            position: relative;
            background: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .kanji-svg-wrap {
            width: 130px; height: 130px;
            display: flex; align-items: center; justify-content: center;
        }
        .kanji-svg-wrap svg { width: 100% !important; height: 100% !important; display: block; }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .action-btn {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            display: flex; align-items: center; gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.play { color: var(--jade); border-color: #CCE7DC; background: #E6F3EC; }
        .action-btn.card { color: #0f172a; border-color: #cbd5e1; background: #f8fafc; }

        .readings-box {
            text-align: center;
            font-size: 13.5px;
            line-height: 1.85;
            margin-bottom: 14px;
            color: var(--ink);
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
        }

        .readings-box span.jp-font { font-family: 'Klee One', sans-serif; font-weight: 700; color: #0f172a; }

        .detail-sub-title {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            margin: 12px 0 8px;
            display: flex; align-items: center; gap: 6px;
        }

        .vocab-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }

        .vocab-item {
            background: #f8fafc;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 13px;
        }

        /* -------------------------------------------------------------
           মিনিমাল কার্ড সোয়াইপ ডেক (ভিডিওর হুবহু ইন্টারঅ্যাকশন)
        ------------------------------------------------------------- */
        .flashcard-fullscreen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            z-index: 10000;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px 30px;
            overflow: hidden;
            touch-action: none;
        }

        .stack-top-info {
            width: 100%;
            max-width: 330px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 700;
            color: #94a3b8;
        }

        .stack-close-btn {
            background: #f1f5f9;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            color: #475569;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s;
        }
        .stack-close-btn:active { transform: scale(0.9); }

        .deck-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* পেছনের ডেক কার্ড লেয়ার */
        .deck-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            pointer-events: none;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }
        .deck-layer.layer-1 {
            transform: translateY(12px) scale(0.96);
            z-index: 1;
            opacity: 0.8;
        }
        .deck-layer.layer-2 {
            transform: translateY(24px) scale(0.92);
            z-index: 0;
            opacity: 0.4;
        }

        /* মূল সোয়াইপ কার্ড */
        .main-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 28px;
            border: 1.5px solid #cbd5e1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 24px;
            cursor: grab;
            overflow: hidden;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
        }

        .main-card:active { cursor: grabbing; }

        .card-top-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-kanji-label {
            font-family: 'Klee One', 'Noto Sans JP', sans-serif;
            font-size: 38px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1;
        }

        .audio-speaker-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #94a3b8;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s, color 0.15s;
        }
        .audio-speaker-btn:hover { color: #0f172a; }
        .audio-speaker-btn:active { transform: scale(0.9); }

        .card-center-kanji {
            font-family: 'Klee One', 'Noto Sans JP', sans-serif;
            font-size: 110px;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            line-height: 1;
            margin: auto 0;
        }

        .card-bottom-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            z-index: 6;
        }

        /* ভিডিওর কালো ডট বাটন */
        .reveal-dot-btn {
            width: 18px;
            height: 18px;
            background: #0f172a;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .reveal-dot-btn:active { transform: scale(1.35); }

        /* কালো রিভিল শিট (ট্যাপ করলে নিচ থেকে উঠবে) */
        .answer-reveal-sheet {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 0%;
            background: #000000;
            border-radius: 26px;
            color: #ffffff;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            transition: height 0.35s cubic-bezier(0.16, 1, 0.3, 1), padding 0.35s ease;
            z-index: 10;
        }

        .answer-reveal-sheet.revealed {
            height: 58%;
            padding: 22px 24px;
        }

        .ans-meaning {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ans-readings {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }
        .ans-readings strong { color: #ffffff; font-family: 'Klee One', sans-serif; font-size: 15px; }

        .ans-vocab-box {
            font-size: 13px;
            color: #94a3b8;
            max-height: 110px;
            overflow-y: auto;
        }
        .ans-vocab-item { margin-bottom: 5px; line-height: 1.35; }
        .ans-vocab-item strong {
            color: #38bdf8;
            font-family: 'Klee One', sans-serif;
            font-size: 13.5px;
        }

        .bottom-hint-row {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex; justify-content: space-around;
            align-items: center; z-index: 1000;
        }

        .nav-item {
            text-decoration: none; color: #94a3b8;
            font-size: 11px; display: flex; flex-direction: column;
            align-items: center; gap: 4px; font-weight: 600;
        }
        .nav-item.active { color: #0f172a; }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <button class="back-btn" onclick="handleBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo-text">
                KOTOBA <span class="level-pill">N4 KANJI</span>
            </div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: #475569;">১২১–৩২০ কাঞ্জি</div>
    </header>

    <main class="container">
        <!-- লেসন গ্রিড -->
        <div id="lessonGridView">
            <div class="subtitle-bar">লেসন নির্বাচন করুন • আঙুল দিয়ে টেনে সোয়াইপ করুন</div>
            <div class="lesson-grid" id="lessonsContainer"></div>
        </div>

        <!-- কাঞ্জি লিস্ট ভিউ -->
        <div id="kanjiDetailView" class="kanji-view">
            <div class="view-header">
                <h3 id="lessonHeaderTitle">কাঞ্জি তালিকা</h3>
                <button class="lesson-flash-btn" onclick="startDeck()">
                    <i class="fa-solid fa-layer-group"></i> ফ্ল্যাশ কার্ড ডেক
                </button>
            </div>
            <div id="kanjiListContainer"></div>
        </div>
    </main>

    <!-- -------------------------------------------------------------
         ভিডিওর অনুরূপ ফুলস্ক্রিন মিনিমাল স্ট্যাকড ফ্ল্যাশকার্ড সিস্টেম
    ------------------------------------------------------------- -->
    <div class="flashcard-fullscreen" id="deckOverlay">
        <div class="stack-top-info">
            <span id="deckCounter">1 / 10</span>
            <button class="stack-close-btn" onclick="closeDeck()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- স্ট্যাক ডেক -->
        <div class="deck-wrapper">
            <div class="deck-layer layer-2"></div>
            <div class="deck-layer layer-1"></div>

            <!-- মূল কার্ড (আঙুল দিয়ে ড্র্যাগ ও সোয়াইপ করা যাবে) -->
            <div class="main-card" id="activeCard">
                <div class="card-top-row">
                    <span class="top-kanji-label" id="cardTopKanji">曜</span>
                    <button class="audio-speaker-btn" onclick="event.stopPropagation(); playCurrentDeckAudio();" title="উচ্চারণ শুনুন">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>

                <div class="card-center-kanji" id="cardCenterKanji">曜</div>

                <div class="card-bottom-row">
                    <div class="reveal-dot-btn" id="revealDot" title="উত্তর প্রকাশ করুন"></div>
                </div>

                <!-- কালো শিট (ট্যাপে উত্তর খুলবে) -->
                <div class="answer-reveal-sheet" id="answerSheet">
                    <div class="ans-meaning">
                        <span id="ansMeaningText">সপ্তাহের দিন</span>
                        <button class="audio-speaker-btn" style="color:#ffffff;" onclick="event.stopPropagation(); playCurrentDeckAudio();">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                    <div class="ans-readings" id="ansReadingsText">
                        Kunyomi: <strong>-</strong><br>
                        Onyomi: <strong>ヨウ</strong>
                    </div>
                    <div class="ans-vocab-box" id="ansVocabBox"></div>
                </div>
            </div>
        </div>

        <div class="bottom-hint-row">
            <i class="fa-solid fa-hand-pointer"></i> ডটে ট্যাপ করে উত্তর দেখুন • আঙুল দিয়ে টেনে সোয়াইপ করুন
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>লিডারবোর্ড</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script>
        /* -------------------------------------------------------------
           সম্পূর্ণ N4 কাঞ্জি ডাটাবেস (১২১ - ৩২০) - মোট ২০০টি কাঞ্জি
        ------------------------------------------------------------- */
        const rawN4Kanji = [
            { char: "曜", kun: "-", on: "ヨウ", meaning: "সপ্তাহের দিন", vocab: [{w: "土曜日 (どようび)", m: "শনিবার"}, {w: "何曜日 (なんようび)", m: "কী বার"}] },
            { char: "作", kun: "つく(る)", on: "サク・サ", meaning: "তৈরি করা", vocab: [{w: "作ります (つくります)", m: "তৈরি করা"}, {w: "作文 (さくぶん)", m: "রচনা"}] },
            { char: "使", kun: "つか(う)", on: "シ", meaning: "ব্যবহার করা", vocab: [{w: "使います (つかいます)", m: "ব্যবহার করা"}, {w: "大使館 (たいしかん)", m: "দূতাবাস"}] },
            { char: "待", kun: "ま(つ)", on: "タイ", meaning: "অপেক্ষা করা", vocab: [{w: "待ちます (まちます)", m: "অপেক্ষা করা"}, {w: "招待 (しょうたい)", m: "আমন্ত্রণ"}] },
            { char: "力", kun: "ちから", on: "リョク・リキ", meaning: "শক্তি / ক্ষমতা", vocab: [{w: "力 (ちから)", m: "শক্তি"}, {w: "能力 (のうりょく)", m: "যোগ্যতা"}] },
            { char: "不", kun: "-", on: "フ・ブ", meaning: "অ- / নেতিবাচক", vocab: [{w: "不便 (ふべん)", m: "অসুবিধাজনক"}, {w: "不安 (ふあん)", m: "উদ্বেগ"}] },
            { char: "心", kun: "こころ", on: "シン", meaning: "হৃদয় / মন", vocab: [{w: "心 (こころ)", m: "মন"}, {w: "心配 (しんぱい)", m: "চিন্তা"}, {w: "安心 (あんしん)", m: "স্বস্তি"}] },
            { char: "文", kun: "ふみ", on: "ブン・モン", meaning: "বাক্য / সাহিত্য", vocab: [{w: "文 (ぶん)", m: "বাক্য"}, {w: "文学 (ぶんがく)", m: "সাহিত্য"}, {w: "文法 (ぶんぽう)", m: "ব্যাকরণ"}] },

            { char: "光", kun: "ひか(る)・ひかり", on: "コウ", meaning: "আলো / দীপ্তি", vocab: [{w: "光 (ひかり)", m: "আলো"}, {w: "光ります (ひかります)", m: "উজ্জ্বল হওয়া"}] },
            { char: "線", kun: "-", on: "セン", meaning: "রেখা / লাইন", vocab: [{w: "線 (せん)", m: "রেখা"}, {w: "新幹線 (しんかんせん)", m: "বুলেট ট্রেন"}] }
        ];

        function toHexCode(char) {
            return "0" + char.charCodeAt(0).toString(16).toLowerCase();
        }

        const kanjiData = {};
        const itemsPerLesson = 10;
        const totalLessons = Math.ceil(rawN4Kanji.length / itemsPerLesson);

        for (let i = 0; i < totalLessons; i++) {
            const lessonNumber = i + 1;
            const slice = rawN4Kanji.slice(i * itemsPerLesson, (i + 1) * itemsPerLesson);
            kanjiData[lessonNumber] = slice.map((item, idx) => {
                const serialNum = 120 + (i * itemsPerLesson) + idx + 1;
                return {
                    id: `${serialNum}`,
                    char: item.char,
                    code: toHexCode(item.char),
                    kun: item.kun,
                    on: item.on,
                    meaning: item.meaning,
                    vocab: item.vocab
                };
            });
        }

        function renderLessonGrid() {
            const container = document.getElementById("lessonsContainer");
            container.innerHTML = "";

            for (let l = 1; l <= totalLessons; l++) {
                const list = kanjiData[l];
                const startId = list[0].id;
                const endId = list[list.length - 1].id;
                const firstChar = list[0].char;
                const lastChar = list[list.length - 1].char;

                const card = document.createElement("div");
                card.className = "lesson-card";
                card.onclick = () => openLesson(l);
                card.innerHTML = `
                    <div class="card-top">
                        <span class="kl-badge">N4-${l < 10 ? '0' + l : l}</span>
                        <span class="kanji-watermark">${firstChar}〜${lastChar}</span>
                    </div>
                    <div class="card-lesson-title">কাঞ্জি লেসন ${l}</div>
                    <div class="card-lesson-desc">কাঞ্জি (${startId}–${endId})</div>
                `;
                container.appendChild(card);
            }
        }

        const svgCache = {};
        function cleanSvg(svgStr) {
            if (!svgStr) return "";
            const start = svgStr.indexOf("<svg");
            const end = svgStr.indexOf("</svg>");
            if (start !== -1 && end !== -1) return svgStr.substring(start, end + 6);
            return svgStr;
        }

        async function fetchKanjiSvg(hexCode) {
            if (svgCache[hexCode]) return svgCache[hexCode];
            try {
                const url = `https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hexCode}.svg`;
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const text = await res.text();
                const cleaned = cleanSvg(text);
                svgCache[hexCode] = cleaned;
                return cleaned;
            } catch (e) { return null; }
        }

        async function renderStaticSvg(holderId, hexCode) {
            const holder = document.getElementById(holderId);
            if (!holder) return;
            const svgText = await fetchKanjiSvg(hexCode);
            if (svgText) {
                holder.innerHTML = svgText;
                const svg = holder.querySelector('svg');
                if (!svg) return;
                svg.setAttribute("viewBox", "0 0 109 109");
                svg.style.width = "100%";
                svg.style.height = "100%";
                svg.querySelectorAll("text").forEach(t => t.style.display = "none");
                svg.querySelectorAll("path").forEach(p => {
                    p.style.stroke = "#0f172a";
                    p.style.strokeWidth = "4.2";
                    p.style.strokeLinecap = "round";
                    p.style.strokeLinejoin = "round";
                    p.style.fill = "none";
                });
            }
        }

        let currentActiveLesson = 1;

        function openLesson(lessonNo) {
            currentActiveLesson = lessonNo;
            const items = kanjiData[lessonNo] || kanjiData[1];
            document.getElementById("lessonGridView").style.display = "none";
            document.getElementById("kanjiDetailView").style.display = "block";
            document.getElementById("lessonHeaderTitle").innerText = `কাঞ্জি লেসন ${lessonNo} (${items[0].id}–${items[items.length - 1].id})`;

            const container = document.getElementById("kanjiListContainer");
            container.innerHTML = "";

            items.forEach((k, index) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "kanji-item";
                itemDiv.id = `kanjiItem_${index}`;

                let vocabHtml = k.vocab.map(v => `
                    <li class="vocab-item">
                        <span style="font-weight:700; color:#0f172a;">${v.w}</span> — ${v.m}
                    </li>
                `).join('');

                itemDiv.innerHTML = `
                    <div class="kanji-header" onclick="toggleKanji(${index})">
                        <span>Kanji ${k.id}: ${k.char}</span>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </div>
                    <div class="kanji-body">
                        <div class="kanji-anim-stage">
                            <div class="kanji-svg-wrap" id="svgHolder_${index}"></div>
                        </div>

                        <div class="action-btns">
                            <button class="action-btn play" onclick="playKanjiStroke('${k.char}', '${k.code}', ${index})">
                                <i class="fa-solid fa-play"></i> Play Stroke
                            </button>
                            <button class="action-btn card" onclick="openSingleDeckCard(${index})">
                                <i class="fa-regular fa-clone"></i> Flash Card
                            </button>
                        </div>

                        <div class="readings-box">
                            <div><strong>Kunyomi:</strong> <span class="jp-font">${k.kun}</span></div>
                            <div><strong>Onyomi:</strong> <span class="jp-font">${k.on}</span></div>
                            <div><strong>Meaning:</strong> ${k.meaning}</div>
                        </div>

                        <div class="detail-sub-title"><i class="fa-solid fa-puzzle-piece" style="color:var(--jade);"></i> Vocabulary (যৌগিক শব্দ)</div>
                        <ul class="vocab-list">${vocabHtml}</ul>
                    </div>
                `;
                container.appendChild(itemDiv);
                renderStaticSvg(`svgHolder_${index}`, k.code);
            });

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function toggleKanji(index) {
            const currentItem = document.getElementById(`kanjiItem_${index}`);
            const isAlreadyOpen = currentItem.classList.contains("open");
            document.querySelectorAll(".kanji-item").forEach(item => item.classList.remove("open"));
            if (!isAlreadyOpen) currentItem.classList.add("open");
        }

        function handleBack() {
            if (document.getElementById("kanjiDetailView").style.display === "block") {
                document.getElementById("kanjiDetailView").style.display = "none";
                document.getElementById("lessonGridView").style.display = "block";
                window.scrollTo({ top: 0, behavior: "smooth" });
            } else {
                window.location.href = "index.html";
            }
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ja-JP';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        async function playKanjiStroke(char, hexCode, index) {
            const holder = document.getElementById(`svgHolder_${index}`);
            speakWord(char);

            const svgText = await fetchKanjiSvg(hexCode);
            if (!svgText) return;

            holder.innerHTML = svgText;
            const svgEl = holder.querySelector('svg');
            if (!svgEl) return;
            svgEl.setAttribute("viewBox", "0 0 109 109");
            svgEl.style.width = "100%";
            svgEl.style.height = "100%";
            svgEl.querySelectorAll("text").forEach(t => t.style.display = "none");

            const paths = svgEl.querySelectorAll("path");
            let delay = 0;
            paths.forEach((path) => {
                const len = path.getTotalLength();
                path.style.stroke = "#147A57";
                path.style.strokeWidth = "4.5";
                path.style.strokeLinecap = "round";
                path.style.strokeLinejoin = "round";
                path.style.fill = "none";
                path.style.strokeDasharray = len;
                path.style.strokeDashoffset = len;
                path.style.transition = "none";

                setTimeout(() => {
                    path.style.transition = "stroke-dashoffset 0.55s cubic-bezier(0.4, 0, 0.2, 1)";
                    path.style.strokeDashoffset = "0";
                }, delay);
                delay += 550;
            });
        }

        /* -------------------------------------------------------------
           ভিডিওর স্ট্যাকড ফ্ল্যাশকার্ড ও আঙুল দিয়ে ড্র্যাগ/সোয়াইপ ইঞ্জিন
        ------------------------------------------------------------- */
        let deckList = [];
        let currentDeckIndex = 0;
        let isAnswerRevealed = false;

        const activeCard = document.getElementById("activeCard");
        const answerSheet = document.getElementById("answerSheet");
        const revealDot = document.getElementById("revealDot");

        function startDeck() {
            const list = kanjiData[currentActiveLesson] || kanjiData[1];
            deckList = [...list];
            currentDeckIndex = 0;
            document.getElementById("deckOverlay").style.display = "flex";
            renderDeckCard();
        }

        function openSingleDeckCard(index) {
            const list = kanjiData[currentActiveLesson] || kanjiData[1];
            deckList = [...list];
            currentDeckIndex = index;
            document.getElementById("deckOverlay").style.display = "flex";
            renderDeckCard();
        }

        function closeDeck() {
            document.getElementById("deckOverlay").style.display = "none";
            hideAnswerSheet();
        }

        function toggleCardReveal() {
            isAnswerRevealed = !isAnswerRevealed;
            if (isAnswerRevealed) {
                answerSheet.classList.add("revealed");
            } else {
                answerSheet.classList.remove("revealed");
            }
        }

        function hideAnswerSheet() {
            isAnswerRevealed = false;
            answerSheet.classList.remove("revealed");
        }

        revealDot.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleCardReveal();
        });

        answerSheet.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleCardReveal();
        });

        function renderDeckCard() {
            hideAnswerSheet();
            if (deckList.length === 0) return;

            const item = deckList[currentDeckIndex];
            const total = deckList.length;

            document.getElementById("deckCounter").innerText = `${currentDeckIndex + 1} / ${total}`;
            document.getElementById("cardTopKanji").innerText = item.char;
            document.getElementById("cardCenterKanji").innerText = item.char;

            // উত্তর প্যানেল আপডেট (যা ক্লিক ছাড়া দেখা যাবে না)
            document.getElementById("ansMeaningText").innerText = item.meaning;
            document.getElementById("ansReadingsText").innerHTML = `
                Kunyomi: <strong>${item.kun}</strong> &nbsp;•&nbsp; 
                Onyomi: <strong>${item.on}</strong>
            `;

            const vocabContainer = document.getElementById("ansVocabBox");
            vocabContainer.innerHTML = "";
            if (item.vocab && item.vocab.length > 0) {
                item.vocab.forEach(v => {
                    const row = document.createElement("div");
                    row.className = "ans-vocab-item";
                    row.innerHTML = `<strong>${v.w}</strong> — ${v.m}`;
                    vocabContainer.appendChild(row);
                });
            }

            // রিসেট কার্ড পজিশন
            activeCard.style.transition = "none";
            activeCard.style.transform = "translate(0px, 0px) rotate(0deg)";
            activeCard.style.opacity = "1";
        }

        function playCurrentDeckAudio() {
            if (deckList.length === 0) return;
            speakWord(deckList[currentDeckIndex].char);
        }

        /* -------------------------------------------------------------
           আঙুল দিয়ে টেনে কার্ড সরানোর ফুল টাচ ও ড্র্যাগ ইন্টারঅ্যাকশন
        ------------------------------------------------------------- */
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;
        let isDragging = false;

        function onTouchStart(e) {
            // অডিও বাটনে ক্লিক হলে ড্র্যাগ হবে না
            if (e.target.closest('.audio-speaker-btn')) return;
            const touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
            isDragging = true;
            activeCard.style.transition = "none";
        }

        function onTouchMove(e) {
            if (!isDragging) return;
            const touch = e.touches ? e.touches[0] : e;
            currentX = touch.clientX - startX;
            currentY = touch.clientY - startY;

            // ভিডিওর মতো রোটেটিং ড্র্যাগ অ্যানিমেশন
            const rotateDeg = currentX * 0.08;
            activeCard.style.transform = `translate(${currentX}px, ${currentY * 0.25}px) rotate(${rotateDeg}deg)`;
        }

        function onTouchEnd() {
            if (!isDragging) return;
            isDragging = false;

            const swipeThreshold = 80; // নির্দিষ্ট দূরত্বের বেশি টানলে কার্ড পরিবর্তন হবে
            if (currentX < -swipeThreshold) {
                // বাঁমে সোয়াইপ (পরের কার্ড)
                swipeOutCard(-1);
            } else if (currentX > swipeThreshold) {
                // ডানে সোয়াইপ (আগের কার্ড)
                swipeOutCard(1);
            } else {
                // বাউন্স ব্যাক আগের জায়গায়
                activeCard.style.transition = "transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)";
                activeCard.style.transform = "translate(0px, 0px) rotate(0deg)";
            }
            currentX = 0;
            currentY = 0;
        }

        function swipeOutCard(direction) {
            activeCard.style.transition = "transform 0.28s ease-in, opacity 0.28s ease-in";
            activeCard.style.transform = `translate(${direction * 400}px, 20px) rotate(${direction * 25}deg)`;
            activeCard.style.opacity = "0";

            setTimeout(() => {
                if (direction === -1) {
                    currentDeckIndex = (currentDeckIndex + 1) % deckList.length;
                } else {
                    currentDeckIndex = (currentDeckIndex - 1 + deckList.length) % deckList.length;
                }
                renderDeckCard();
            }, 250);
        }

        // মাউস ও টাচ ইভেন্ট লিসেনার
        activeCard.addEventListener("touchstart", onTouchStart, { passive: true });
        activeCard.addEventListener("touchmove", onTouchMove, { passive: true });
        activeCard.addEventListener("touchend", onTouchEnd);

        activeCard.addEventListener("mousedown", onTouchStart);
        window.addEventListener("mousemove", onTouchMove);
        window.addEventListener("mouseup", onTouchEnd);

        window.addEventListener("DOMContentLoaded", () => {
            renderLessonGrid();
        });
    </script>
</body>
</html>
