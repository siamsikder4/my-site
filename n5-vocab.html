<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N5 Vocabulary - KOTOBA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f7faf9;
            color: #1a202c;
            padding-bottom: 90px;
        }

        /* লোডার ওভারলে */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .book-loader {
            position: relative;
            width: 64px;
            height: 46px;
            perspective: 200px;
            margin-bottom: 18px;
        }

        .book-loader .cover-left {
            position: absolute;
            left: 2px; top: 2px;
            width: 30px; height: 42px;
            border: 2.2px solid #047857;
            border-right: none;
            border-radius: 4px 0 0 4px;
            background: #ffffff;
        }

        .book-loader .cover-right {
            position: absolute;
            right: 2px; top: 2px;
            width: 30px; height: 42px;
            border: 2.2px solid #047857;
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #ffffff;
        }

        .book-loader .spine {
            position: absolute;
            left: 31px; top: 0;
            width: 2px; height: 46px;
            background: #047857;
        }

        .book-loader .page {
            position: absolute;
            width: 29px; height: 42px;
            top: 2px; right: 3px;
            border: 2px solid #047857;
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #ffffff;
            transform-origin: left center;
            animation: flipBook 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .book-loader .page:nth-child(1) { animation-delay: 0.15s; }
        .book-loader .page:nth-child(2) { animation-delay: 0.35s; }
        .book-loader .page:nth-child(3) { animation-delay: 0.55s; }

        @keyframes flipBook {
            0% { transform: rotateY(0deg); }
            50%, 100% { transform: rotateY(-180deg); }
        }

        .loading-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: 0.8px;
        }

        /* টপ বার */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #eef2f5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 16px;
            color: #0f3e2e;
            text-decoration: none;
        }

        .user-pill {
            font-size: 11px;
            font-weight: 700;
            color: #047857;
            background: #e6f4ea;
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 800;
            color: #0f3e2e;
            margin-bottom: 4px;
        }

        .page-sub {
            font-size: 11.5px;
            color: #64748b;
            font-weight: 600;
        }

        /* ২ কলাম গ্রিড লেআউট */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .lesson-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #047857;
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
        }

        .lesson-box:active {
            transform: scale(0.97);
        }

        .box-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge-l {
            font-size: 9.5px;
            font-weight: 800;
            background: #f1f5f9;
            color: #475569;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .badge-jp {
            font-size: 9.5px;
            font-weight: 700;
            color: #64748b;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .lesson-name {
            font-size: 14px;
            font-weight: 800;
            color: #0f3e2e;
            margin-bottom: 3px;
        }

        .lesson-desc {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .box-bottom {
            display: flex;
            justify-content: flex-end;
            color: #047857;
            font-size: 12px;
        }

        /* শব্দ তালিকা দেখার মডাল ভিউ */
        .vocab-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f7faf9;
            z-index: 1000;
            flex-direction: column;
        }

        .modal-header {
            background: #ffffff;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eef2f5;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #0f3e2e;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            color: #475569;
            cursor: pointer;
        }

        .vocab-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
        }

        .vocab-item-row {
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            padding: 12px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vocab-item-row.bookmarked {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
        }

        .vocab-jp {
            font-size: 15px;
            font-weight: 700;
            color: #0f3e2e;
            font-family: 'Noto Sans JP', sans-serif;
            margin-bottom: 2px;

            font-size: 11px;
            color: #64748b;
        }

        .vocab-bn {
            font-size: 13.5px;
            font-weight: 600;
            color: #1e293b;
            text-align: right;
        }

        .bookmark-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 18px;
            cursor: pointer;
            padding-left: 12px;
        }

        .vocab-item-row.bookmarked .bookmark-btn {
            color: #ef4444;
        }

            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 62px;
            background: #ffffff;
            border-top: 1px solid #eef2f5;

            text-decoration: none;
            color: #8392a5;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

            color: #0f3e2e;
        }

        .nav-item i {
            font-size: 19px;

                const row = document.createElement("div");
                row.className = "vocab-item-row";
                row.innerHTML = `
                    <div>
                        <div class="vocab-jp">${item.jp}</div>
                        <div class="vocab-roma">${item.roma}</div>
                    </div>
                    <div style="display: flex; align-items: center;">

                        <button class="bookmark-btn" onclick="toggleBookmark(this, event)">
                            <i class="fa-solid fa-bookmark"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById("vocabModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("vocabModal").style.display = "none";
        }

        function toggleBookmark(btn, event) {
            event.stopPropagation();
            const row = btn.closest(".vocab-item-row");
            row.classList.toggle("bookmarked");
        }

        window.addEventListener("load", () => {
            const loader = document.getElementById("pageLoader");
            if (loader) loader.classList.add("hidden");
