<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কমিউনিটি ফিড - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 85px; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .nav-title { font-weight: 800; font-size: 17px; color: #0f3e2e; display: flex; align-items: center; gap: 8px; }
        .nav-right-cluster { display: flex; gap: 10px; align-items: center; }
        .top-icon-btn { background: #f1f5f9; color: #0f3e2e; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; position: relative; text-decoration: none; }
        .notif-dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: none; }
        .page-content { padding: 16px; max-width: 480px; margin: 0 auto; }
        .feed-tabs { display: flex; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 14px; gap: 4px; }
        .feed-tab { flex: 1; text-align: center; padding: 8px; font-size: 12.5px; font-weight: 700; color: #64748b; border-radius: 9px; cursor: pointer; background: transparent; border: none; }
        .feed-tab.active { background: #ffffff; color: #047857; }
        .post-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .post-input { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; font-size: 13.5px; outline: none; background: #f8fafc; resize: none; min-height: 75px; }
        .topic-input { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-top: 8px; outline: none; }
        .poll-creator-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 10px; margin-top: 10px; display: none; }
        .poll-input-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .poll-opt-input { flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; }
        .post-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .post-tools { display: flex; gap: 6px; align-items: center; }
        .tool-icon-btn { background: #f1f5f9; border: 1px solid #cbd5e1; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-post-submit { background: #047857; color: #ffffff; border: none; padding: 8px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .feed-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
        .feed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .feed-user-box { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .feed-avatar { width: 42px; height: 42px; border-radius: 50%; background: #e6f4ea; color: #047857; display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
        .feed-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .feed-user-info h4 { font-size: 14px; font-weight: 700; color: #0f3e2e; display: flex; align-items: center; gap: 6px; }
        .learner-badge { font-size: 9px; font-weight: 700; background: #e0f2fe; color: #0369a1; padding: 1px 6px; border-radius: 6px; }
        .topic-pill { display: inline-block; font-size: 10.5px; font-weight: 700; background: #fef3c7; color: #b45309; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; }
        .feed-body { font-size: 13.5px; color: #334155; line-height: 1.6; margin-bottom: 12px; word-break: break-word; }
        .poll-container { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .poll-option-btn { background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 9px 12px; text-align: left; font-size: 12.5px; font-weight: 600; cursor: pointer; position: relative; overflow: hidden; }
        .poll-option-btn.voted { border-color: #047857; background: #e6f4ea; color: #047857; }
        .feed-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 12px; }
        .action-cluster { display: flex; gap: 8px; }
        .action-icon-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 14px; border-radius: 20px; color: #64748b; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .action-icon-btn.liked { background: #fff1f2; border-color: #fecdd3; color: #e11d48; }
        .action-icon-btn.bookmarked { background: #f0fdf4; border-color: #bbf7d0; color: #047857; }
        .comments-section { margin-top: 12px; border-top: 1px dashed #e2e8f0; padding-top: 10px; display: none; }
        .comments-list { max-height: 200px; overflow-y: auto; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
        .comment-bubble { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .comment-input-row { display: flex; gap: 6px; }
        .comment-input { flex: 1; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 10px; font-size: 12px; outline: none; }
        .comment-send-btn { background: #047857; color: #fff; border: none; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; padding: 16px; }
        .modal-box { background: #ffffff; width: 100%; max-width: 400px; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { background: #0f3e2e; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 14px; overflow-y: auto; background: #f8fafc; flex: 1; }
        .close-modal-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: #ffffff; border-top: 1px solid #eef2f5; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { text-decoration: none; color: #8392a5; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; }
        .nav-item.active { color: #0f3e2e; }
        .nav-item i { font-size: 19px; }
    </style>
</head>
<body>
    <header class="top-nav">
        <span class="nav-title"><i class="fa-solid fa-earth-americas" style="color:#047857;"></i> স্টাডি কমিউনিটি</span>
        <div class="nav-right-cluster">
            <a href="chat.html" class="top-icon-btn" title="ইনবক্স"><i class="fa-regular fa-paper-plane"></i></a>
            <button class="top-icon-btn" id="openNotifModalBtn"><i class="fa-regular fa-bell"></i><span class="notif-dot" id="notifDot"></span></button>
        </div>
    </header>

    <div class="modal-overlay" id="notifModal">
        <div class="modal-box">
            <div class="modal-header"><span>নোটিফিকেশন</span><button class="close-modal-btn" onclick="document.getElementById('notifModal').style.display='none'">&times;</button></div>
            <div class="modal-body" id="notifModalList">কোনো নোটিফিকেশন নেই</div>
        </div>
    </div>

    <main class="page-content">
        <div class="feed-tabs">
            <button class="feed-tab active" id="tabRecent" onclick="switchTab('recent')">সর্বশেষ (Recent)</button>
            <button class="feed-tab" id="tabTrending" onclick="switchTab('trending')">জনপ্রিয় (Trending)</button>
        </div>

        <div class="post-box" id="createPostBox" style="display: none;">
            <textarea id="postTextInput" class="post-input" placeholder="আপনার স্টাডি আপডেট লিখুন..."></textarea>
            <input type="text" id="postTopicInput" class="topic-input" placeholder="হ্যাশট্যাগ (যেমন: #kanji)">
            <div class="poll-creator-box" id="pollCreatorBox">
                <div class="poll-input-row"><input type="text" class="poll-opt-input" id="pollOpt1" placeholder="অপশন ১"></div>
                <div class="poll-input-row"><input type="text" class="poll-opt-input" id="pollOpt2" placeholder="অপশন ২"></div>
            </div>
            <input type="file" id="postImageInput" accept="image/*" style="display: none;">
            <div class="post-footer-row">
                <div class="post-tools">
                    <button class="tool-icon-btn" id="triggerImgUpload"><i class="fa-regular fa-image"></i></button>
                    <button class="tool-icon-btn" id="togglePollBoxBtn"><i class="fa-solid fa-square-poll-vertical"></i></button>
                </div>
                <button class="btn-post-submit" id="submitPostBtn"><i class="fa-solid fa-paper-plane"></i> পোস্ট করুন</button>
            </div>
        </div>
        <div id="feedListContainer"></div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="feed.html" class="nav-item active"><i class="fa-solid fa-comments"></i><span>কমিউনিটি</span></a>
        <a href="chat.html" class="nav-item"><i class="fa-solid fa-paper-plane"></i><span>ইনবক্স</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>র‍্যাঙ্কিং</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs", authDomain: "kotoba-b20b3.firebaseapp.com", projectId: "kotoba-b20b3" }));
        const auth = getAuth(app);
        const ADMIN_EMAIL = "qr.siamsikder@gmail.com";
        let currentUser = null, cachedPosts = [], isPollBoxOpen = false;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById("createPostBox").style.display = user ? "block" : "none";
            loadFeedPosts();
        });

        document.getElementById("togglePollBoxBtn").onclick = () => {
            isPollBoxOpen = !isPollBoxOpen;
            document.getElementById("pollCreatorBox").style.display = isPollBoxOpen ? "block" : "none";
        };

        document.getElementById("triggerImgUpload").onclick = () => document.getElementById("postImageInput").click();

        document.getElementById("submitPostBtn").onclick = async () => {
            const text = document.getElementById("postTextInput").value.trim();
            if (!text && !isPollBoxOpen) return;
            await addDoc(collection(db, "posts"), {
                userId: currentUser.email.toLowerCase(),
                userName: currentUser.displayName || currentUser.email.split('@')[0],
                text: text, timestamp: Date.now(), likes: [], comments: []
            });
            document.getElementById("postTextInput").value = "";
        };

        function loadFeedPosts() {
            onSnapshot(query(collection(db, "posts"), orderBy("timestamp", "desc")), (snap) => {
                cachedPosts = [];
                snap.forEach(d => cachedPosts.push({ id: d.id, ...d.data() }));
                renderPosts();
            });
        }

        function renderPosts() {
            const container = document.getElementById("feedListContainer");
            container.innerHTML = cachedPosts.map(post => `
                <div class="feed-card">
                    <div class="feed-header">
                        <h4>${post.userName} <span class="learner-badge">Student</span></h4>
                    </div>
                    <div class="feed-body">${post.text}</div>
                    <div class="feed-footer">
                        <button class="action-icon-btn" onclick="toggleLike('${post.id}')"><i class="fa-solid fa-heart"></i> ${post.likes.length}</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
