<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - KOTOBA</title>
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 80px; }

        #authCheckingScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; gap: 12px;
        }
        .spinner {
            width: 38px; height: 38px; border: 3px solid #e2e8f0; border-top: 3px solid #047857; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-nav {
            display: flex; align-items: center; padding: 14px 18px; background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; gap: 14px;
        }
        .back-btn { color: #0f3e2e; background: #f1f5f9; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .nav-title { font-weight: 700; font-size: 17px; color: #0f3e2e; }

        .page-content { padding: 18px 16px; max-width: 600px; margin: 0 auto; }

        .admin-banner {
            background: linear-gradient(135deg, #0f3e2e 0%, #047857 100%); color: #ffffff; padding: 20px 16px; border-radius: 16px; margin-bottom: 18px; box-shadow: 0 4px 12px rgba(4, 120, 87, 0.15);
        }
        .admin-banner h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .admin-banner p { font-size: 12px; color: #a7f3d0; }

        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .stat-box i { font-size: 18px; color: #047857; margin-bottom: 6px; }
        .stat-num { font-size: 16px; font-weight: 800; color: #0f3e2e; }
        .stat-label { font-size: 10.5px; color: #64748b; }

        .section-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px 16px; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .section-card h3 { font-size: 15.5px; font-weight: 700; color: #0f3e2e; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }

        /* ফর্ম ইনপুট স্টাইল */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .input-control { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; outline: none; background: #f8fafc; }
        .input-control:focus { border-color: #047857; background: #ffffff; }
        textarea.input-control { resize: vertical; min-height: 80px; }

        .btn-submit {
            width: 100%; padding: 11px; background: #047857; color: #ffffff; border: none; border-radius: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
        }
        .btn-submit:active { background: #065f46; }

        /* নোটিফিকেশন টেবিল */
        .table-responsive { max-height: 350px; overflow-y: auto; border: 1px solid #f1f5f9; border-radius: 10px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
        .data-table th { background: #f1f5f9; color: #475569; font-weight: 700; padding: 10px 8px; position: sticky; top: 0; z-index: 10; }
        .data-table td { padding: 10px 8px; border-bottom: 1px solid #f1f5f9; color: #334155; vertical-align: middle; }
        .badge-target { background: #e0f2fe; color: #0369a1; padding: 3px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .badge-target.all { background: #dcfce7; color: #15803d; }
        
        .action-btns { display: flex; gap: 8px; }
        .act-btn { border: none; background: none; cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; }
        .edit-btn { color: #0284c7; background: #f0f9ff; }
        .del-btn { color: #dc2626; background: #fef2f2; }
    </style>
</head>
<body>

    <div id="authCheckingScreen">
        <div class="spinner"></div>
        <p style="font-size: 13px; font-weight: 600; color: #475569;">অ্যাডমিন এক্সেস যাচাই করা হচ্ছে...</p>
    </div>

    <header class="top-nav">
        <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <span class="nav-title">KOTOBA অ্যাডমিন ড্যাশবোর্ড</span>
    </header>

    <main class="page-content" id="adminContent" style="display: none;">

        <div class="admin-banner">
            <h2><i class="fa-solid fa-user-shield"></i> মাস্টার কন্ট্রোল</h2>
            <p id="adminStatusText">অ্যাডমিন আইডি: qr.siamsikder@gmail.com</p>
        </div>

        <div class="stat-grid">
            <div class="stat-box">
                <i class="fa-solid fa-users"></i>
                <div class="stat-num" id="totalUsersCount">০</div>
                <div class="stat-label">মোট ইউজার</div>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-bell"></i>
                <div class="stat-num" id="totalNotifsCount">০</div>
                <div class="stat-label">নোটিফিকেশন পাঠানো হয়েছে</div>
            </div>
        </div>

        <!-- নোটিফিকেশন সেন্ড ও এডিট ফর্ম -->
        <div class="section-card">
            <h3><span><i class="fa-solid fa-paper-plane" style="color: #d97706; margin-right: 6px;"></i> নোটিফিকেশন পাঠান</span></h3>
            
            <input type="hidden" id="editNotifId" value="">

            <div class="input-group">
                <label>কাকে পাঠাতে চান?</label>
                <select id="notifTargetType" class="input-control">
                    <option value="all">সবাইকে (All Users)</option>
                    <option value="specific">নির্দিষ্ট একজনকে (Specific User)</option>
                </select>
            </div>

            <div class="input-group" id="emailInputGroup" style="display: none;">
                <label>ইউজারের ইমেইল দিন:</label>
                <input type="email" id="notifSpecificEmail" class="input-control" placeholder="user@gmail.com">
            </div>

            <div class="input-group">
                <label>নোটিফিকেশন টাইটেল:</label>
                <input type="text" id="notifTitle" class="input-control" placeholder="যেমন: নতুন আপডেট!">
            </div>

            <div class="input-group">
                <label>বিস্তারিত বার্তা:</label>
                <textarea id="notifMsg" class="input-control" placeholder="বার্তার বিস্তারিত লিখুন..."></textarea>
            </div>

            <button class="btn-submit" id="saveNotifBtn">
                <i class="fa-solid fa-bell"></i> নোটিফিকেশন পাঠান
            </button>
        </div>

        <!-- নোটিফিকেশন লিস্ট ও কন্ট্রোল -->
        <div class="section-card">
            <h3>
                <span><i class="fa-solid fa-list-check" style="color: #047857; margin-right: 6px;"></i> পাঠানো নোটিফিকেশন সমূহ</span>
                <button id="refreshBtn" style="background:none; border:none; color:#047857; font-size:13px; cursor:pointer;"><i class="fa-solid fa-rotate-right"></i> রিফ্রেশ</button>
            </h3>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>টাইটেল ও বার্তা</th>
                            <th style="text-align: center;">টার্গেট</th>
                            <th style="text-align: right;">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="notifTableBody">
                        <tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 20px;">লোড হচ্ছে...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs",
            authDomain: "kotoba-b20b3.firebaseapp.com",
            projectId: "kotoba-b20b3",
            storageBucket: "kotoba-b20b3.firebasestorage.app",
            messagingSenderId: "556955805953",
            appId: "1:556955805953:web:cef5927677815bf5e05300"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "qr.siamsikder@gmail.com";

        let allNotifications = [];

        onAuthStateChanged(auth, async (user) => {
            if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById("authCheckingScreen").style.display = "none";
                document.getElementById("adminContent").style.display = "block";
                
                await fetchUserCount();
                await fetchNotifications();
            } else {
                alert("অনুমতি নেই! এই পেজে শুধুমাত্র অ্যাডমিন প্রবেশ করতে পারবেন।");
                window.location.href = "profile.html";
            }
        });

        // টার্গেট টাইপ পরিবর্তন
        document.getElementById("notifTargetType").addEventListener("change", (e) => {
            const emailGroup = document.getElementById("emailInputGroup");
            if (e.target.value === "specific") {
                emailGroup.style.display = "block";
            } else {
                emailGroup.style.display = "none";
                document.getElementById("notifSpecificEmail").value = "";
            }
        });

        // ইউজারের সংখ্যা আনা
        async function fetchUserCount() {
            try {
                const snap = await getDocs(collection(db, "user_highlights"));
                document.getElementById("totalUsersCount").innerText = snap.size;
            } catch(e) { console.error(e); }
        }

        // নোটিফিকেশন লোড করা
        async function fetchNotifications() {
            const tbody = document.getElementById("notifTableBody");
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 20px;">লোড হচ্ছে...</td></tr>`;
            try {
                // time অনুযায়ী সাজানো
                const q = query(collection(db, "notifications"));
                const querySnapshot = await getDocs(q);
                
                allNotifications = [];
                querySnapshot.forEach((doc) => {
                    allNotifications.push({ id: doc.id, ...doc.data() });
                });

                // নতুন গুলা উপরে
                allNotifications.sort((a,b) => b.timestamp - a.timestamp);

                document.getElementById("totalNotifsCount").innerText = allNotifications.length;
                renderNotifsTable();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ef4444; padding: 20px;">ত্রুটি হয়েছে!</td></tr>`;
                console.error(err);
            }
        }

        // নোটিফিকেশন টেবিল রেন্ডার
        function renderNotifsTable() {
            const tbody = document.getElementById("notifTableBody");
            tbody.innerHTML = "";
            if (allNotifications.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 18px;">কোনো নোটিফিকেশন নেই।</td></tr>`;
                return;
            }

            allNotifications.forEach(n => {
                const tr = document.createElement("tr");
                const targetText = n.target === "all" ? `<span class="badge-target all">All Users</span>` : `<span class="badge-target">${n.target}</span>`;
                
                tr.innerHTML = `
                    <td>
                        <div style="font-weight: 700; color: #0f3e2e; margin-bottom: 3px;">${n.title}</div>
                        <div style="font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">${n.message}</div>
                    </td>
                    <td style="text-align: center;">${targetText}</td>
                    <td style="text-align: right;">
                        <div class="action-btns" style="justify-content: flex-end;">
                            <button class="act-btn edit-btn" onclick="editNotif('${n.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="act-btn del-btn" onclick="deleteNotif('${n.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById("refreshBtn").addEventListener("click", fetchNotifications);

        // সেভ/সেন্ড বাটন লজিক
        document.getElementById("saveNotifBtn").addEventListener("click", async () => {
            const title = document.getElementById("notifTitle").value.trim();
            const msg = document.getElementById("notifMsg").value.trim();
            const type = document.getElementById("notifTargetType").value;
            const specificEmail = document.getElementById("notifSpecificEmail").value.trim();
            const editId = document.getElementById("editNotifId").value;
            const btn = document.getElementById("saveNotifBtn");

            if (!title || !msg) return alert("টাইটেল এবং বিস্তারিত বার্তা আবশ্যক!");
            if (type === "specific" && !specificEmail) return alert("নির্দিষ্ট ইউজারের ইমেইল দিন!");

            const targetVal = type === "all" ? "all" : specificEmail;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> প্রসেসিং...`;

            try {
                if (editId) {
                    // Update Mode
                    const docRef = doc(db, "notifications", editId);
                    await updateDoc(docRef, {
                        title: title,
                        message: msg,
                        target: targetVal
                    });
                    alert("নোটিফিকেশন সফলভাবে এডিট হয়েছে!");
                } else {
                    // Add Mode
                    await addDoc(collection(db, "notifications"), {
                        title: title,
                        message: msg,
                        target: targetVal,
                        timestamp: Date.now()
                    });
                    alert("নোটিফিকেশন সফলভাবে পাঠানো হয়েছে!");
                }

                // Reset Form
                document.getElementById("notifTitle").value = "";
                document.getElementById("notifMsg").value = "";
                document.getElementById("editNotifId").value = "";
                document.getElementById("notifTargetType").value = "all";
                document.getElementById("emailInputGroup").style.display = "none";
                document.getElementById("notifSpecificEmail").value = "";
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> নোটিফিকেশন পাঠান`;

                fetchNotifications();
            } catch(e) {
                alert("সমস্যা হয়েছে! কনসোল চেক করুন।");
                console.error(e);
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> নোটিফিকেশন পাঠান`;
                btn.disabled = false;
            }
        });

        // গ্লোবাল ফাংশন এডিট ও ডিলিটের জন্য
        window.editNotif = function(id) {
            const notif = allNotifications.find(n => n.id === id);
            if(notif) {
                document.getElementById("editNotifId").value = notif.id;
                document.getElementById("notifTitle").value = notif.title;
                document.getElementById("notifMsg").value = notif.message;
                
                if (notif.target === "all") {
                    document.getElementById("notifTargetType").value = "all";
                    document.getElementById("emailInputGroup").style.display = "none";
                } else {
                    document.getElementById("notifTargetType").value = "specific";
                    document.getElementById("emailInputGroup").style.display = "block";
                    document.getElementById("notifSpecificEmail").value = notif.target;
                }
                
                const btn = document.getElementById("saveNotifBtn");
                btn.innerHTML = `<i class="fa-solid fa-pen-to-square"></i> আপডেট করুন`;
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        window.deleteNotif = async function(id) {
            if(confirm("আপনি কি নিশ্চিত এই নোটিফিকেশনটি মুছে ফেলতে চান?")) {
                try {
                    await deleteDoc(doc(db, "notifications", id));
                    fetchNotifications();
                } catch(e) {
                    alert("ডিলিট করতে সমস্যা হয়েছে।");
                    console.error(e);
                }
            }
        }
    </script>
</body>
</html>
