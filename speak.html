<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOTOBA - Speak Practice</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-canvas: #F4F6F9;
            --surface-card: #FFFFFF;
            --text-dark: #1E252D;
            --text-muted: #8E9AAB;
            --teal-primary: #00A896;
            --teal-soft: #E3F8F2;
            --bubble-cyan: #E0F7F4;
            --border-soft: #EEF1F6;
            --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --shadow-float: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --radius-lg: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen-container {
            max-width: 440px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 20px 24px;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.03);
        }

        /* Top Progress Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding-top: 4px;
        }

        .close-btn {
            background: #F8FAFC;
            border: 1px solid var(--border-soft);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.15s ease;
        }
        .close-btn:active { transform: scale(0.92); }

        .progress-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .streak-info {
            font-size: 11px;
            font-weight: 800;
            color: var(--teal-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background-color: #EEF2F6;
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 33%;
            height: 100%;
            background: linear-gradient(90deg, #2DD4BF, var(--teal-primary));
            border-radius: 99px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .xp-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 800;
            color: var(--text-dark);
            background: #FFFBEB;
            border: 1px solid #FEF3C7;
            padding: 5px 11px;
            border-radius: 20px;
        }
        .xp-pill i { color: #F59E0B; }

        /* Scenario Section */
        .scenario-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 14px;
        }

        .scenario-tag-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .scene-badge {
            background: var(--teal-soft);
            color: var(--teal-primary);
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 8px;
        }

        .furigana-toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .furigana-toggle-btn.active { color: var(--teal-primary); }

        .scenario-image-card {
            width: 100%;
            height: 175px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 16px;
            position: relative;
        }

        .scenario-image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Speech Bubble */
        .speech-bubble {
            width: 100%;
            background-color: var(--bubble-cyan);
            border: 1.5px solid #CCF2EC;
            border-radius: 20px;
            padding: 14px 16px;
            position: relative;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            top: -9px;
            left: 36px;
            border-width: 0 9px 9px 9px;
            border-style: solid;
            border-color: transparent transparent #CCF2EC transparent;
        }

        .bubble-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .audio-btn-circle {
            background: #ffffff;
            border: 1px solid #BCEAE1;
            color: var(--teal-primary);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .audio-btn-circle:active { transform: scale(0.92); }

        .turtle-btn {
            font-size: 11px;
            background: #ffffff;
            border: 1px solid #BCEAE1;
            color: #0E7490;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .bubble-content {
            flex: 1;
        }

        .bubble-furigana {
            font-size: 10.5px;
            color: #0E7490;
            font-weight: 700;
            margin-bottom: 2px;
            display: none;
        }

        .bubble-content h3 {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            color: #083344;
            line-height: 1.45;
            margin-bottom: 4px;
        }

        .bubble-content p {
            font-size: 11.5px;
            color: #155E75;
            line-height: 1.35;
            font-weight: 500;
        }

        /* Bottom Response Area */
        .bottom-action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        .target-response-box {
            width: 100%;
            background: #FFFFFF;
            border: 2px solid var(--teal-primary);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 168, 150, 0.08);
            position: relative;
        }

        .target-romaji {
            font-size: 11px;
            color: var(--teal-primary);
            font-weight: 700;
            margin-bottom: 3px;
            display: none;
        }

        .target-japanese {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .target-translation {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .hint-instruction {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Controls: Speaker, Voice Mic, Shuffle */
        .controls-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px 0;
        }

        .round-action-btn {
            background: #F4F6F9;
            border: 1px solid var(--border-soft);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .round-action-btn:active {
            background: #E2E8F0;
            transform: scale(0.92);
        }

        .voice-submit-btn {
            background: linear-gradient(135deg, var(--teal-primary) 0%, #009383 100%);
            color: #ffffff;
            border: none;
            border-radius: 99px;
            padding: 14px 42px;
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 168, 150, 0.35);
            transition: all 0.2s ease;
        }
        .voice-submit-btn:active {
            transform: scale(0.95);
        }

        .voice-submit-btn.listening {
            background: #EF4444;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
            animation: pulseRecord 1.1s infinite;
        }

        @keyframes pulseRecord {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Result Feedback Alert */
        .feedback-banner {
            display: none;
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
            text-align: center;
            animation: popFeedback 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popFeedback {
            from { transform: translateY(6px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .feedback-banner.success {
            display: block;
            background: #DCFCE7;
            color: #15803D;
            border: 1px solid #BBF7D0;
        }

        .feedback-banner.try-again {
            display: block;
            background: #FEE2E2;
            color: #B91C1C;
            border: 1px solid #FECACA;
        }
    </style>
</head>

    <!-- Firebase Script (XP পয়েন্ট সরাসরি যোগ করার জন্য) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs",
            authDomain: "kotoba-b20b3.firebaseapp.com",
            projectId: "kotoba-b20b3",
            storageBucket: "kotoba-b20b3.firebasestorage.app",
            messagingSenderId: "556955805953",
            appId: "1:556955805953:web:cef5927677815bf5e05300",
            measurementId: "G-MXH61ERTC2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const displayXp = document.getElementById("displayXp");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const docId = user.email ? user.email.toLowerCase().trim() : user.uid;
                try {
                    const snap = await getDoc(doc(db, "users", docId));
                    if (snap.exists() && typeof snap.data().xp === "number") {
                        displayXp.innerText = snap.data().xp;
                    }
                } catch(e) {
                    console.warn(e);
                }
            }
        });

        // বৈশ্বিক addXP ফাংশন
        window.rewardSpeakingXP = async function(points) {
            if (!currentUser) return;
            const docId = currentUser.email ? currentUser.email.toLowerCase().trim() : currentUser.uid;
            try {
                await updateDoc(doc(db, "users", docId), {
                    xp: increment(points),
                    lastActive: Date.now()
                });
                const current = parseInt(displayXp.innerText) || 0;
                displayXp.innerText = current + points;
            } catch(e) {
                console.warn("XP Reward Error:", e);
            }
        };
    </script>

    <!-- App Logic Script -->
    <script>
        const scenarios = [
            {
                tag: "বেকারি ও শপ",
                image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=600&auto=format&fit=crop",

            },

                promptJp: "すみません、東京駅はどこですか？",
                promptFuri: "Sumimasen, Toukyou-eki wa doko desu ka?",
                promptBn: "মাফ করবেন, টোকিও স্টেশন কোন দিকে?",
                targetJp: "あそこです。",

            },
            {

                image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=600&auto=format&fit=crop",
                promptJp: "今日は楽しかったです。また明日！",

                promptBn: "আজকের দিনটি চমৎকার ছিল। কাল দেখা হবে!",
                targetJp: "また明日、お疲れ様でした。",

        let currentIndex = 0;

        const sceneBadge = document.getElementById("sceneBadge");
        const scenarioImg = document.getElementById("scenarioImg");
        const promptJpEl = document.getElementById("promptJapanese");
        const promptFuriEl = document.getElementById("promptFurigana");
        const promptBnEl = document.getElementById("promptTranslation");
        const targetJpEl = document.getElementById("targetJapanese");
        const targetRomajiEl = document.getElementById("targetRomaji");
        const targetBnEl = document.getElementById("targetTranslation");
        const feedbackEl = document.getElementById("feedbackBanner");
        const voiceBtn = document.getElementById("voiceBtn");
        const voiceBtnText = document.getElementById("voiceBtnText");
        const progressFill = document.getElementById("progressFill");

        const toggleFuriganaBtn = document.getElementById("toggleFuriganaBtn");

        // Web Audio API সাউন্ড ইফেক্টস
        let audioCtx = null;
        function playTone(freq, type, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playSuccessChime() {
            setTimeout(() => playTone(523.25, 'triangle', 0.15), 0);
            setTimeout(() => playTone(659.25, 'triangle', 0.15), 100);
            setTimeout(() => playTone(783.99, 'triangle', 0.25), 200);
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 }
            });
        }

        function playErrorBuzz() {
            playTone(220, 'sawtooth', 0.25);
        }

        // জাপানিজ স্পিচ
        function speakJapanese(text, rate = 0.9) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("আপনার ব্রাউজারে স্পিচ সাপোর্ট নেই।");
            }
        }

        document.getElementById("playPromptAudio").onclick = () => {
            speakJapanese(scenarios[currentIndex].promptJp, 0.95);
        };

        document.getElementById("playPromptSlowAudio").onclick = () => {
            speakJapanese(scenarios[currentIndex].promptJp, 0.65);
        };

        document.getElementById("playTargetAudio").onclick = () => {
            speakJapanese(scenarios[currentIndex].targetJp, 0.85);
        };

        // রোমাজি টগল
        toggleFuriganaBtn.onclick = () => {
            showRomaji = !showRomaji;
            promptFuriEl.style.display = showRomaji ? "block" : "none";
            targetRomajiEl.style.display = showRomaji ? "block" : "none";
            toggleFuriganaBtn.classList.toggle("active", showRomaji);
        };

        // পরবর্তী পরিস্থিতি
        document.getElementById("shuffleBtn").onclick = () => {
            currentIndex = (currentIndex + 1) % scenarios.length;
            loadScenario(currentIndex);
        };

        function loadScenario(index) {
            const sc = scenarios[index];
            sceneBadge.innerText = sc.tag;
            scenarioImg.src = sc.image;
            promptJpEl.innerText = sc.promptJp;
            promptFuriEl.innerText = sc.promptFuri;
            promptBnEl.innerText = sc.promptBn;
            targetJpEl.innerText = sc.targetJp;
            targetRomajiEl.innerText = sc.targetRomaji;
            targetBnEl.innerText = sc.targetBn;

            feedbackEl.className = "feedback-banner";
            feedbackEl.style.display = "none";

            // প্রগ্রেস বার ও কম্বো স্টেট
            const progressPercent = ((index + 1) / scenarios.length) * 100;
            progressFill.style.width = `${progressPercent}%`;
            stepRatio.innerText = `${index + 1} / ${scenarios.length}`;
            comboCount.innerText = comboStreak;
        }

        // ভয়েস রিকগনিশন (Speech to Text)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add("listening");
                voiceBtnText.innerText = "Listening...";
                feedbackEl.style.display = "none";
                playTone(440, 'sine', 0.1);
            };

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                checkAnswer(spokenText);
            };

            recognition.onerror = () => {
                resetVoiceBtn();
                playErrorBuzz();
                feedbackEl.className = "feedback-banner try-again";
                feedbackEl.innerText = "কথা পরিষ্কার শোনা যায়নি, পুনরায় বলুন!";
                feedbackEl.style.display = "block";
            };

            recognition.onend = () => {
                resetVoiceBtn();
            };
        }

        voiceBtn.onclick = () => {
            if (!recognition) {
                alert("আপনার ব্রাউজার জাপানিজ ভয়েস রিকগনিশন সাপোর্ট করে না (Google Chrome ব্যবহার করুন)।");
                return;
            }

            if (!isListening) {
                recognition.start();
            } else {
                recognition.stop();
            }
        };

        function resetVoiceBtn() {
            isListening = false;
            voiceBtn.classList.remove("listening");
            voiceBtnText.innerText = "Voice";
        }

        function checkAnswer(spoken) {
            const targetClean = scenarios[currentIndex].targetJp.replace(/[。、！？\s]/g, "");
            const spokenClean = spoken.replace(/[。、！？\s]/g, "");

            if (spokenClean.includes(targetClean) || targetClean.includes(spokenClean)) {
                comboStreak++;
                comboCount.innerText = comboStreak;
                playSuccessChime();

                feedbackEl.className = "feedback-banner success";
                feedbackEl.innerText = "অসাধারণ! সঠিক উচ্চারণ হয়েছে (+১৫ XP) 🎉";
                feedbackEl.style.display = "block";

                // Firebase-এ XP যোগ করা
                if (window.rewardSpeakingXP) {
                    window.rewardSpeakingXP(15);
                }

                // ১.৫ সেকেন্ড পর স্বয়ংক্রিয়ভাবে পরবর্তী সেশনে যাওয়া
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % scenarios.length;
                    loadScenario(currentIndex);
                }, 1600);
            } else {
                comboStreak = 1;
                comboCount.innerText = comboStreak;
                playErrorBuzz();

                feedbackEl.className = "feedback-banner try-again";
                feedbackEl.innerText = `আপনি বলেছেন: "${spoken}"। আবার চেষ্টা করুন!`;
                feedbackEl.style.display = "block";
            }
        }

        // ইনিশিয়াল লোড
        loadScenario(currentIndex);
    </script>
</body>
</html>
