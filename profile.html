<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            padding-bottom: 85px;
        }

        .top-nav {
            display: flex; align-items: center; padding: 14px 18px;
            background: #ffffff; border-bottom: 1px solid #f1f5f9;
            position: sticky; top: 0; z-index: 100; gap: 14px;
        }

        .back-btn {
            color: #334155; font-size: 15px; text-decoration: none;
            background: #f8fafc; border: 1px solid #e2e8f0;
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }

        .nav-title { font-weight: 700; font-size: 16.5px; color: #0f3e2e; }
        .page-content { padding: 16px; max-width: 460px; margin: 0 auto; }

        .profile-card {
            background: #ffffff; border-radius: 20px; padding: 24px 16px 20px;
            text-align: center; border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03); margin-bottom: 18px;
        }

        .avatar-wrap {
            position: relative; width: 84px; height: 84px; margin: 0 auto 12px; cursor: pointer;
        }

        .avatar-circle {
            width: 100%; height: 100%; border-radius: 50%;
            background: #e6f4ea; color: #047857; border: 2.5px solid #a7f3d0;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 700; text-transform: uppercase;
            overflow: hidden; box-shadow: 0 4px 12px rgba(4, 120, 87, 0.12);
        }

        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

        .camera-badge {
            position: absolute; bottom: 0; right: 0;
            width: 28px; height: 28px; background: #047857; color: #ffffff;
            border: 2px solid #ffffff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
        }

        .user-name { font-size: 17.5px; font-weight: 700; color: #0f2e23; margin-bottom: 2px; }
        .user-email { font-size: 12px; color: #64748b; margin-bottom: 18px; font-weight: 500; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            padding-top: 14px; border-top: 1px solid #f1f5f9;
        }

        .stat-item {
            background: #f8fafc; border: 1px solid #eef2f6; border-radius: 12px; padding: 10px 8px;
        }

        .stat-val { font-size: 15px; font-weight: 700; color: #047857; margin-bottom: 1px; }
        .stat-lbl { font-size: 11px; color: #64748b; font-weight: 600; }

        .menu-list {
            background: #ffffff; border-radius: 18px; border: 1px solid #e2e8f0;
            overflow: hidden; margin-bottom: 16px;
        }

        .menu-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; text-decoration: none; color: #334155;
            font-size: 13.5px; font-weight: 600; border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
        }

        .menu-item:last-child { border-bottom: none; }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-left i { font-size: 15px; color: #047857; width: 20px; text-align: center; }

        .logout-btn {
            width: 100%; background: #ffffff; border: 1px solid #fecdd3;
            color: #e11d48; padding: 12px; border-radius: 14px;
            font-size: 13.5px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* প্রিমিয়াম ক্রপার মডাল UI */
        .cropper-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(6px);
            z-index: 10000; justify-content: center; align-items: center; padding: 14px;
        }

        .cropper-box-card {
            background: #ffffff; width: 100%; max-width: 380px; border-radius: 22px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: modalFade 0.2s ease-out;
        }

        @keyframes modalFade {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .cropper-header {
            padding: 14px 18px; background: #0f3e2e; color: #ffffff;
            display: flex; justify-content: space-between; align-items: center;
        }
        .cropper-header h4 { font-size: 15px; font-weight: 700; }
        .btn-crop-close { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }

        .crop-container {
            width: 100%; height: 280px; background: #0f172a; position: relative;
        }
        .crop-container img { max-width: 100%; }

        /* ক্রপারে সার্কুলার গাইড ভিউ */
        .cropper-view-box, .cropper-face {
            border-radius: 50% !important;
        }
        .cropper-view-box {
            outline: 2px solid #10b981 !important;
            outline-color: rgba(16, 185, 129, 0.8) !important;
        }

        .crop-toolbar {
            background: #f8fafc; padding: 10px 14px; border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: center; gap: 14px;
        }
        .tool-btn {
            background: #ffffff; border: 1px solid #cbd5e1; width: 34px; height: 34px;
            border-radius: 8px; color: #334155; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:active { background: #f1f5f9; transform: scale(0.95); }

        .cropper-actions {
            padding: 12px 18px; display: flex; justify-content: space-between;
            align-items: center; background: #ffffff;
        }

        .btn-crop-cancel {
            background: #f1f5f9; border: none; padding: 9px 18px; border-radius: 10px;
            font-size: 13px; font-weight: 600; cursor: pointer; color: #475569;
        }

        .btn-crop-save {
            background: #047857; border: none; padding: 9px 24px; border-radius: 10px;
            font-size: 13px; font-weight: 700; cursor: pointer; color: #ffffff;
            display: flex; align-items: center; gap: 6px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 62px;
            background: #ffffff; border-top: 1px solid #eef2f5;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }

        .nav-item {
            text-decoration: none; color: #8392a5; font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600;
        }
        .nav-item.active { color: #0f3e2e; }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <header class="top-nav">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <span class="nav-title">আমার প্রোফাইল</span>
    </header>

    <main class="page-content">
        <input type="file" id="imageInput" accept="image/*" style="display: none;">

        <div class="profile-card">
            <div class="avatar-wrap" id="avatarTrigger" title="ছবি পরিবর্তন করুন">
                <div class="avatar-circle" id="avatarContainer">
                    <span id="avatarInitial"><i class="fa-regular fa-user" style="font-size: 24px;"></i></span>
                </div>
                <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
            </div>
            <h2 class="user-name" id="displayUserName">লোড হচ্ছে...</h2>
            <p class="user-email" id="displayUserEmail">---</p>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-val" id="hlWordCount">০</div>
                    <div class="stat-lbl">সংরক্ষিত শব্দার্থ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">JLPT N5</div>
                    <div class="stat-lbl">বর্তমান লেভেল</div>
                </div>
            </div>
        </div>

        <div class="menu-list">
            <a href="admin.html" class="menu-item" id="adminOption" style="display: none; background: #f0fdf4;">
                <div class="menu-left">
                    <i class="fa-solid fa-shield-halved" style="color: #047857;"></i>
                    <span style="color: #065f46; font-weight: 700;">অ্যাডমিন কন্ট্রোল প্যানেল</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #10b981; font-size: 11px;"></i>
            </a>
            <a href="leaderboard.html" class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-trophy" style="color: #d97706;"></i>
                    <span>র‍্যাঙ্কিং ও লিডারবোর্ড</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 11px;"></i>
            </a>
            <a href="n5-vocab.html" class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span>বুকমার্ক করা ভোকাবুলারি</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 11px;"></i>
            </a>
            <a href="ai-sensei.html" class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-robot"></i>
                    <span>AI সেনসেই চ্যাটবক্স</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 11px;"></i>
            </a>
        </div>

        <button class="logout-btn" id="logoutBtn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> লগআউট করুন
        </button>
    </main>

    <!-- রাউন্ডেড গাইড ক্রপার মডাল -->
    <div class="cropper-modal-overlay" id="cropperModal">
        <div class="cropper-box-card">
            <div class="cropper-header">
                <h4>ছবি অ্যাডজাস্ট করুন</h4>
                <button class="btn-crop-close" id="btnCancelCrop">&times;</button>
            </div>
            <div class="crop-container">
                <img id="imageToCrop" src="" alt="Crop Area">
            </div>
            
            <!-- কন্ট্রোল টুলবার -->
            <div class="crop-toolbar">
                <button class="tool-btn" id="btnZoomIn" title="জুম ইন"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button class="tool-btn" id="btnZoomOut" title="জুম আউট"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <button class="tool-btn" id="btnRotateLeft" title="বামে ঘোরান"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="tool-btn" id="btnRotateRight" title="ডানে ঘোরান"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <div class="cropper-actions">
                <button class="btn-crop-cancel" id="btnCancelCropAction">বাতিল</button>
                <button class="btn-crop-save" id="btnSaveCrop"><i class="fa-solid fa-check"></i> সেভ করুন</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>লিডারবোর্ড</span></a>
        <a href="ai-sensei.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>AI সেনসেই</span></a>
        <a href="profile.html" class="nav-item active"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANfr8MKJOG3VaDu2xO8rlz5wuQmHLjOYs",
            authDomain: "kotoba-b20b3.firebaseapp.com",
            projectId: "kotoba-b20b3",
            storageBucket: "kotoba-b20b3.firebasestorage.app",
            messagingSenderId: "556955805953",
            appId: "1:556955805953:web:cef5927677815bf5e05300",
            measurementId: "G-MXH61ERTC2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "qr.siamsikder@gmail.com";

        const avatarTrigger = document.getElementById("avatarTrigger");
        const avatarContainer = document.getElementById("avatarContainer");
        const imageInput = document.getElementById("imageInput");
        const cropperModal = document.getElementById("cropperModal");
        const imageToCrop = document.getElementById("imageToCrop");
        const btnSaveCrop = document.getElementById("btnSaveCrop");
        const btnCancelCrop = document.getElementById("btnCancelCrop");
        const btnCancelCropAction = document.getElementById("btnCancelCropAction");

        let currentUser = null;
        let cropper = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const displayName = user.displayName || user.email.split("@")[0];
                document.getElementById("displayUserName").innerText = displayName;
                document.getElementById("displayUserEmail").innerText = user.email;

                // Firestore থেকে ছবি লোড
                try {
                    const userDoc = await getDoc(doc(db, "users", user.email));
                    if (userDoc.exists() && userDoc.data().photoBase64) {
                        avatarContainer.innerHTML = `<img src="${userDoc.data().photoBase64}" alt="Profile">`;
                    } else if (user.photoURL) {
                        avatarContainer.innerHTML = `<img src="${user.photoURL}" alt="Profile">`;
                    } else {
                        avatarContainer.innerHTML = displayName.trim().charAt(0).toUpperCase();
                    }
                } catch (e) {
                    avatarContainer.innerHTML = displayName.trim().charAt(0).toUpperCase();
                }

                if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    document.getElementById("adminOption").style.display = "flex";
                }

                try {
                    const docSnap = await getDoc(doc(db, "user_highlights", user.email));
                    if (docSnap.exists() && docSnap.data().words) {
                        document.getElementById("hlWordCount").innerText = docSnap.data().words.length;
                    }
                } catch (e) {}
            } else {
                window.location.href = "login.html";
            }
        });

        avatarTrigger.addEventListener("click", () => imageInput.click());

        imageInput.addEventListener("change", (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imageToCrop.src = event.target.result;
                    cropperModal.style.display = "flex";

                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1,
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 0.85,
                        restore: false,
                        guides: false,
                        center: false,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false
                    });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        // ক্রপার টুলবার ইভেন্ট
        document.getElementById("btnZoomIn").onclick = () => cropper && cropper.zoom(0.1);
        document.getElementById("btnZoomOut").onclick = () => cropper && cropper.zoom(-0.1);
        document.getElementById("btnRotateLeft").onclick = () => cropper && cropper.rotate(-90);
        document.getElementById("btnRotateRight").onclick = () => cropper && cropper.rotate(90);

        function closeCropModal() {
            cropperModal.style.display = "none";
            if (cropper) cropper.destroy();
            imageInput.value = "";
        }
        btnCancelCrop.onclick = closeCropModal;
        btnCancelCropAction.onclick = closeCropModal;

        btnSaveCrop.addEventListener("click", async () => {
            if (!cropper || !currentUser) return;

            btnSaveCrop.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> সেভ হচ্ছে...`;
            btnSaveCrop.disabled = true;

            // অপ্টিমাইজড ২০০x২০০ পিক্সেল ক্রপ
            const canvas = cropper.getCroppedCanvas({
                width: 200, height: 200,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            const base64Image = canvas.toDataURL("image/jpeg", 0.75);

            try {
                // ১. Firestore-এ সেভ
                await setDoc(doc(db, "users", currentUser.email), {
                    email: currentUser.email,
                    userName: currentUser.displayName || currentUser.email.split("@")[0],
                    photoBase64: base64Image,
                    updatedAt: Date.now()
                }, { merge: true });

                // ২. Auth প্রোফাইল আপডেট
                await updateProfile(currentUser, { photoURL: base64Image });

                avatarContainer.innerHTML = `<img src="${base64Image}" alt="Profile">`;
                closeCropModal();
                alert("প্রোফাইল ছবি সফলভাবে আপডেট করা হয়েছে!");
            } catch (err) {
                console.error(err);
                alert("ছবি সেভ করতে সমস্যা হয়েছে!");
            } finally {
                btnSaveCrop.innerHTML = `<i class="fa-solid fa-check"></i> সেভ করুন`;
                btnSaveCrop.disabled = false;
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("আপনি কি নিশ্চিত লগআউট করতে চান?")) {
                await signOut(auth);
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
