<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N4 সম্পূর্ণ ব্যাকরণ সমগ্র (L26-L50) - KOTOBA</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- ফন্ট ও আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Hind+Siliguri:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper: #fbf7ef;
            --ink: #182620;
            --pine: #0B4A38;
            --jade: #147A57;
            --clay: #B6472E;
            --gold: #A9781F;
            --mist: #7C8A82;
            --line: #E9E2D3;
            --card-bg: #ffffff;
            --highlight: #ffeaa7;
            --highlight-text: #4d3a03;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding-bottom: 85px;
            min-height: 100vh;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(251, 247, 239, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--pine);
            background: #F0EAD9;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .back-btn:active { transform: scale(0.92); }

        .logo-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 17px;
            color: var(--pine);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .level-pill {
            background: var(--pine);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .container {
            padding: 14px 16px;
            max-width: 540px;
            margin: 0 auto;
        }

        .search-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .search-wrap input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
            background: var(--card-bg);
            color: var(--ink);
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.03);
            transition: border-color 0.2s;
        }

        .search-wrap input:focus { border-color: var(--jade); }

        .search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mist);
            font-size: 14px;
        }

        .subtitle-bar {
            text-align: center;
            font-size: 12.5px;
            color: var(--mist);
            font-weight: 600;
            margin-bottom: 16px;
            background: #F0EAD9;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-left: 4px solid var(--jade);
            border-radius: 14px;
            padding: 15px 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(11, 74, 56, 0.04);
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 108px;
        }

        .lesson-card:active { transform: scale(0.97); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .l-badge {
            background: #E6F3EC;
            color: var(--jade);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .kana-lesson-tag {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 11.5px;
            color: var(--mist);
            font-weight: 700;
        }

        .card-lesson-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .card-lesson-desc {
            font-size: 11px;
            color: var(--mist);
            line-height: 1.35;
        }

        .card-arrow {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            color: #cbd5e1;
            font-size: 11px;
        }

        .detail-view { display: none; }

        .detail-header-wrap {
            text-align: center;
            margin-bottom: 18px;
            padding: 6px 4px;
        }

        .detail-main-title {
            font-size: 21px;
            font-weight: 800;
            color: var(--pine);
            margin-bottom: 4px;
        }

        .detail-sub-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--mist);
        }

        .rule-card {
            background: var(--card-bg);
            border-radius: 14px;
            margin-bottom: 13px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: 0 3px 6px rgba(11, 74, 56, 0.03);
            transition: all 0.2s ease;
        }

        .rule-header {
            background: var(--pine);
            color: #ffffff;
            padding: 13px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            gap: 10px;
            transition: background 0.15s ease;
        }

        .rule-header:active { background: #093c2d; }

        .rule-header-left {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
        }

        .rule-header-left i.book-icon {
            font-size: 14px;
            margin-top: 3px;
            color: #ffffff;
            opacity: 0.9;
        }

        .rule-title-text {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.5;
            white-space: pre-line;
            font-family: 'Noto Sans JP', 'Hind Siliguri', sans-serif;
        }

        .rule-chevron {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }

        .rule-card.open .rule-chevron {
            transform: rotate(90deg);
            color: #ffffff;
        }

        .rule-body {
            display: none;
            padding: 16px 14px;
            background: #ffffff;
            border-top: 1px solid var(--line);
        }

        .rule-card.open .rule-body {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rule-desc {
            font-size: 13px;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 12px;
        }

        .formula-box {
            background: #FAF7F0;
            border: 1px dashed #D2DDD6;
            padding: 10px 13px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--pine);
            margin-bottom: 14px;
            line-height: 1.7;
            font-family: 'Noto Sans JP', 'Hind Siliguri', sans-serif;
        }

        .formula-box strong { color: var(--clay); }

        .note-box {
            background: #fff8eb;
            border: 1px solid #f6dca7;
            border-radius: 8px;
            padding: 9px 12px;
            margin: 12px 0;
            font-size: 12px;
            color: #7c5208;
            line-height: 1.6;
        }

        .sub-heading-point {
            font-size: 12.5px;
            font-weight: 800;
            color: var(--pine);
            margin: 14px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .examples-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .example-item {
            background: #FAF9F5;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .ex-text-wrap { flex: 1; }

        .jp-sentence {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.5;
            margin-bottom: 3px;
        }

        mark.hl {
            background-color: var(--highlight);
            color: var(--highlight-text);
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 800;
            border-bottom: 2px solid var(--gold);
        }

        .bn-sentence {
            font-size: 12px;
            color: var(--mist);
            line-height: 1.4;
        }

        .speak-btn {
            background: #E6F3EC;
            border: 1px solid #CCE7DC;
            color: var(--jade);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .speak-btn:active {
            transform: scale(0.9);
            background: var(--jade);
            color: #ffffff;
        }

        .lesson-jump-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            margin-bottom: 18px;
            padding: 14px 8px;
            position: relative;
        }

        .lesson-jump-nav::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 20%;
            height: 60%;
            width: 1px;
            background-color: var(--line);
            transform: translateX(-50%);
        }

        .jump-btn {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 48%;
        }

        .jump-btn.prev-btn { align-items: flex-start; text-align: left; }
        .jump-btn.next-btn { align-items: flex-end; text-align: right; }

        .jump-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--jade);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .jump-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--pine);
            line-height: 1.3;
        }

        .jump-btn:disabled, .jump-btn.disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 62px;
            background: rgba(251, 247, 239, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: var(--mist);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .nav-item.active { color: var(--jade); }
        .nav-item i { font-size: 17px; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="nav-left">
            <button class="back-btn" id="navBackBtn" onclick="handleBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo-text">
                KOTOBA <span class="level-pill">N4 GRAMMAR</span>
            </div>
        </div>
        <div style="font-size: 12px; font-weight: 700; color: var(--jade);">লেসন ২৬-৫০</div>
    </header>

    <main class="container">
        <!-- ভিউ ১: লেসন তালিকা -->
        <div id="lessonGridView">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="লেসন নম্বর বা ব্যাকরণের বিষয় দিয়ে খুঁজুন..." onkeyup="filterLessons()">
            </div>

            <div class="subtitle-bar">লেসন নির্বাচন করুন • সম্পূর্ণ ২৫টি পাঠ্য লেসন ও বোনাস সিট</div>
            <div class="lesson-grid" id="lessonsGridContainer"></div>
        </div>

        <!-- ভিউ ২: লেসন বিস্তারিত -->
        <div id="lessonDetailView" class="detail-view">
            <div class="detail-header-wrap">
                <h2 class="detail-main-title" id="detailMainTitle">লেসন ২৬</h2>
                <div class="detail-sub-title" id="detailSubTitle">লেসন ২৬ এর বিস্তারিত ব্যাকরণ</div>
            </div>

            <div id="rulesListContainer"></div>

            <div class="lesson-jump-nav">
                <button class="jump-btn prev-btn" id="btnPrevLesson" onclick="goToPrevLesson()">
                    <span class="jump-label">PREVIOUS</span>
                    <span class="jump-title" id="prevLessonTitle">লেসন ২৫</span>
                </button>
                <button class="jump-btn next-btn" id="btnNextLesson" onclick="goToNextLesson()">
                    <span class="jump-label">NEXT</span>
                    <span class="jump-title" id="nextLessonTitle">লেসন ২৭</span>
                </button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>হোম</span></a>
        <a href="leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i><span>লিডারবোর্ড</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script>
        const grammarData = {
            26: {
                minnaLesson: 26,
                title: "অভিব্যক্তি, কারণ ও বিনম্র অনুরোধ",
                kana: "だいにじゅうろっか",
                rules: [
                    {
                        title: "মূল ভিত্তি: Plain Form বা ふつうけい (চলিত রূপ)",
                        desc: "N4 লেভেল ভালোভাবে বোঝার জন্য Plain Form আয়ত্ত করা আবশ্যক। এটি মূলত Dictionary Form, た-Form এবং ない-Form এর সমন্বয়ে গঠিত।",
                        formula: "<strong>Verb:</strong> いく (Present Pos) | いかない (Present Neg) | いった (Past Pos) | いかなかった (Past Neg)<br><strong>い-adj:</strong> さむい | さむくない | さむかった | さむくなかった<br><strong>な-adj:</strong> げんきだ | げんきじゃない | げんきだった | げんきじゃなかった<br><strong>Noun:</strong> あめだ | あめじゃない | あめだった | あめじゃなかった",
                        note: "Noun এবং な-Adjective এ だ (দা) একই নিয়মে বসে।"
                    },
                    {
                        title: "Rule 1: Plain Form + んです (কারণ, ব্যাখ্যা ও অভিব্যক্তি)",
                        desc: "এর মাধ্যমে Expression বা অভিব্যক্তি প্রকাশ পায়। বলার সময় んです এবং লেখার সময় のです বসে। কোনো বিষয়ের কারণ জানতে んですか দিয়ে প্রশ্ন করা হয় এবং উত্তরে んです দিয়ে বলা হয়।",
                        formula: "<strong>Verb (Plain)</strong> + んです<br><strong>い-adj (Plain)</strong> + んです<br><strong>な-adj / Noun</strong> + <strong>なんです</strong> (だ হবে না, な হবে)",
                        note: "যখন んですか এর প্রয়োজন নেই তখন তা ব্যবহার করলে অদ্ভুত বা হাস্যকর শোনাতে পারে।",
                        examples: [
                            { jp: "あめが ふっている<mark class='hl'>んですか</mark>。･･･はい、あめが ふっている<mark class='hl'>んです</mark>。", bn: "বৃষ্টি হচ্ছে কি? হ্যাঁ, বৃষ্টি হচ্ছে।" },
                            { jp: "どうして おくれた<mark class='hl'>んですか</mark>。･･･バスが こなかった<mark class='hl'>んです</mark>。", bn: "কেন দেরি করেছিলে? বাস আসছিল না বলে।" },
                            { jp: "どうした<mark class='hl'>んですか</mark>。･･･ちょっと きぶんが わるい<mark class='hl'>んです</mark>。", bn: "কী হয়েছে? একটু শরীর খারাপ লাগছে।" },
                            { jp: "どこで かった<mark class='hl'>んですか</mark>。･･･スーパーで かった<mark class='hl'>んです</mark>。", bn: "কোথা থেকে কিনেছিলে? সুপার মার্কেট থেকে কিনেছিলাম।" },
                            { jp: "どうして かいしゃを やすんだ<mark class='hl'>んですか</mark>。･･･あたまが いたかった<mark class='hl'>んです</mark>。", bn: "কেন অফিস ছুটি নিয়েছিলে? মাথা ব্যথা ছিল বলে।" }
                        ]
                    },
                    {
                        title: "Rule 1.1: 〜んですが、〜 (অনুরোধ ও দাওয়াত)",
                        desc: "কাউকে কোনো অনুরোধ করা (Request) বা দাওয়াত (Invitation) করার পূর্বে ভূমিকা হিসেবে বসে।",
                        formula: "<strong>Plain Form</strong> + <strong>んですが</strong>、[অনুরোধ/দাওয়াত]",
                        examples: [
                            { jp: "あたまが いたい<mark class='hl'>んですが</mark>、かえっても いいですか。", bn: "মাথা ব্যথা করতেছে, আমি কি বাড়ি ফিরে যেতে পারি?" },
                            { jp: "らいしゅう スキーに いく<mark class='hl'>んですが</mark>、ミラーさんも いっしょに いきませんか。", bn: "আগামী সপ্তাহে স্কি করার জন্য যাব, মিলার সাহেবও একসাথে যাবেন নাকি?" },
                            { jp: "おゆが でない<mark class='hl'>んですが</mark>･････。", bn: "গরম পানি বের হচ্ছে না･････।" }
                        ]
                    },
                    {
                        title: "Rule 2: Vて-form + いただけませんか (করে দেবেন কি?)",
                        desc: "কারও কাছে বিনম্রভাবে অনুরোধ করার জন্য এটি ব্যবহৃত হয়। এটি মূলত Vて-form + ください এর অতি ভদ্র ও মার্জিত রূপ।",
                        formula: "<strong>Verb (て-form)</strong> + <strong>いただけませんか</strong>",
                        examples: [
                            { jp: "いい せんせいを しょうかいして <mark class='hl'>いただけませんか</mark>。", bn: "ভালো শিক্ষকের সাথে পরিচয় করিয়ে দেবেন কি?" },
                            { jp: "しりょうが ほしいんですが、おくって <mark class='hl'>いただけませんか</mark>。", bn: "ডকুমেন্ট চাই বলে, পাঠিয়ে দেবেন কি?" },
                            { jp: "かきかたが わからないんですが、おしえて <mark class='hl'>いただけませんか</mark>。", bn: "লেখার পদ্ধতি বুঝতে পারছি না, বুঝিয়ে দেবেন কি?" }

                            { jp: "ぶちょうは ミラーさん<mark class='hl'>を</mark> アメリカへ しゅっちょう<mark class='hl'>させました</mark>。", bn: "ম্যানেজার মিলার সাহেবকে আমেরিকাতে ব্যবসায়িক সফর করিয়েছিলেন।" },
                            { jp: "せんせいは せいと<mark class='hl'>に</mark> じゆうに いけんを <mark class='hl'>いわせました</mark>。", bn: "শিক্ষক ছাত্রকে স্বাধীনভাবে মতামত দিতে বলেছিলেন।" },
                            { jp: "おとうとに へやを そうじ<mark class='hl'>させます</mark>。", bn: "ছোট ভাইকে দিয়ে নিজের রুম পরিষ্কার করাব।" }
                        ]
                    },
                    {
                        title: "Rule 3: Causative て-form + いただけませんか (অনুমতি চাওয়া)",
                        desc: "আমাকে কোনো কাজ করতে অনুমতি দেবেন কি—এমন বিনীত প্রার্থনা।",
                        formula: "<strong>Causative Verb (て-form)</strong> + <strong>いただけませんか</strong>",
                        examples: [
                            { jp: "すみませんが、あした <mark class='hl'>やすませて いただけませんか</mark>。", bn: "দুঃখিত, কিন্তু আগামীকাল ছুটি দেবেন কি?" },
                            { jp: "ともだちの けっこんしきが あるので、はやく <mark class='hl'>かえらせて いただけませんか</mark>。", bn: "বন্ধুর বিয়ে আছে বলে দ্রুত ফিরে যেতে দেবেন কি?" }
                        ]
                    }
                ]
            },
            49: {
                minnaLesson: 49,
                title: "সম্মানসূচক ভাষা (そんけいご - Respectful)",
                kana: "だいにじゅうきゅうか",
                rules: [
                    {
                        title: "Rule 1: そんけいご Passive রূপান্তর",
                        desc: "সম্মানিত ব্যক্তির কাজকে শ্রদ্ধা জানাতে Passive রূপ ব্যবহার করা হয়।",
                        formula: "G1: あ-কলাম + れます | G2: られます | きます→こられます | します→されます",
                        examples: [
                            { jp: "いとう せんせいは さっき <mark class='hl'>こられました</mark>。", bn: "ইতো শিক্ষক কিছুক্ষণ আগে এসেছিলেন।" },
                            { jp: "おさけを <mark class='hl'>やめられたんですか</mark>。", bn: "মদ ছেড়ে দিয়েছেন কি?" }
                        ]
                    },
                    {
                        title: "Rule 2: お + Verbます কেটে + に なります",
                        desc: "সাধারণ ক্রিয়ার পূর্বে お এবং শেষে に なります বসিয়ে সম্মানিত করা।",
                        formula: "<strong>お + Verb (ます কেটে) + に なります</strong>",
                        examples: [
                            { jp: "しゃちょうは <mark class='hl'>おかえりに なりました</mark>。", bn: "বস বাড়ি ফিরে গিয়েছিলেন।" },
                            { jp: "しゃちょうは <mark class='hl'>おでかけに なりました</mark>。", bn: "বস বাইরে বের হয়ে গিয়েছিলেন।" }
                        ]
                    },
                    {
                        title: "Rule 3: বিশেষ সম্মানসূচক শব্দসমূহ (そんけいご Verbs)",
                        desc: "নির্ধারিত সম্মানজনক শব্দাবলী।",
                        formula: "いきます/きます/います → <strong>いらっしゃいます</strong><br>たべます/のみます → <strong>めしあがります</strong><br>いいます → <strong>おっしゃいます</strong><br>しっています → <strong>ごぞんじです</strong><br>みます → <strong>ごらんに なります</strong><br>します → <strong>なさいます</strong><br>くれます → <strong>くださいます</strong>",
                        examples: [
                            { jp: "しゃちょうは かいぎしつに <mark class='hl'>いらっしゃいます</mark>。", bn: "বস মিটিং রুমে আছেন।" },
                            { jp: "しゃちょうは ゴルフを <mark class='hl'>なさいます</mark>。", bn: "বস গলফ খেলছেন।" }
                        ]
                    },
                    {
                        title: "Rule 4: お / ご ････ ください (সম্মানিত অনুরোধ)",
                        desc: "কাউকে সম্মান প্রদর্শন করে অনুরোধ করতে বসে।",
                        formula: "<strong>お + Vます কেটে + ください</strong> / <strong>ご + Noun + ください</strong>",
                        examples: [
                            { jp: "どうぞ <mark class='hl'>おはいり ください</mark>。", bn: "প্রবেশ করুন দয়া করে।" },
                            { jp: "<mark class='hl'>おかけ ください</mark>。", bn: "বসুন দয়া করে।" },
                            { jp: "<mark class='hl'>ごちゅうい ください</mark>。", bn: "সতর্ক হোন দয়া করে।" }
                        ]
                    }
                ]
            },
            50: {
                minnaLesson: 50,
                title: "বিনম্র ভাষা (けんじょうご - Humble)",
                kana: "だいごじゅっか",
                rules: [
                    {
                        title: "Rule 1: お / ご ････ します (বিনম্র সেবা প্রদান)",
                        desc: "নিজের কাজকে বিনয়ের সাথে তুলে ধরে অপরকে সম্মান জানানো।",
                        formula: "G1/G2: <strong>お + Vます কেটে + します</strong><br>G3: <strong>ご + Noun + します</strong>",
                        examples: [
                            { jp: "わたくしが コーヒーを <mark class='hl'>おいれします</mark>。", bn: "আমি কফি তৈরি করতে পারি।" },
                            { jp: "えきまで <mark class='hl'>おおくりします</mark>。", bn: "আমি স্টেশন পর্যন্ত পৌঁছে দেব।" },
                            { jp: "きょうの よていを <mark class='hl'>ごせつめいします</mark>。", bn: "আমি আজকের পরিকল্পনা ব্যাখ্যা করব।" },
                            { jp: "おもそうですね。<mark class='hl'>おもちしましょうか</mark>。", bn: "ভারী তাই না? ধরে সাহায্য করব কি?" }
                        ]
                    },
                    {
                        title: "Rule 2: বিশেষ বিনম্র ক্রিয়াপদসমূহ (けんじょうご Verbs)",
                        desc: "নিজের কাজের জন্য মার্জিত শব্দাবলী।",
                        formula: "いきます/きます → <strong>まいります</strong><br>います → <strong>おります</strong><br>たべます/のみます/もらいます → <strong>いただきます</strong><br>いいます → <strong>もうします</strong><br>します → <strong>いたします</strong><br>しっています → <strong>ぞんじて おります / ぞんじます</strong><br>しりません → <strong>ぞんじません</strong><br>みます → <strong>はいけんします</strong><br>ききます/いきます → <strong>うかがいます</strong><br>あいます → <strong>おめに かかります</strong>",
                        examples: [
                            { jp: "あした 3じに おたくへ <mark class='hl'>うかがいます</mark>。", bn: "আগামীকাল ৩টায় বাড়ি যাব/উপস্থিত হব।" },
                            { jp: "わたくしは ミラーと <mark class='hl'>もうします</mark>。", bn: "আমাকে মিলার বলা হয় / আমি মিলার বলছি।" },
                            { jp: "IMCに つとめて <mark class='hl'>おります</mark>。", bn: "আমি আইএমসিতে কাজ করছি।" },
                            { jp: "アメリカから <mark class='hl'>まいりました</mark>。", bn: "আমেরিকা থেকে এসেছি।" }
                        ]
                    }
                ]
            },
            51: {
                minnaLesson: "Bonus",
                title: "N4 ২২টি な-Adjective তালিকা",
                kana: "ボーナスシート",
                rules: [
                    {
                        title: "পিডিএফের বোনাস: N4-এর সম্পূর্ণ ২২টি な (না) Adjective",
                        desc: "JLPT ও NAT N4 পরীক্ষার জন্য অত্যন্ত গুরুত্বপূর্ণ ২২টি な-Adjective তালিকা।",
                        formula: "১) しんぱいな (দুশ্চিন্তা)<br>২) だいすきな (বেশি পছন্দ করা)<br>৩) ふしぎな (রহস্যময়)<br>৪) まじめな (সিরিয়াস)<br>৫) ねっしんな (উদ্যমী)<br>৬) いやな (অনিচ্ছাকৃত/ঘৃণা করা)<br>৭) じゅうぶんな (পর্যাপ্ত)<br>৮) ひつような (প্রয়োজনীয়)<br>৯) とくべつな (স্পেশাল)<br>১০) ごうかな (গর্জিয়াস)<br>১১) ふくざつな (জটিল)<br>১২) じゃまな (বাধা)<br>১৩) でんとうてきな (ঐতিহ্যগত)<br>১৪) まっしろな (খাঁটি সাদা)<br>১৫) じょうぶな (শক্তিশালী)<br>১৬) へんな (অদ্ভুত)<br>১৭) しあわせな (খুশি বা সুখী)<br>১৮) らくな (সহজ)<br>১৯) あんぜんな (নিরাপদ)<br>২০) きけんな (বিপদজনক)<br>২১) あんしんな (স্বস্তিদায়ক/মুক্তি পাওয়া)<br>২২) だめな (নিষিদ্ধ/ভালো না)",
                        examples: [
                            { jp: "この へやは <mark class='hl'>しずかです</mark>。", bn: "এই রুমটি শান্ত।" }
                        ]
                    }
                ]
            }
        };

        let currentActiveLesson = 26;

        function renderLessonGrid() {
            const container = document.getElementById("lessonsGridContainer");
            container.innerHTML = "";

            for (let i = 26; i <= 51; i++) {
                const item = grammarData[i];
                const card = document.createElement("div");
                card.className = "lesson-card";
                const isBonus = i === 51;
                card.setAttribute("data-key", `lesson ${i} লেসন ${isBonus ? 'বোনাস' : toBn(i)} ${item.title} ${item.kana}`);
                card.onclick = () => openLessonDetail(i);

                card.innerHTML = `
                    <div class="card-top">
                        <span class="l-badge">${isBonus ? 'BONUS' : 'L-' + i}</span>
                        <span class="kana-lesson-tag">${item.kana}</span>
                    </div>
                    <div class="card-lesson-title">${isBonus ? 'বোনাস সিট' : 'লেসন ' + toBn(i)}</div>
                    <div class="card-lesson-desc">${item.title}</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                `;
                container.appendChild(card);
            }
        }

        function openLessonDetail(lessonNo, pushHistory = true) {
            const item = grammarData[lessonNo] || grammarData[26];
            currentActiveLesson = lessonNo;

            document.getElementById("lessonGridView").style.display = "none";
            document.getElementById("lessonDetailView").style.display = "block";

            const isBonus = lessonNo === 51;
            document.getElementById("detailMainTitle").innerText = isBonus ? `N4 বোনাস: ২২টি な-Adjective` : `N4_ব্যাকরণ লেসন ${toBn(lessonNo)}`;
            document.getElementById("detailSubTitle").innerText = isBonus ? `পরীক্ষার গুরুত্বপূর্ণ বিশেষণ তালিকা` : `লেসন ${toBn(lessonNo)} (${item.kana}) এর সম্পূর্ণ ব্যাকরণ`;

            const rulesContainer = document.getElementById("rulesListContainer");
            rulesContainer.innerHTML = "";

            item.rules.forEach((r) => {
                const ruleCard = document.createElement("div");
                ruleCard.className = "rule-card";

                let noteHtml = r.note ? `<div class="note-box"><i class="fa-solid fa-circle-info"></i> <strong>নোট:</strong> ${r.note}</div>` : '';

                let exHtml = "";
                if (r.examples && r.examples.length > 0) {
                    exHtml = `
                        <div class="sub-heading-point"><i class="fa-solid fa-circle-check" style="color:var(--jade);"></i> উদাহরণ বাক্য:</div>
                        <div class="examples-wrapper">
                            ${r.examples.map(ex => `
                                <div class="example-item">
                                    <div class="ex-text-wrap">
                                        <div class="jp-sentence">${ex.jp}</div>
                                        <div class="bn-sentence">${ex.bn}</div>
                                    </div>
                                    <button class="speak-btn" onclick="speakText(this)" data-speech="${stripHtml(ex.jp)}" title="উচ্চারণ শুনুন">
                                        <i class="fa-solid fa-volume-high"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                ruleCard.innerHTML = `
                    <div class="rule-header" onclick="toggleRuleCard(this)">
                        <div class="rule-header-left">
                            <i class="fa-solid fa-book-open book-icon"></i>
                            <span class="rule-title-text">${r.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right rule-chevron"></i>
                    </div>
                    <div class="rule-body">
                        <p class="rule-desc">${r.desc}</p>
                        ${r.formula ? `<div class="formula-box">${r.formula}</div>` : ''}
                        ${noteHtml}
                        ${exHtml}
                    </div>
                `;
                rulesContainer.appendChild(ruleCard);
            });

            updateJumpButtons();
            window.scrollTo({ top: 0, behavior: "smooth" });

            if (pushHistory) {
                history.pushState({ view: "detail", lesson: lessonNo }, "");
            }
        }

        function toggleRuleCard(header) {
            const currentCard = header.parentElement;
            const isAlreadyOpen = currentCard.classList.contains("open");
            document.querySelectorAll(".rule-card").forEach(c => c.classList.remove("open"));
            if (!isAlreadyOpen) {
                currentCard.classList.add("open");
            }
        }

        function updateJumpButtons() {
            const prevBtn = document.getElementById("btnPrevLesson");
            const nextBtn = document.getElementById("btnNextLesson");
            const prevTitle = document.getElementById("prevLessonTitle");
            const nextTitle = document.getElementById("nextLessonTitle");

            const prevNum = currentActiveLesson - 1;
            const nextNum = currentActiveLesson + 1;

            if (prevNum < 26) {
                prevBtn.classList.add("disabled");
                prevTitle.innerText = "শুরু";
            } else {
                prevBtn.classList.remove("disabled");
                prevTitle.innerText = prevNum === 51 ? 'বোনাস' : `লেসন ${toBn(prevNum)}`;
            }

            if (nextNum > 51) {
                nextBtn.classList.add("disabled");
                nextTitle.innerText = "শেষ";
            } else {
                nextBtn.classList.remove("disabled");
                nextTitle.innerText = nextNum === 51 ? 'বোনাস' : `লেসন ${toBn(nextNum)}`;
            }
        }

        function goToPrevLesson() {
            if (currentActiveLesson > 26) openLessonDetail(currentActiveLesson - 1);
        }

        function goToNextLesson() {
            if (currentActiveLesson < 51) openLessonDetail(currentActiveLesson + 1);
        }

        function handleBack(fromHistory = false) {
            if (document.getElementById("lessonDetailView").style.display === "block") {
                document.getElementById("lessonDetailView").style.display = "none";
                document.getElementById("lessonGridView").style.display = "block";
                window.scrollTo({ top: 0, behavior: "smooth" });

                if (!fromHistory && history.state && history.state.view === "detail") {
                    history.back();
                }
            } else {
                window.location.href = "index.html";
            }
        }

        window.addEventListener("popstate", (event) => {
            if (event.state && event.state.view === "detail") {
                openLessonDetail(event.state.lesson, false);
            } else {
                handleBack(true);
            }
        });

        function filterLessons() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const cards = document.querySelectorAll(".lesson-card");

            cards.forEach(card => {
                const key = card.getAttribute("data-key").toLowerCase();
                card.style.display = key.includes(query) ? "flex" : "none";
            });
        }

        function stripHtml(html) {
            const tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        function speakText(btn) {
            const text = btn.getAttribute('data-speech');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toBn(n) {
            const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return n.toString().split('').map(d => digits[d] || d).join('');
        }

        history.replaceState({ view: "grid" }, "");
        renderLessonGrid();
    </script>
</body>
</html>
